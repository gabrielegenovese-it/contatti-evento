<style>
:root{--gut:50px;--viola:#6a4a9c;--viola2:#ece3f7;--bordeaux:#8e1f2f;--rosa:#ffe9ee;--inchiostro:#2a2024;--grigio:#6e5f68;--linea:#f3dfe6;--fondo:#fff8fa;--rosso:#b3261e;--verde:#1e7a4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input,select,label{touch-action:manipulation}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--inchiostro);background:var(--fondo);display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 13px;min-height:42px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--viola);outline-offset:1px}
button.pieno{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;font-weight:600}
button.pericolo{color:var(--rosso);border-color:#e7c3c0}
button.wa{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
input,select,textarea{width:100%;border:1px solid #cfc8d8;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label.riga{display:flex;gap:8px;align-items:center;font-weight:400}
label.riga input{width:auto;min-height:0}
header{background:var(--rosa);border-bottom:1px solid #fcd4df;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0 auto 0 0;line-height:0}
header h1 img{height:52px;width:auto;mix-blend-mode:multiply}
nav button{color:#5d4f57}
a.bottone{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 13px;min-height:42px;color:inherit;text-decoration:none}
.ico{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--grigio)}
nav button.attivo{background:#fff;color:var(--viola);font-weight:600}
main{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.scorre{flex:1;min-height:0;overflow:auto}
.contenuto{max-width:760px;width:100%;flex:none;margin:0 auto;padding:14px}
.barra{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.barra strong{font-size:17px;text-transform:capitalize}
.settimana{display:flex;gap:4px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--linea);overflow-x:auto}
.settimana button{flex:1;min-width:58px;padding:5px 3px;font-size:13px;line-height:1.25}
.settimana button.oggi{border-color:var(--viola)}
.settimana button.scelto{background:var(--viola);color:#fff;border-color:var(--viola)}
.settimana small{display:block;opacity:.8}
.grigliaZona{display:flex;min-width:100%;position:relative}
.ore{width:var(--gut);flex:none;position:sticky;left:0;background:var(--fondo);z-index:3;border-right:1px solid var(--linea)}
.ora{position:absolute;font-size:12px;color:var(--grigio);right:6px;transform:translateY(-50%)}
.colonna{flex:1;min-width:0;border-right:1px solid var(--linea)}
.testate{position:sticky;top:0;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--linea)}
.angolo{width:var(--gut);flex:none;border-right:1px solid var(--linea)}
.tab{flex:1;min-width:0;border:0;border-radius:0;border-bottom:3px solid var(--c);background:#fff;font-weight:600;font-size:14px;padding:6px 2px;min-height:40px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[data-zoom]{background:var(--c2)}
.tab.attiva[data-zoom]{background:var(--c);color:#fff}
.scale{display:flex;gap:2px;margin-left:8px;background:var(--viola2);border-radius:10px;padding:2px}
.scale button{border:0;background:none;min-height:36px;padding:4px 11px;font-size:14px;color:var(--viola)}
.scale button.attiva{background:var(--viola);color:#fff;font-weight:600}
.filtri{display:flex;background:#fff;border-bottom:1px solid var(--linea)}
.sett .app{padding:1px 2px;font-size:11px;border-left-width:2px;min-height:14px}
.sett .app b{white-space:nowrap}
.sett.solo1 .app{font-size:12px;padding:1px 4px}
.tab.oggi{color:var(--viola);text-decoration:underline}
.mese{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(92px,1fr);min-height:100%}
.testaMese{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border-bottom:1px solid var(--linea);font-size:13px;text-align:center;color:var(--grigio);padding:4px 0;text-transform:capitalize}
.cella{border:0;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);border-radius:0;background:#fff;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:0;font-size:14px}
.cella.fuori{background:var(--fondo);color:#a59eae}
.cella.chiusa{background:repeating-linear-gradient(45deg,#fdeef2,#fdeef2 6px,#fff6f8 6px,#fff6f8 12px)}
.cella.oggi b{background:var(--viola);color:#fff;border-radius:99px;padding:0 7px}
.cella small{color:var(--grigio)}
.barre{display:flex;gap:2px;height:7px;margin-top:auto}
.barre i{display:block;background:var(--c);border-radius:2px;min-width:3px}
.anno{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:14px}
.miniMese{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px}
.miniMese>button{width:100%;border:0;min-height:34px;padding:2px 4px;display:flex;justify-content:space-between;font-weight:600;text-transform:capitalize}
.miniGiorni{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.miniGiorni button{min-height:27px;padding:0;border:0;border-radius:5px;font-size:12px;background:hsl(263 36% var(--l,98%));color:var(--t,inherit)}
.miniGiorni button.oggi{outline:2px solid var(--viola)}
.stretta{flex:.6}
.solo .stretta{flex:.45}
div.tab{display:flex;align-items:center;justify-content:center;color:var(--grigio)}
.pista{position:relative;cursor:copy;background-image:linear-gradient(to bottom,var(--linea) 1px,transparent 1px);background-size:100% var(--oraPx)}
.chiuso{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#fbe6ec,#fbe6ec 6px,#fff1f4 6px,#fff1f4 12px);pointer-events:none}
.adesso{position:absolute;left:0;right:0;height:2px;background:var(--rosso);z-index:1;pointer-events:none}
.app{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--c);background:var(--c2);border-radius:6px;padding:2px 6px;text-align:left;font-size:13px;line-height:1.2;overflow:hidden;min-height:22px;z-index:1}
.app b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4f4759}
.app u{text-decoration:none}
.etichetta{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;background:var(--c);color:#fff;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.app .corto{display:none}
.app.esterno{background:#eef0f3;border-left-color:#7c8796;border-left-style:dashed}
.app.fatto{opacity:.6}
.app.noshow{opacity:.55}
.app.noshow b{text-decoration:line-through}
.ope{display:flex;gap:6px;flex-wrap:wrap}
.ope button{min-height:40px;padding:6px 12px;font-size:14px;border-bottom:3px solid var(--c,var(--linea))}
.ope button.attiva{background:var(--c,var(--inchiostro));border-color:var(--c,var(--inchiostro));color:#fff;font-weight:600}
.pallino{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.giornata{padding:6px 14px;background:#fff6dd;font-size:14px;border-bottom:1px solid var(--linea)}
.scheda{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px}
.scheda.cliccabile{cursor:pointer;display:block;width:100%;text-align:left}
.tenue{color:var(--grigio);font-size:14px}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 16px 50px rgba(30,15,50,.3)}
dialog::backdrop{background:rgba(30,20,45,.45)}
.dentro{padding:16px}
.dentro h2{margin:0 0 6px;font-size:19px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--viola2);border-radius:99px;padding:4px 6px 4px 11px;margin:3px 4px 3px 0;font-size:14px}
.chip button{min-height:28px;min-width:28px;padding:0;border:0;background:none}
.lista{max-height:190px;overflow:auto;border:1px solid var(--linea);border-radius:10px;margin-top:6px}
.lista button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);border-radius:0;background:#fff;display:flex;justify-content:space-between;gap:10px}
.lista .cat{font-size:12px;font-weight:700;padding:6px 12px;background:var(--fondo);color:var(--grigio)}
.liberi{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.liberi button{font-size:14px;min-height:38px;padding:5px 10px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.totale{display:flex;justify-content:space-between;font-weight:600;margin-top:12px;padding:10px 12px;background:var(--viola2);border-radius:10px}
.avviso{background:#fff6dd;border:1px solid #ecd892;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.avviso.errore{background:#fbeae9;border-color:#e7c3c0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--inchiostro);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;display:none}
.riga-serv{display:grid;grid-template-columns:1fr 66px 66px 96px 36px;gap:6px;align-items:center;margin-bottom:6px}
.riga-serv input,.riga-serv select{padding:6px 8px;min-height:38px}
.riga-serv button{min-height:36px;padding:0}
.stimata input:nth-child(2){border-color:#d4a72c;background:#fff6dd}
@media (max-width:620px){nav{order:3;width:100%}nav button{flex:1;padding:8px 2px}
:root{--gut:36px}.scale{margin-left:0;width:100%}.scale button{flex:1;padding:4px 2px}.mese{grid-auto-rows:minmax(64px,1fr)}.cella{padding:3px}.cella small{font-size:11px}.sett:not(.solo1) .app b,.sett:not(.solo1) .app span{display:none}
.riga-serv{grid-template-columns:1fr 1fr 1.3fr 36px}.riga-serv input[data-k="nome"]{grid-column:1/-1}.contaGiorno{display:none}.ora{font-size:11px;right:3px}.tab{font-size:13px}
.compatta .app{left:1px!important;padding:1px 3px;font-size:12px;border-left-width:3px}.compatta .app b{white-space:normal}.compatta .app span{display:none}.compatta .app .lungo{display:none}.compatta .app .corto{display:inline}}
@media (max-width:620px){
header{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;justify-content:center}
header h1{margin:0}
header h1 img{height:46px}
main{margin-bottom:calc(60px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;order:0;width:auto;gap:0;background:#fff;border-top:1px solid var(--linea);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(60,30,60,.06)}
nav button.attivo{background:var(--viola2);color:var(--viola)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:4px 0;font-size:11px;border-radius:12px}
.ico{display:block}
#btnNuovo{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:60px;height:60px;min-height:0;padding:0;border-radius:50%;font-size:0;box-shadow:0 8px 22px rgba(142,31,47,.4)}
#btnNuovo::before{content:"+";font-size:32px;line-height:1;font-weight:400}
body.modulo #btnNuovo{display:none}
.barra{padding:6px 10px;gap:6px}
.barra #ieri{order:1}.barra strong{order:2;flex:1;min-width:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barra #domani{order:3}.barra #oggi{order:4;padding:6px 10px}
.barra>button{min-height:44px;min-width:44px;padding:6px}
.scale{order:5}.scale button{min-height:40px}
.settimana{padding:5px 8px}.settimana button{min-height:44px;min-width:52px;font-size:12px}
.tab{min-height:44px}
.scorre{padding-bottom:84px}
.contenuto{padding:12px 12px 90px}
.anno{grid-template-columns:1fr;padding:10px 10px 90px}
.miniGiorni button{min-height:42px;font-size:14px}
.miniMese>button{min-height:44px}
.chip button{min-height:36px;min-width:36px}
.liberi button{min-height:44px}
.lista button{min-height:48px}
.ope{display:grid;grid-template-columns:repeat(3,1fr)}
.ope button{min-height:46px;padding:6px 4px}
div.tab{font-size:11px}
#toast{bottom:calc(150px + env(safe-area-inset-bottom))}
dialog{width:100vw;max-width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:18px 18px 0 0}
.dentro{padding:18px 14px 0}
.dentro>.azioni:last-child{position:sticky;bottom:0;background:#fff;margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);z-index:2}
.dentro>.azioni:last-child>button{min-height:48px;flex:1}
.azioni>button,.azioni>a{min-height:46px}
.scheda.cliccabile{min-height:60px}
}
@media (max-height:480px) and (orientation:landscape){
header{display:none}
main{margin-bottom:0}
nav{position:static}
}
#fumetto{position:fixed;z-index:30;display:none;width:250px;background:#fff;border:1px solid var(--linea);border-top:4px solid var(--c);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(60,30,60,.22);pointer-events:none}
#fumetto b{display:block;font-size:15px}
#fumetto .riga{color:var(--grigio);font-size:13px;margin-top:2px}
#fumetto .tratt{margin-top:5px}
#fumetto .fondoF{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px}
#fumetto .nota{margin-top:5px;font-size:13px;font-style:italic}
.tre{grid-template-columns:1.4fr 1fr 1fr}
.tre>*{min-width:0}
.tab .cal2{display:none}
.app.blocco{background:repeating-linear-gradient(135deg,#f3eff2,#f3eff2 6px,#e7e1e6 6px,#e7e1e6 12px);border-left-color:var(--c)}
.app.blocco.pertutte{z-index:0;border-left-color:#7c8796}
@media (max-width:620px){.tre{grid-template-columns:1fr 1fr}.tre>:first-child{grid-column:1/-1}.tab .cal1{display:none}.tab .cal2{display:inline}}
#provaBar{background:#2a2024;color:#fff;font-size:13px;padding:5px 12px calc(5px) ;display:flex;gap:10px;align-items:center;justify-content:center;padding-top:calc(5px + env(safe-area-inset-top))}
#provaBar button{min-height:30px;padding:2px 10px;font-size:12px;background:none;color:#fff;border-color:#8b7f86}
</style>
</head>

<script>window.__SCRIPT_GS = "// Agenda di Alessia: il \"motore\" dell'app. Gira nell'account Google di Alessia.\n// Appuntamenti = eventi del suo Google Calendar. Clienti e impostazioni = questo foglio Google.\n// Va incollato in: foglio Google → Estensioni → Apps Script, poi Distribuisci → App web\n// (Esegui come: me · Chi può accedere: chiunque). L'accesso vero lo fa il CODICE segreto.\n\nconst CODICE = \"demo\";\nconst CALENDARIO_ID = \"\";          // vuoto = calendario principale; altrimenti l'ID di quello degli appuntamenti\nconst TAG = \"agenda\";              // i dati dell'app stanno in un solo tag dell'evento (massimo ~1000 caratteri)\nconst MAX_TAG = 900;\nconst TUTTE = \"Tutte\";             // un blocco orario può valere per tutte le operatrici\nconst PREFISSO_BLOCCO = \"Bloccato\";\nconst INTESTAZIONE = [\"ID\", \"Nome\", \"Telefono\", \"Email\", \"Note\", \"Consenso promemoria\", \"Creata\"];\n\nfunction doGet() {\n  return risposta({ ok: true, servizio: \"agenda-alessia\" });\n}\n\nfunction doPost(e) {\n  let d;\n  try { d = JSON.parse(e.postData.contents); } catch (err) { return risposta({ ok: false, errore: \"formato\" }); }\n  if (d.codice !== CODICE) return risposta({ ok: false, errore: \"codice\" });\n\n  const azioni = { prova, carica, conteggi, salvaAppuntamento, eliminaAppuntamento, storico, salvaCliente, eliminaCliente, salvaImpostazioni };\n  const azione = azioni[d.azione];\n  if (!azione) return risposta({ ok: false, errore: \"azione\" });\n\n  // Le scritture passano una alla volta: due telefoni non possono prendere lo stesso posto insieme.\n  const scrive = /^(salva|elimina)/.test(d.azione);\n  const lock = LockService.getScriptLock();\n  try {\n    if (scrive) lock.waitLock(20000);\n    return risposta(azione(d));\n  } catch (err) {\n    return risposta({ ok: false, errore: \"interno\", dettaglio: String(err && err.message || err) });\n  } finally {\n    if (scrive) lock.releaseLock();\n  }\n}\n\nfunction prova() {\n  return { ok: true, foglio: SpreadsheetApp.getActiveSpreadsheet().getName(), calendario: calendario().getName() };\n}\n\nfunction carica(d) {\n  const eventi = calendario().getEvents(new Date(d.dal), new Date(d.al));\n  return {\n    ok: true,\n    appuntamenti: eventi.map(leggiEvento),\n    clienti: leggiClienti(),\n    impostazioni: leggiImpostazioni()\n  };\n}\n\n// --- Appuntamenti -------------------------------------------------------\n\nfunction salvaAppuntamento(d) {\n  const a = d.appuntamento;\n  if (!a || !a.inizio || !a.fine || !a.operatrice) return { ok: false, errore: \"formato\" };\n  const inizio = new Date(a.inizio), fine = new Date(a.fine);\n  if (!(fine > inizio)) return { ok: false, errore: \"orario\" };\n\n  const dati = JSON.stringify({\n    c: a.clienteId || \"\", n: a.cliente || \"\", t: a.telefono || \"\", s: a.servizi || [],\n    o: a.operatrice, st: a.stato || \"prenotato\", p: a.prezzo || 0, r: a.promemoria || \"\", u: a.usa || [], b: a.blocco ? 1 : 0\n  });\n  if (dati.length > MAX_TAG) return { ok: false, errore: \"troppi-servizi\" };\n\n  const cal = calendario();\n  let evento = null;\n  if (a.id) {\n    evento = cal.getEventById(a.id);\n    if (!evento) return { ok: false, errore: \"sparito\" };\n  }\n\n  if (!d.forza) {\n    const sovrapposti = cal.getEvents(inizio, fine)\n      .filter(function (ev) {\n        return (!evento || ev.getId() !== evento.getId())\n          && !ev.isAllDayEvent()\n          && ev.getStartTime() < fine && ev.getEndTime() > inizio;\n      })\n      .map(leggiEvento)\n      .filter(function (x) { return x.esterno || x.stato !== \"noshow\"; });\n    const esterni = sovrapposti.filter(function (x) { return x.esterno; });\n    const nostri = sovrapposti.filter(function (x) { return !x.esterno; });\n    // Un evento scritto a mano non dice di chi è: conta come una persona occupata.\n    const impegnate = {};\n    nostri.forEach(function (x) { if (x.operatrice !== TUTTE) impegnate[x.operatrice] = true; });\n    const libere = (d.operatrici || 1) - Object.keys(impegnate).length;\n    const tocca = function (x) { return a.operatrice === TUTTE || x.operatrice === a.operatrice || x.operatrice === TUTTE; };\n    const conflitti = nostri.filter(tocca).concat(!a.blocco && esterni.length >= libere ? esterni : []);\n    if (conflitti.length) return { ok: false, errore: \"conflitto\", conflitti: conflitti };\n\n    // Cabine, postazioni e laser: conta il massimo in uso nello stesso momento, non il totale della fascia.\n    const capienza = d.risorse || {};\n    const usa = a.usa || [];\n    for (let i = 0; i < usa.length; i++) {\n      const voci = sovrapposti.filter(function (x) { return (x.usa || []).indexOf(usa[i]) >= 0; });\n      if (capienza[usa[i]] != null && picco(voci, inizio.getTime(), fine.getTime()) >= capienza[usa[i]]) {\n        return { ok: false, errore: \"conflitto\", risorsa: usa[i], conflitti: voci };\n      }\n    }\n  }\n\n  const titolo = a.blocco\n    ? PREFISSO_BLOCCO + (a.cliente && a.cliente !== PREFISSO_BLOCCO ? \" — \" + a.cliente : \"\") + \" (\" + a.operatrice + \")\"\n    : (a.cliente || \"Appuntamento\") + \" — \" + (a.servizi || []).join(\", \");\n  const descrizione = \"Operatrice: \" + a.operatrice\n    + (a.telefono ? \"\\nTelefono: \" + a.telefono : \"\")\n    + (a.note ? \"\\nNote: \" + a.note : \"\")\n    + (a.clienteId ? \"\\nrif:\" + a.clienteId : \"\");\n\n  if (evento) {\n    evento.setTime(inizio, fine);\n    evento.setTitle(titolo);\n    evento.setDescription(descrizione);\n  } else {\n    evento = cal.createEvent(titolo, inizio, fine, { description: descrizione });\n  }\n  evento.setTag(TAG, dati);\n  return { ok: true, appuntamento: leggiEvento(evento) };\n}\n\nfunction picco(voci, ini, fin) {\n  const istanti = [ini].concat(voci.map(function (v) { return new Date(v.inizio).getTime(); })\n    .filter(function (t) { return t > ini && t < fin; }));\n  return istanti.reduce(function (max, t) {\n    const n = voci.filter(function (v) { return new Date(v.inizio).getTime() <= t && new Date(v.fine).getTime() > t; }).length;\n    return Math.max(max, n);\n  }, 0);\n}\n\n// Vista anno: solo il numero per giorno, senza leggere i dati di ogni evento (è molto più veloce).\nfunction conteggi(d) {\n  const cal = calendario();\n  const fuso = cal.getTimeZone();\n  const giorni = {};\n  cal.getEvents(new Date(d.dal), new Date(d.al)).forEach(function (ev) {\n    if (ev.isAllDayEvent() || ev.getTitle().indexOf(PREFISSO_BLOCCO) === 0) return;\n    const k = Utilities.formatDate(ev.getStartTime(), fuso, \"yyyy-MM-dd\");\n    giorni[k] = (giorni[k] || 0) + 1;\n  });\n  return { ok: true, giorni: giorni };\n}\n\nfunction eliminaAppuntamento(d) {\n  const evento = calendario().getEventById(d.id);\n  if (!evento) return { ok: true };                    // già tolto, magari da Google Calendar\n  if (!evento.getTag(TAG)) return { ok: false, errore: \"esterno\" };\n  evento.deleteEvent();\n  return { ok: true };\n}\n\n// Lo storico si cerca sul calendario, da 3 anni fa: il \"rif:\" nella descrizione è il riferimento alla cliente.\nfunction storico(d) {\n  const ora = new Date();\n  const dal = new Date(ora.getFullYear() - 3, ora.getMonth(), 1);\n  const al = new Date(ora.getFullYear() + 1, ora.getMonth(), 1);\n  const eventi = calendario().getEvents(dal, al, { search: \"rif:\" + d.clienteId });\n  const lista = eventi.map(leggiEvento).filter(function (x) { return x.clienteId === d.clienteId; });\n  lista.sort(function (a, b) { return a.inizio < b.inizio ? 1 : -1; });\n  return { ok: true, appuntamenti: lista };\n}\n\nfunction leggiEvento(ev) {\n  const base = {\n    id: ev.getId(),\n    inizio: ev.getStartTime().toISOString(),\n    fine: ev.getEndTime().toISOString(),\n    titolo: ev.getTitle(),\n    giornata: ev.isAllDayEvent(),\n    esterno: true,\n    // un evento a mano non dice dove si fa: si riconosce solo il laser, dal titolo\n    usa: /laser/i.test(ev.getTitle()) ? [\"cabina\", \"laser\"] : []\n  };\n  const grezzo = ev.getTag(TAG);\n  if (!grezzo) return base;                            // scritto a mano su Google Calendar\n  let x;\n  try { x = JSON.parse(grezzo); } catch (err) { return base; }\n  base.esterno = false;\n  base.clienteId = x.c; base.cliente = x.n; base.telefono = x.t; base.servizi = x.s;\n  base.operatrice = x.o; base.stato = x.st; base.prezzo = x.p; base.promemoria = x.r; base.usa = x.u || []; base.blocco = !!x.b;\n  const note = String(ev.getDescription() || \"\").match(/^Note: (.*)$/m);\n  base.note = note ? note[1] : \"\";\n  return base;\n}\n\nfunction calendario() {\n  return CALENDARIO_ID ? CalendarApp.getCalendarById(CALENDARIO_ID) : CalendarApp.getDefaultCalendar();\n}\n\n// --- Clienti ------------------------------------------------------------\n\nfunction foglioClienti() {\n  const file = SpreadsheetApp.getActiveSpreadsheet();\n  let f = file.getSheetByName(\"Clienti\");\n  if (!f) f = file.insertSheet(\"Clienti\", 0);\n  if (f.getLastRow() === 0) {\n    f.appendRow(INTESTAZIONE);\n    f.getRange(1, 1, 1, INTESTAZIONE.length).setFontWeight(\"bold\");\n    f.setFrozenRows(1);\n    f.getRange(\"C:C\").setNumberFormat(\"@\");            // telefono come testo: tiene il \"+39\"\n    f.hideColumns(1);                                  // l'ID serve solo all'app\n  }\n  return f;\n}\n\nfunction leggiClienti() {\n  const f = foglioClienti();\n  const righe = f.getDataRange().getValues().slice(1);\n  return righe.filter(function (r) { return r[0]; }).map(function (r) {\n    return {\n      id: String(r[0]), nome: String(r[1]), telefono: String(r[2]).replace(/^'/, \"\"),\n      email: String(r[3]), note: String(r[4]), consenso: r[5] === true || r[5] === \"sì\"\n    };\n  });\n}\n\nfunction rigaCliente(f, id) {\n  const trovata = f.getRange(\"A:A\").createTextFinder(id).matchEntireCell(true).findNext();\n  return trovata ? trovata.getRow() : 0;\n}\n\nfunction salvaCliente(d) {\n  const c = d.cliente;\n  if (!c || !c.id || !c.nome) return { ok: false, errore: \"formato\" };\n  const f = foglioClienti();\n  // L'apostrofo davanti serve: setValues tratta \"+39 …\" come formula e scrive #ERROR!\n  const riga = [c.id, c.nome, c.telefono ? \"'\" + c.telefono : \"\", c.email || \"\", c.note || \"\", c.consenso ? \"sì\" : \"no\", new Date()];\n  const n = rigaCliente(f, c.id);\n  if (n) {\n    riga[6] = f.getRange(n, 7).getValue();             // la data di creazione non cambia\n    f.getRange(n, 1, 1, riga.length).setValues([riga]);\n  } else {\n    f.appendRow(riga);\n  }\n  return { ok: true };\n}\n\nfunction eliminaCliente(d) {\n  const f = foglioClienti();\n  const n = rigaCliente(f, d.id);\n  if (n) f.deleteRow(n);\n  return { ok: true };\n}\n\n// --- Impostazioni -------------------------------------------------------\n\nfunction foglioImpostazioni() {\n  const file = SpreadsheetApp.getActiveSpreadsheet();\n  return file.getSheetByName(\"Impostazioni\") || file.insertSheet(\"Impostazioni\");\n}\n\nfunction leggiImpostazioni() {\n  const testo = foglioImpostazioni().getRange(\"A1\").getValue();\n  if (!testo) return null;                             // l'app usa listino e orari di partenza\n  try { return JSON.parse(testo); } catch (err) { return null; }\n}\n\nfunction salvaImpostazioni(d) {\n  foglioImpostazioni().getRange(\"A1\").setValue(JSON.stringify(d.impostazioni));\n  return { ok: true };\n}\n\nfunction risposta(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";</script>
<script>// Versione di prova: gira tutta nel browser. Esegue il VERO apps-script.gs su un Google simulato
// che salva nel telefono (localStorage). Nessuna rete, nessun account, nessun dato vero.
(function () {
  const CHIAVE = "agenda-demo-dati";
  localStorage.setItem("agenda-cfg", JSON.stringify({ url: "demo", codice: "demo" }));

  let eventi = [], fogli = {}, prossimo = 1;

  function Evento(titolo, a, b, op) {
    this.id = "ev" + prossimo++; this.titolo = titolo; this.a = a; this.b = b;
    this.desc = (op && op.description) || ""; this.tag = {}; this.allDay = false;
  }
  Object.assign(Evento.prototype, {
    getId() { return this.id; }, getTitle() { return this.titolo; },
    getStartTime() { return this.a; }, getEndTime() { return this.b; },
    getDescription() { return this.desc; }, isAllDayEvent() { return this.allDay; },
    getTag(k) { return this.tag[k] ?? null; }, setTag(k, v) { this.tag[k] = v; },
    setTitle(t) { this.titolo = t; }, setDescription(t) { this.desc = t; },
    setTime(a, b) { this.a = a; this.b = b; },
    deleteEvent() { eventi.splice(eventi.indexOf(this), 1); },
  });

  const cal = {
    getName: () => "Prova", getTimeZone: () => "Europe/Rome",
    getEvents: (a, b, op = {}) => eventi.filter(e => e.a < b && e.b > a
      && (!op.search || (e.titolo + " " + e.desc).includes(op.search))).sort((x, y) => x.a - y.a),
    getEventById: id => eventi.find(e => e.id === id) || null,
    createEvent(t, a, b, op) { const e = new Evento(t, a, b, op); eventi.push(e); return e; },
  };

  const pulisci = v => typeof v === "string" ? v.replace(/^'/, "") : v;
  function foglio(righe) {
    return {
      righe,
      getLastRow: () => righe.length,
      appendRow: r => { righe.push(r.map(v => v instanceof Date ? v.toISOString() : v)); },
      getRange(a, b) {
        if (a === "A:A") return { createTextFinder: t => ({ matchEntireCell: () => ({ findNext: () => {
          const i = righe.findIndex(r => String(r[0]) === t); return i < 0 ? null : { getRow: () => i + 1 };
        } }) }) };
        if (a === "A1") return { getValue: () => righe[0]?.[0] ?? "", setValue: v => { righe[0] = [v]; } };
        return { setFontWeight() {}, setNumberFormat() {}, getValue: () => righe[a - 1]?.[b - 1] ?? "",
          setValues: ([r]) => { righe[a - 1] = r.map(pulisci); } };
      },
      getDataRange: () => ({ getValues: () => righe.map(r => r.map(pulisci)) }),
      setFrozenRows() {}, hideColumns() {}, deleteRow: n => { righe.splice(n - 1, 1); },
    };
  }
  const file = {
    getName: () => "Prova",
    getSheetByName: n => fogli[n] ? foglio(fogli[n]) : null,
    insertSheet: n => { fogli[n] = []; return foglio(fogli[n]); },
  };

  const doPost = new Function("CalendarApp", "SpreadsheetApp", "Utilities", "LockService", "ContentService",
    window.__SCRIPT_GS + "\nreturn doPost;")(
    { getDefaultCalendar: () => cal, getCalendarById: () => cal },
    { getActiveSpreadsheet: () => file },
    { formatDate: d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` },
    { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) },
    { MimeType: { JSON: "json" }, createTextOutput: t => ({ testo: t, setMimeType() { return this; } }) });

  const chiama = corpo => JSON.parse(doPost({ postData: { contents: corpo } }).testo);
  const api = (azione, resto) => chiama(JSON.stringify({ codice: "demo", azione, ...resto }));

  function salva() {
    localStorage.setItem(CHIAVE, JSON.stringify({ prossimo, fogli,
      eventi: eventi.map(e => [e.id, e.titolo, e.a.getTime(), e.b.getTime(), e.desc, e.tag]) }));
  }

  function semina() {
    // Numeri con 000: non possono essere di nessuno.
    const c = [["c1", "Maria Rossi"], ["c2", "Giulia Bianchi"], ["c3", "Sonia Ferrari"], ["c4", "Chiara Conti"],
      ["c5", "Elena Marino"], ["c6", "Francesca Greco"], ["c7", "Paola Riva"], ["c8", "Anna De Luca"]]
      .map(([id, nome], i) => [id, nome, `333 000 00${String(i + 1).padStart(2, "0")}`]);
    c.forEach(([id, nome, telefono]) => api("salvaCliente", { cliente: { id, nome, telefono, consenso: true } }));
    const oggi = new Date();
    const ora = (g, h, m) => { const d = new Date(oggi); d.setDate(d.getDate() + g); d.setHours(h, m, 0, 0); return d; };
    const app = (g, op, h, m, min, cl, servizi, prezzo) => api("salvaAppuntamento", { forza: true, appuntamento: {
      usa: servizi.some(x => /laser/i.test(x)) ? ["cabina", "laser"] : servizi.some(x => /Semi|Ricostruzione|Manicure/.test(x)) ? ["unghie"] : ["cabina"],
      clienteId: cl[0], cliente: cl[1], telefono: cl[2], servizi, prezzo, operatrice: op,
      inizio: ora(g, h, m).toISOString(), fine: new Date(ora(g, h, m).getTime() + min * 60000).toISOString() } });
    const giri = [
      ["Alessia", 9, 30, 40, c[0], ["Semipermanente"], 25], ["Alessia", 10, 30, 60, c[3], ["Pulizia viso"], 45], ["Alessia", 15, 0, 90, c[5], ["Ricostruzione medio"], 55],
      ["Denisa", 9, 0, 60, c[1], ["Massaggio total body"], 50], ["Denisa", 10, 30, 30, c[4], ["Pressoterapia"], 30], ["Denisa", 14, 30, 60, c[6], ["Laminazione ciglia"], 35],
      ["Marta", 9, 30, 30, c[2], ["Gamba intera", "Inguine totale"], 35], ["Marta", 10, 30, 60, c[7], ["Trattamento viso specifico"], 55], ["Marta", 12, 0, 30, c[4], ["Laser 2 zone"], 58],
      ["Veronica", 10, 0, 90, c[5], ["Ricostruzione lungo"], 65], ["Veronica", 12, 0, 40, c[3], ["Semipermanente"], 25], ["Veronica", 15, 30, 30, c[1], ["Manicure"], 20],
    ];
    for (let g = -30; g <= 60; g++) {
      if (ora(g, 12, 0).getDay() === 0) continue;
      giri.slice(0, Math.abs(g) < 4 ? 12 : 3 + (Math.abs(g) * 7) % 10).forEach(([op, h, m, min, cl, s, p]) => app(g, op, h, m, min, cl, s, p));
    }
    salva();
  }

  const copia = JSON.parse(localStorage.getItem(CHIAVE) || "null");
  if (copia) {
    prossimo = copia.prossimo; fogli = copia.fogli;
    eventi = copia.eventi.map(([id, t, a, b, d, tag]) => {
      const e = Object.create(Evento.prototype);
      return Object.assign(e, { id, titolo: t, a: new Date(a), b: new Date(b), desc: d, tag, allDay: false });
    });
  } else semina();

  const fetchVero = window.fetch.bind(window);
  window.fetch = (u, o) => {
    if (u !== "demo") return fetchVero(u, o);
    const r = chiama(o.body);
    salva();
    return Promise.resolve({ json: () => Promise.resolve(r) });
  };

  // In prova non parte niente verso persone vere.
  const fermo = () => window.avviso && window.avviso("In prova non parte nessun messaggio o chiamata");
  const apriVero = window.open.bind(window);
  window.open = (u, ...r) => /wa\.me|whatsapp/.test(String(u)) ? (fermo(), null) : apriVero(u, ...r);
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="tel:"]');
    if (a) { e.preventDefault(); fermo(); }
  }, true);

  window.ricominciaProva = () => {
    ["agenda-demo-dati", "agenda-copia", "agenda-filtro", "agenda-scala"].forEach(k => localStorage.removeItem(k));
    location.reload();
  };
})();
</script>

const giornoLungo = d => d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
const haOre = a => !a.giornata;
