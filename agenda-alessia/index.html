const operatriciViste = () => [...new Set([...S.imp.operatrici, ...S.appuntamenti.filter(a => !a.esterno && a.operatrice && a.operatrice !== TUTTE).map(a => a.operatrice)])];
const coloreDi = n => COLORI[(S.opViste || S.imp.operatrici).indexOf(n) % COLORI.length] || ["#7c8796", "#eef0f3"];
const varColore = n => { const [c, c2] = coloreDi(n); return `--c:${c};--c2:${c2}`; };
const NOMI_SCALA = { giorno: "Giorno", settimana: "Settimana", mese: "Mese", anno: "Anno" };
const nomeCorto = n => { const p = String(n || "").trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[1][0]}.` : p[0]; };
const normalizza = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const S = {
  cfg: JSON.parse(localStorage.getItem("agenda-cfg") || "null"),
  vista: "agenda",
  giorno: new Date(),
  appuntamenti: [], clienti: [],
  imp: IMPOSTAZIONI_PARTENZA,
  dal: null, al: null,
  filtro: localStorage.getItem("agenda-filtro") || "",
  scala: localStorage.getItem("agenda-scala") || "giorno",
  finestre: [], conteggi: {},
  caricato: false, erroreRete: false, cercaClienti: "",
};

// --- Collegamento e server ---------------------------------------------

function leggiLinkCollega() {
  const m = location.hash.match(/collega=([^&]+)/);
  if (!m) return;
  try {
    S.cfg = JSON.parse(atob(decodeURIComponent(m[1])));
    localStorage.setItem("agenda-cfg", JSON.stringify(S.cfg));
  } catch (e) { avviso("Link di collegamento non valido"); }
  history.replaceState(null, "", location.pathname);
}

async function api(azione, resto = {}) {
  const r = await fetch(S.cfg.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // niente preflight: Apps Script non lo gestisce
    body: JSON.stringify({ codice: S.cfg.codice, azione, ...resto }),
  });
  const dati = await r.json();
  if (!dati.ok && dati.errore === "codice") throw new Error("Codice non valido: riapri il link di collegamento");
  return dati;
}

// Cosa serve alla vista in corso.
function rangeVista(d = S.giorno) {
  if (S.scala === "mese") { const i = lunedi(new Date(d.getFullYear(), d.getMonth(), 1)); return [i, piuGiorni(i, 42)]; }
  return [lunedi(d), piuGiorni(lunedi(d), 7)];
}

// Le settimane attorno a oggi si tengono sempre, se no i posti liberi sarebbero sbagliati
// quando si guarda un mese lontano. Se la vista cade fuori, si aggiunge la sua finestra.
async function carica() {
  if (!S.cfg) return;
  const dal = piuGiorni(lunedi(new Date()), -7), al = piuGiorni(dal, GIORNI_CARICATI);
  const [ini, fin] = rangeVista();
  try {
    const d = await api("carica", { dal: dal.toISOString(), al: al.toISOString() });
    if (!d.ok) throw new Error(d.dettaglio || d.errore);
    let lista = d.appuntamenti;
    const finestre = [[dal, al]];
    if (S.scala !== "anno" && (ini < dal || fin > al)) {
      const e = await api("carica", { dal: ini.toISOString(), al: fin.toISOString() });
      if (!e.ok) throw new Error(e.dettaglio || e.errore);
      const viste = new Set(lista.map(a => a.id + a.inizio));
      lista = lista.concat(e.appuntamenti.filter(a => !viste.has(a.id + a.inizio)));
      finestre.push([ini, fin]);
    }
    S.appuntamenti = lista; S.clienti = d.clienti;
    S.imp = { ...IMPOSTAZIONI_PARTENZA, ...(d.impostazioni || {}) };
    S.dal = dal; S.al = al; S.finestre = finestre; S.caricato = true; S.erroreRete = false;
    localStorage.setItem("agenda-copia", JSON.stringify({ appuntamenti: S.appuntamenti, clienti: S.clienti, imp: S.imp }));
  } catch (e) {
    S.erroreRete = true;
  }
  disegna();
}

async function caricaConteggi(anno) {
  if (S.conteggiInCorso === anno) return;
  S.conteggiInCorso = anno;
  try {
    const r = await api("conteggi", { dal: new Date(anno, 0, 1).toISOString(), al: new Date(anno + 1, 0, 1).toISOString() });
    if (!r.ok) throw new Error();
    S.conteggi[anno] = r.giorni; S.erroreRete = false;
  } catch (e) { S.erroreRete = true; S.conteggi[anno] = S.conteggi[anno] || null; }
  S.conteggiInCorso = null;
  disegna();
}

function assicura() {
  if (S.scala === "anno") return;
  const [ini, fin] = rangeVista();
  if (!S.finestre.some(([a, b]) => ini >= a && fin <= b)) carica();
}

function caricaCopia() {
  const c = JSON.parse(localStorage.getItem("agenda-copia") || "null");
  if (c) { S.appuntamenti = c.appuntamenti; S.clienti = c.clienti; S.imp = { ...IMPOSTAZIONI_PARTENZA, ...c.imp }; }
}

window.avviso = avviso;
function avviso(testo) {
  const t = $("toast");
  t.textContent = testo; t.style.display = "block";
  clearTimeout(avviso.t); avviso.t = setTimeout(() => t.style.display = "none", 3500);
}

// --- Calcoli agenda -----------------------------------------------------

function delGiorno(chiave) {
  return S.appuntamenti.filter(a => chiaveGiorno(new Date(a.inizio)) === chiave);
}

function orarioDel(d) { return S.imp.orari[d.getDay()] || null; }

// Chi è libera in quella fascia. Un evento scritto a mano su Calendar non dice di chi è:
// conta come una persona occupata, così quattro operatrici non si bloccano per un evento solo.
function libereAlle(chiave, ini, fin, ignoraId) {
  const voci = delGiorno(chiave).filter(a => haOre(a) && a.id !== ignoraId && a.stato !== "noshow"
    && new Date(a.inizio).getTime() < fin && new Date(a.fine).getTime() > ini);
  const esterni = voci.filter(a => a.esterno).length;
  const libere = S.imp.operatrici.filter(n => !voci.some(a => !a.esterno && (a.operatrice === n || a.operatrice === TUTTE)));
  return libere.length > esterni ? libere : [];
}

// La prima risorsa esaurita in quella fascia, o null. Conta il massimo in uso nello stesso momento.
function risorsaPiena(chiave, ini, fin, usa, ignoraId) {
  const voci = delGiorno(chiave).filter(a => haOre(a) && a.id !== ignoraId && a.stato !== "noshow"
    && new Date(a.inizio).getTime() < fin && new Date(a.fine).getTime() > ini);
  return usa.find(r => {
    const chi = voci.filter(a => (a.usa || []).includes(r));
    const istanti = [ini, ...chi.map(a => new Date(a.inizio).getTime()).filter(t => t > ini && t < fin)];
    const picco = Math.max(...istanti.map(t => chi.filter(a => new Date(a.inizio).getTime() <= t && new Date(a.fine).getTime() > t).length));
    return S.imp.risorse[r] != null && picco >= S.imp.risorse[r];
  }) || null;
}

function postiLiberi(durata, operatrice, ignoraId, quanti = 6, usa = []) {
  const trovati = [], ora = Date.now();
  for (let i = 0; i < 28 && trovati.length < quanti; i++) {
    const g = piuGiorni(new Date(), i);
    if (S.al && g >= S.al) break;
    const orario = orarioDel(g);
    if (!orario) continue;
    const chiave = chiaveGiorno(g);
    let oggiTrovati = 0;
    for (let m = minDa(orario[0]); m + durata <= minDa(orario[1]) && oggiTrovati < 3; m += 15) {
      const ini = aData(chiave, `${due(Math.floor(m / 60))}:${due(m % 60)}`).getTime();
      const fin = ini + durata * 60000;
      if (ini < ora) continue;
      const libere = risorsaPiena(chiave, ini, fin, usa, ignoraId) ? [] : libereAlle(chiave, ini, fin, ignoraId);
      const libera = operatrice ? libere.find(n => n === operatrice) : libere[0];
      if (libera) {
        trovati.push({ giorno: chiave, ora: oraDi(new Date(ini)), operatrice: libera });
        oggiTrovati++;
        m += Math.max(durata, 45) - 15;      // non proporre 9:00, 9:15, 9:30 di fila
      }
    }
  }
  return trovati.slice(0, quanti);
}

// --- Viste ---------------------------------------------------------------

function disegna() {
  document.querySelectorAll("#menu button").forEach(b => b.classList.toggle("attivo", b.dataset.vista === S.vista));
  if (!S.cfg) return disegnaCollega();
  ({ agenda: disegnaAgenda, promemoria: disegnaPromemoria, clienti: disegnaClienti, impostazioni: disegnaImpostazioni })[S.vista]();
}

function disegnaCollega() {
  $("main").innerHTML = `<div class="contenuto"><div class="scheda"><b>App non collegata</b>
    <p class="tenue">Apri una volta il link di collegamento su questo dispositivo.</p></div></div>`;
}

function bannerRete() {
  return S.erroreRete ? `<div class="giornata">Connessione assente: stai vedendo l'ultima copia salvata. Per ora non si possono salvare appuntamenti.</div>` : "";
}

function disegnaAgenda() {
  nascondiFumetto();
  S.opViste = operatriciViste();
  ({ giorno: disegnaGiorno, settimana: disegnaSettimana, mese: disegnaMese, anno: disegnaAnno })[S.scala]();
}

function titoloVista() {
  const d = S.giorno;
  if (S.scala === "giorno") return giornoLungo(d);
  if (S.scala === "mese") return d.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  if (S.scala === "anno") return String(d.getFullYear());
  const a = lunedi(d), b = piuGiorni(a, 6);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${b.toLocaleDateString("it-IT", { month: "long", year: "numeric" })}`
    : `${a.getDate()} ${a.toLocaleDateString("it-IT", { month: "short" })} – ${b.getDate()} ${b.toLocaleDateString("it-IT", { month: "short", year: "numeric" })}`;
}

function barra(conta) {
  return `<div class="barra">
      <button id="ieri" aria-label="Indietro">‹</button>
      <button id="oggi">Oggi</button>
      <button id="domani" aria-label="Avanti">›</button>
      <strong>${titoloVista()}</strong>
      <span class="tenue contaGiorno" style="margin-left:auto">${conta}</span>
      <div class="scale" role="group" aria-label="Vista">${Object.entries(NOMI_SCALA).map(([k, t]) => `<button data-scala="${k}" class="${k === S.scala ? "attiva" : ""}">${t}</button>`).join("")}</div>
    </div>`;
}

function passo(dir) {
  const d = S.giorno;
  if (S.scala === "giorno") return piuGiorni(d, dir);
  if (S.scala === "settimana") return piuGiorni(d, 7 * dir);
  if (S.scala === "mese") return new Date(d.getFullYear(), d.getMonth() + dir, 1, 12);
  return new Date(d.getFullYear() + dir, d.getMonth(), 1, 12);
}

const vaiAlGiorno = k => { S.scala = "giorno"; localStorage.setItem("agenda-scala", "giorno"); vaiA(new Date(k + "T12:00:00")); };

function legaBarra() {
  $("ieri").onclick = () => vaiA(passo(-1));
  $("domani").onclick = () => vaiA(passo(1));
  $("oggi").onclick = () => vaiA(new Date());
  document.querySelectorAll("[data-scala]").forEach(b => b.onclick = () => {
    S.scala = b.dataset.scala;
    localStorage.setItem("agenda-scala", S.scala);
    disegna(); assicura();
  });
  document.querySelectorAll("[data-giorno]").forEach(b => b.onclick = () => vaiA(new Date(b.dataset.giorno + "T12:00:00")));
  document.querySelectorAll("[data-vai]").forEach(b => b.onclick = () => vaiAlGiorno(b.dataset.vai));
  document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => {
    S.filtro = S.filtro === b.dataset.zoom ? "" : b.dataset.zoom;
    localStorage.setItem("agenda-filtro", S.filtro);
    disegna();
  });
}

function legaApp() {
  document.querySelectorAll("[data-app]").forEach(b => b.onclick = () => {
    const a = S.appuntamenti.find(x => x.id === b.dataset.app && x.inizio === b.dataset.ini);
    if (a) apriDettaglio(a);
  });
}

const tabOperatrici = () => {
  if (!S.opViste.includes(S.filtro)) S.filtro = "";
  return S.opViste.map(n => `<button class="tab ${S.filtro === n ? "attiva" : ""}" data-zoom="${esc(n)}" style="${varColore(n)}" aria-pressed="${S.filtro === n}">${esc(n)}</button>`).join("");
};
const yDi = d => (d.getHours() * 60 + d.getMinutes() - ORA_INIZIO * 60) * PX_MIN;
const visibileFiltro = a => !S.filtro || a.esterno || a.operatrice === S.filtro || a.operatrice === TUTTE;

function disegnaSettimana() {
  const chiave = "s" + chiaveGiorno(lunedi(S.giorno));
  const scrollPrima = S.scrollFatto === chiave ? $("griglia")?.scrollTop : null;
  const tab = tabOperatrici();
  const oggi = chiaveGiorno(new Date());
  const lun = lunedi(S.giorno);
  const tutti = [...Array(7).keys()].map(i => piuGiorni(lun, i));
  const voci = tutti.flatMap(d => delGiorno(chiaveGiorno(d)).filter(a => haOre(a) && visibileFiltro(a)));
  const giorni = tutti.filter(d => orarioDel(d) || delGiorno(chiaveGiorno(d)).some(haOre));
  const solo = !!S.filtro;
  const corsie = solo ? [S.filtro] : S.opViste.concat(voci.some(a => a.esterno) ? [""] : []);
  const altezza = (ORA_FINE - ORA_INIZIO) * 60 * PX_MIN;
  const ore = [...Array(ORA_FINE - ORA_INIZIO).keys()].map(i => i ? `<div class="ora" style="top:${i * 60 * PX_MIN}px">${ORA_INIZIO + i}:00</div>` : "").join("");

  const colonne = giorni.map(d => {
    const k = chiaveGiorno(d), orario = orarioDel(d);
    const fasce = !orario ? [[0, altezza]] : [[0, (minDa(orario[0]) - ORA_INIZIO * 60) * PX_MIN], [(minDa(orario[1]) - ORA_INIZIO * 60) * PX_MIN, altezza]];
    const chiuso = fasce.map(([a, b]) => `<div class="chiuso" style="top:${a}px;height:${b - a}px"></div>`).join("");
    const blocchi = voci.filter(a => chiaveGiorno(new Date(a.inizio)) === k).map(a => {
      const ini = new Date(a.inizio), fin = new Date(a.fine);
      const c = Math.max(0, corsie.indexOf(a.esterno ? "" : a.operatrice));
      const nome = a.esterno ? a.titolo : a.blocco ? `🔒 ${a.cliente}` : a.cliente;
      const alto = (fin - ini) / 60000 * PX_MIN >= 30;     // nei blocchi bassi ci sta solo l'ora
      const largo = a.operatrice === TUTTE;
      const stile = `top:${yDi(ini)}px;height:${Math.max((fin - ini) / 60000 * PX_MIN - 1, 14)}px;left:${solo && a.esterno ? 60 : largo ? 0 : c / corsie.length * 100}%;right:auto;width:${solo && a.esterno ? 40 : largo ? 100 : 100 / corsie.length}%;${varColore(a.operatrice)}`;
      return `<button class="app ${a.esterno ? "esterno" : ""} ${a.blocco ? "blocco" : ""} ${a.operatrice === TUTTE ? "pertutte" : ""} ${a.stato === "fatto" ? "fatto" : ""} ${a.stato === "noshow" ? "noshow" : ""}" style="${stile}" data-app="${esc(a.id)}" data-ini="${esc(a.inizio)}" aria-label="${oraDi(ini)} ${esc(nome)}${a.operatrice ? ", " + esc(a.operatrice) : ""}">
        <b>${oraDi(ini)}</b>${alto ? `<span>${esc(a.blocco ? (largo || solo ? nome : "🔒") : solo && !a.esterno ? nomeCorto(nome) : String(nome).split(" ")[0])}</span>` : ""}</button>`;
    }).join("");
    return `<div class="colonna"><div class="pista" data-pg="${k}" style="height:${altezza}px;--oraPx:${60 * PX_MIN}px">${chiuso}${blocchi}</div></div>`;
  }).join("");

  const teste = giorni.map(d => `<button class="tab ${chiaveGiorno(d) === oggi ? "oggi" : ""}" data-vai="${chiaveGiorno(d)}" style="--c:var(--linea)">${d.toLocaleDateString("it-IT", { weekday: "short" })} ${d.getDate()}</button>`).join("");
  const incasso = voci.reduce((t, a) => t + (a.stato === "noshow" ? 0 : a.prezzo || 0), 0);

  $("main").innerHTML = `${bannerRete()}${barra(`${voci.filter(soloApp).length} appuntamenti · ${euro(incasso)} previsti`)}
    <div class="filtri">${tab}</div>
    <div class="scorre" id="griglia"><div class="testate"><div class="angolo"></div>${teste}</div>
      <div class="grigliaZona sett ${solo ? "solo1" : ""}"><div class="ore">${ore}</div>${colonne}</div></div>`;
  $("griglia").scrollTop = scrollPrima ?? Math.max(0, (9 * 60 - ORA_INIZIO * 60 - 30) * PX_MIN);
  S.scrollFatto = chiave;
  legaBarra(); legaApp();
  document.querySelectorAll(".pista").forEach(p => p.onclick = e => {
    if (e.target.closest(".app")) return;
    const r = p.getBoundingClientRect();
    const min = Math.round(((e.clientY - r.top) / PX_MIN + ORA_INIZIO * 60) / 15) * 15;
    apriForm({ giorno: p.dataset.pg, ora: `${due(Math.floor(min / 60))}:${due(min % 60)}`, operatrice: S.filtro });
  });
}

function disegnaMese() {
  const tab = tabOperatrici();
  const [ini] = rangeVista();
  const meseQui = S.giorno.getMonth(), oggi = chiaveGiorno(new Date());
  let totale = 0, incasso = 0;
  const celle = [...Array(42).keys()].map(i => {
    const d = piuGiorni(ini, i), k = chiaveGiorno(d);
    const voci = delGiorno(k).filter(a => haOre(a) && soloApp(a) && visibileFiltro(a));
    const bloccato = delGiorno(k).some(a => a.blocco && visibileFiltro(a));
    const dentro = d.getMonth() === meseQui;
    if (dentro) { totale += voci.length; incasso += voci.reduce((t, a) => t + (a.stato === "noshow" ? 0 : a.prezzo || 0), 0); }
    const barre = S.opViste.map(n => [n, voci.filter(a => a.operatrice === n).length]).filter(x => x[1])
      .map(([n, q]) => `<i title="${esc(n)}: ${q}" style="flex:${q};${varColore(n)}"></i>`).join("");
    return `<button class="cella ${dentro ? "" : "fuori"} ${orarioDel(d) ? "" : "chiusa"} ${k === oggi ? "oggi" : ""}" data-vai="${k}">
      <span><b>${d.getDate()}</b></span>${voci.length ? `<small>${voci.length} app.</small>` : ""}${bloccato ? `<small>🔒 blocco</small>` : ""}<span class="barre">${barre}</span></button>`;
  }).join("");
  const teste = [...Array(7).keys()].map(i => `<div>${piuGiorni(ini, i).toLocaleDateString("it-IT", { weekday: "short" })}</div>`).join("");
  $("main").innerHTML = `${bannerRete()}${barra(`${totale} appuntamenti · ${euro(incasso)} previsti`)}
    <div class="filtri">${tab}</div><div class="testaMese">${teste}</div>
    <div class="scorre" id="griglia"><div class="mese">${celle}</div></div>`;
  legaBarra();
}

function disegnaAnno() {
  const anno = S.giorno.getFullYear();
  if (S.conteggi[anno] === undefined) caricaConteggi(anno);
  const c = S.conteggi[anno];
  const oggi = chiaveGiorno(new Date());
  const massimo = Math.max(1, ...Object.values(c || {}));
  const totale = Object.values(c || {}).reduce((t, n) => t + n, 0);
  const mesi = [...Array(12).keys()].map(m => {
    const primo = new Date(anno, m, 1), giorni = new Date(anno, m + 1, 0).getDate();
    const vuoti = (primo.getDay() + 6) % 7;
    let somma = 0;
    const celle = [...Array(giorni).keys()].map(i => {
      const k = `${anno}-${due(m + 1)}-${due(i + 1)}`, n = (c || {})[k] || 0;
      somma += n;
      const f = n / massimo;
      const stile = n ? `--l:${Math.round(90 - f * 55)}%;--t:${f > .5 ? "#fff" : "inherit"}` : "";
      return `<button data-vai="${k}" class="${k === oggi ? "oggi" : ""}" style="${stile}" title="${n} appuntamenti">${i + 1}</button>`;
    }).join("");
    return `<div class="miniMese"><button data-mese="${m}"><span>${primo.toLocaleDateString("it-IT", { month: "long" })}</span><span class="tenue">${somma || ""}</span></button>
      <div class="miniGiorni">${"<span></span>".repeat(vuoti)}${celle}</div></div>`;
  }).join("");
  const conta = c ? `${totale} appuntamenti nell'anno` : S.erroreRete ? "Conteggio non disponibile" : "Sto contando…";
  $("main").innerHTML = `${bannerRete()}${barra(conta)}
    <div class="scorre" id="griglia"><div class="anno">${mesi}</div></div>`;
  legaBarra();
  document.querySelectorAll("[data-mese]").forEach(b => b.onclick = () => {
    S.scala = "mese"; localStorage.setItem("agenda-scala", "mese");
    vaiA(new Date(anno, +b.dataset.mese, 1, 12));
  });
}

function disegnaGiorno() {
  const scrollPrima = S.scrollFatto === chiaveGiorno(S.giorno) ? $("griglia")?.scrollTop : null;
  const chiave = chiaveGiorno(S.giorno);
  const oggi = chiaveGiorno(new Date());
  const lun = lunedi(S.giorno);
  const settimana = [...Array(7).keys()].map(i => {
    const d = piuGiorni(lun, i), k = chiaveGiorno(d);
    const n = delGiorno(k).filter(a => haOre(a) && soloApp(a)).length;
    return `<button data-giorno="${k}" class="${k === chiave ? "scelto" : ""} ${k === oggi ? "oggi" : ""}">
      ${d.toLocaleDateString("it-IT", { weekday: "short" })} ${d.getDate()}<small>${orarioDel(d) ? (n ? n + " app." : "libero") : "chiuso"}</small></button>`;
  }).join("");

  const delDi = delGiorno(chiave);
  const conOre = delDi.filter(haOre);
  const incasso = conOre.reduce((t, a) => t + (a.stato === "noshow" ? 0 : a.prezzo || 0), 0);
  const esterni = conOre.filter(a => a.esterno);
  const colonne = S.imp.operatrici.map(n => ({ nome: n, voci: conOre.filter(a => !a.esterno && (a.operatrice === n || a.operatrice === TUTTE)) }));
  [...new Set(conOre.filter(a => !a.esterno && a.operatrice !== TUTTE && !S.imp.operatrici.includes(a.operatrice)).map(a => a.operatrice))]
    .forEach(n => colonne.push({ nome: n, voci: conOre.filter(a => !a.esterno && a.operatrice === n) }));
  if (esterni.length) colonne.push({ nome: "Da Google Calendar", voci: esterni, esterna: true });

  if (!S.opViste.includes(S.filtro)) S.filtro = "";
  const visibili = S.filtro ? colonne.filter(c => c.nome === S.filtro || c.esterna) : colonne;
  const testate = colonne.map(c => !c.esterna
    ? `<button class="tab ${S.filtro === c.nome ? "attiva" : ""}" data-zoom="${esc(c.nome)}" style="${varColore(c.nome)}" aria-pressed="${S.filtro === c.nome}">${esc(c.nome)}</button>`
    : (visibili.includes(c) ? `<div class="tab stretta" style="--c:#7c8796"><span class="cal1">Calendar</span><span class="cal2">Cal.</span></div>` : "")).join("");

  const altezza = (ORA_FINE - ORA_INIZIO) * 60 * PX_MIN;
  const y = d => (d.getHours() * 60 + d.getMinutes() - ORA_INIZIO * 60) * PX_MIN;
  const orario = orarioDel(S.giorno);
  const fasceChiuse = !orario ? [[0, altezza]] : [[0, (minDa(orario[0]) - ORA_INIZIO * 60) * PX_MIN], [(minDa(orario[1]) - ORA_INIZIO * 60) * PX_MIN, altezza]];
  const chiuso = fasceChiuse.map(([a, b]) => `<div class="chiuso" style="top:${a}px;height:${b - a}px"></div>`).join("");
  const riga = chiave === oggi ? `<div class="adesso" style="top:${y(new Date())}px"></div>` : "";
  const ore = [...Array(ORA_FINE - ORA_INIZIO).keys()].map(i => i ? `<div class="ora" style="top:${i * 60 * PX_MIN}px">${ORA_INIZIO + i}:00</div>` : "").join("");

  const blocco = (a, sx, tot) => {
    const ini = new Date(a.inizio), fin = new Date(a.fine);
    const stile = `top:${y(ini)}px;height:${Math.max((fin - ini) / 60000 * PX_MIN - 2, 22)}px;left:calc(3px + ${sx / tot * 100}%);right:auto;width:calc(${100 / tot}% - 6px)`;
    const nome = a.esterno ? a.titolo : a.blocco ? `🔒 ${a.cliente}` : a.cliente;
    const segno = a.stato === "fatto" ? "✓ " : "";
    const sotto = a.esterno ? "" : (a.servizi || []).join(", ");
    return `<button class="app ${a.esterno ? "esterno" : ""} ${a.blocco ? "blocco" : ""} ${a.operatrice === TUTTE ? "pertutte" : ""} ${a.stato === "fatto" ? "fatto" : ""} ${a.stato === "noshow" ? "noshow" : ""}" style="${stile}" data-app="${esc(a.id)}" data-ini="${esc(a.inizio)}">
      <b>${segno}${oraDi(ini)} <u class="lungo">${esc(nome)}</u><u class="corto">${esc(a.esterno || a.blocco ? nome : nomeCorto(nome))}</u>${(a.usa || []).includes("laser") ? `<i class="etichetta" style="font-style:normal">LASER</i>` : ""}</b><span>${esc(sotto)}</span></button>`;
  };

  // Gli eventi sovrapposti (capita solo su Calendar o con "salva lo stesso") si affiancano.
  const blocchi = voci => {
    const ordinate = [...voci].sort((p, q) => p.inizio < q.inizio ? -1 : 1);
    const corsie = [];
    const posti = ordinate.map(a => {
      let c = corsie.findIndex(f => f <= a.inizio);
      if (c < 0) { c = corsie.length; corsie.push(""); }
      corsie[c] = a.fine;
      return [a, c];
    });
    return posti.map(([a, c]) => blocco(a, c, corsie.length || 1)).join("");
  };

  const htmlColonne = visibili.map(c => `<div class="colonna ${c.esterna ? "stretta" : ""}">
    <div class="pista" data-col="${c.esterna ? "" : esc(c.nome)}" style="height:${altezza}px;--oraPx:${60 * PX_MIN}px;${varColore(c.nome)}">${chiuso}${riga}${blocchi(c.voci)}</div></div>`).join("");

  const giornate = delDi.filter(a => a.giornata).map(a => `<div class="giornata">Tutto il giorno: ${esc(a.titolo)}</div>`).join("");

  $("main").innerHTML = `${bannerRete()}
    ${barra(`${conOre.filter(soloApp).length} appuntamenti · ${euro(incasso)} previsti`)}
    <div class="settimana">${settimana}</div>${giornate}
    <div class="scorre" id="griglia"><div class="testate"><div class="angolo"></div>${testate}</div>
      <div class="grigliaZona ${S.filtro ? "solo" : "compatta"}"><div class="ore">${ore}</div>${htmlColonne}</div></div>`;

  const orariVisibili = orario ? minDa(orario[0]) : 9 * 60;
  $("griglia").scrollTop = scrollPrima ?? Math.max(0, (orariVisibili - ORA_INIZIO * 60 - 30) * PX_MIN);
  S.scrollFatto = chiave;

  legaBarra(); legaApp();
  document.querySelectorAll(".pista").forEach(p => p.onclick = e => {
    if (e.target.closest(".app")) return;
    const r = p.getBoundingClientRect();
    const min = Math.round(((e.clientY - r.top) / PX_MIN + ORA_INIZIO * 60) / 15) * 15;
    const operatrice = p.dataset.col && S.imp.operatrici.includes(p.dataset.col) ? p.dataset.col : S.imp.operatrici[0];
    apriForm({ giorno: chiave, ora: `${due(Math.floor(min / 60))}:${due(min % 60)}`, operatrice });
  });
}

function vaiA(d) {
  S.giorno = d;
  disegna();
  assicura();
}

// --- Dettaglio appuntamento ----------------------------------------------

function apriDialogo(html) { $("dlgDentro").innerHTML = html; if (!$("dlg").open) $("dlg").showModal(); document.body.classList.add("modulo"); }
const telefonoLink = t => `<a class="bottone" href="tel:${esc(String(t).replace(/[^\d+]/g, ""))}">Chiama</a>`;
const chiudi = () => $("dlg").close();

function apriDettaglio(a) {
  const ini = new Date(a.inizio), fin = new Date(a.fine);
  const quando = `${giornoLungo(ini)}, ${oraDi(ini)}–${oraDi(fin)}`;
  if (a.blocco) return apriBlocco({ modifica: a });
  if (a.esterno) {
    return apriDialogo(`<h2>${esc(a.titolo)}</h2><p class="tenue">${quando}</p>
      <p>È stato scritto direttamente su Google Calendar: si modifica da lì.</p>
      <div class="azioni"><button id="x">Chiudi</button></div>`), $("x").onclick = chiudi;
  }
  apriDialogo(`<h2>${esc(a.cliente)}</h2><p class="tenue" style="margin:0">${quando}<br>${esc(a.operatrice)} · ${euro(a.prezzo || 0)}</p>
    <p>${esc((a.servizi || []).join(", "))}</p>
    ${a.note ? `<p class="tenue">Nota: ${esc(a.note)}</p>` : ""}
    <div class="azioni">
      <button id="dFatto">${a.stato === "fatto" ? "Rimetti da fare" : "Fatto"}</button>
      <button id="dNo">${a.stato === "noshow" ? "Era presente" : "Non è venuta"}</button>
      <button id="dMod">Modifica</button>
      ${a.telefono ? `${telefonoLink(a.telefono)}<button id="dWa" class="wa">WhatsApp</button>` : ""}
    </div>
    <div class="azioni">
      <button id="dDel" class="pericolo">Cancella</button>
      <button id="dChiudi" style="margin-left:auto">Chiudi</button>
    </div>`);
  const cambiaStato = async st => {
    const r = await salvaServer({ ...a, stato: a.stato === st ? "prenotato" : st }, true);
    if (r) chiudi();
  };
  $("dFatto").onclick = () => cambiaStato("fatto");
  $("dNo").onclick = () => cambiaStato("noshow");
  $("dMod").onclick = () => apriForm({ modifica: a });
  $("dChiudi").onclick = chiudi;
  if ($("dWa")) $("dWa").onclick = () => apriWhatsApp(a);
  let sicuro = false;
  $("dDel").onclick = async () => {
    if (!sicuro) { sicuro = true; $("dDel").textContent = "Tocca ancora per cancellare"; return; }
    try {
      const r = await api("eliminaAppuntamento", { id: a.id });
      if (!r.ok) throw new Error();
      S.appuntamenti = S.appuntamenti.filter(x => x.id !== a.id);
      chiudi(); disegna(); avviso("Appuntamento cancellato");
    } catch (e) { avviso("Non cancellato: controlla la connessione"); }
  };
}

async function salvaServer(app, forza) {
  try {
    const r = await api("salvaAppuntamento", { appuntamento: app, forza: !!forza, operatrici: S.imp.operatrici.length, risorse: S.imp.risorse });
    if (r.ok) S.conteggi = {};
    if (r.ok) {
      S.appuntamenti = S.appuntamenti.filter(x => x.id !== r.appuntamento.id);
      S.appuntamenti.push(r.appuntamento);
      disegna();
      return r.appuntamento;
    }
    if (r.errore === "conflitto") return { conflitti: r.conflitti, risorsa: r.risorsa };
    avviso({ orario: "Controlla l'orario: la fine viene prima dell'inizio", "troppi-servizi": "Troppi trattamenti su un solo appuntamento: dividilo in due", sparito: "Questo appuntamento non esiste più su Google Calendar" }[r.errore] || "Non salvato, riprova");
    if (r.errore === "sparito") carica();
  } catch (e) { avviso("Non salvato: controlla la connessione"); }
  return null;
}

// --- Modulo appuntamento -------------------------------------------------

function apriForm({ giorno, ora, operatrice, cliente, modifica } = {}) {
  const orario = orarioDel(S.giorno);
  const F = {
    id: modifica?.id,
    clienteId: modifica?.clienteId || cliente?.id || "",
    nome: modifica?.cliente || cliente?.nome || "",
    telefono: modifica?.telefono || cliente?.telefono || "",
    nuova: false,
    servizi: (modifica?.servizi || []).map(n => S.imp.servizi.find(s => s.nome === n) || { nome: n, minuti: 0, prezzo: 0 }),
    giorno: modifica ? chiaveGiorno(new Date(modifica.inizio)) : (giorno || chiaveGiorno(S.giorno)),
    ora: modifica ? oraDi(new Date(modifica.inizio)) : (ora || (orario ? orario[0] : "09:00")),
    minuti: modifica ? (new Date(modifica.fine) - new Date(modifica.inizio)) / 60000 : 30,
    minutiManuali: !!modifica,
    prezzo: modifica?.prezzo ?? 0,
    operatrice: modifica?.operatrice || operatrice || (S.imp.operatrici.length > 1 ? "" : S.imp.operatrici[0]),
    note: modifica?.note || "",
    stato: modifica?.stato || "prenotato",
    promemoria: modifica?.promemoria || "",
    cercaS: "",
  };

  apriDialogo(`<h2>${modifica ? "Modifica appuntamento" : "Nuovo appuntamento"}</h2>
    ${modifica ? "" : `<button id="fBlocca" type="button">🔒 Blocca questo orario</button>`}
    <label for="fCliente">Cliente</label>
    <div id="zonaCliente"></div>
    <label for="fCerca">Trattamenti</label>
    <div id="fScelti"></div>
    <input id="fCerca" placeholder="Cerca: semi, ceretta, massaggio…" autocomplete="off">
    <div id="fLista" class="lista" hidden></div>
    <div class="due">
      <div><label for="fGiorno">Giorno</label><input id="fGiorno" type="date" value="${F.giorno}"></div>
      <div><label for="fOra">Ora</label><input id="fOra" type="time" step="300" value="${F.ora}"></div>
      <div><label for="fMin">Durata (minuti)</label><input id="fMin" type="number" min="5" step="5" inputmode="numeric" value="${F.minuti}"></div>
    </div>
    <div ${S.imp.operatrici.length < 2 ? "hidden" : ""}><label>Operatrice</label><div class="ope" id="fOp"></div></div>
    <label>Primi posti liberi</label>
    <div class="liberi" id="fLiberi"></div>
    <label for="fNote">Note</label>
    <input id="fNote" maxlength="300" value="${esc(F.note)}">
    <div class="totale"><span id="fDurata"></span><span id="fPrezzo"></span></div>
    <div id="fAvviso"></div>
    <div class="azioni">
      <button id="fAnnulla">Annulla</button>
      <button id="fSalva" class="pieno" style="margin-left:auto">Salva appuntamento</button>
    </div>`);

  const disegnaOp = () => {
    const scelte = [["", "Chiunque"], ...S.imp.operatrici.map(n => [n, n])];
    $("fOp").innerHTML = scelte.map(([v, t]) => `<button type="button" data-op="${esc(v)}" class="${v === F.operatrice ? "attiva" : ""}" style="${v ? varColore(v) : ""}">${esc(t)}</button>`).join("");
    document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => { F.operatrice = b.dataset.op; disegnaOp(); ricalcola(); });
  };

  const ricalcola = () => {
    if (!F.minutiManuali && F.servizi.length) {
      F.minuti = Math.ceil(F.servizi.reduce((t, s) => t + s.minuti, 0) / 5) * 5;
      $("fMin").value = F.minuti;
    }
    F.prezzo = modifica && F.servizi.every(s => !s.prezzo) ? modifica.prezzo : F.servizi.reduce((t, s) => t + s.prezzo, 0);
    $("fDurata").textContent = durataTesto(F.minuti);
    $("fPrezzo").textContent = euro(F.prezzo);
    $("fScelti").innerHTML = F.servizi.map((s, i) => `<span class="chip">${esc(s.nome)}<button aria-label="Togli ${esc(s.nome)}" data-togli="${i}">×</button></span>`).join("");
    document.querySelectorAll("[data-togli]").forEach(b => b.onclick = () => { F.servizi.splice(+b.dataset.togli, 1); F.minutiManuali = false; ricalcola(); });
    const liberi = postiLiberi(F.minuti, F.operatrice || null, F.id, 6, usoDi(F.servizi));
    $("fLiberi").innerHTML = liberi.length ? liberi.map((p, i) => {
      const d = new Date(p.giorno + "T12:00:00");
      return `<button data-lib="${i}">${S.imp.operatrici.length > 1 ? `<i class="pallino" style="${varColore(p.operatrice)}"></i>` : ""}${d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" })} ${p.ora}</button>`;
    }).join("") : `<span class="tenue">Nessun posto nei prossimi giorni caricati</span>`;
    document.querySelectorAll("[data-lib]").forEach(b => b.onclick = () => {
      const p = liberi[+b.dataset.lib];
      F.giorno = p.giorno; F.ora = p.ora; F.operatrice = p.operatrice;
      $("fGiorno").value = p.giorno; $("fOra").value = p.ora;
      disegnaOp(); avviso(`${p.ora} con ${p.operatrice}`);
    });
  };

  const zonaCliente = () => {
    if (F.clienteId || F.nuova) {
      $("zonaCliente").innerHTML = F.nuova
        ? `<div class="due"><input id="nNome" placeholder="Nome e cognome" value="${esc(F.nome)}"><input id="nTel" type="tel" placeholder="Telefono" value="${esc(F.telefono)}"></div>
           <label class="riga"><input id="nCons" type="checkbox"> Ha dato il consenso ai promemoria su WhatsApp</label>`
        : `<span class="chip">${esc(F.nome)}${F.telefono ? " · " + esc(F.telefono) : ""}<button id="cCambia" aria-label="Cambia cliente">×</button></span>`;
      if ($("cCambia")) $("cCambia").onclick = () => { F.clienteId = ""; F.nome = ""; F.telefono = ""; zonaCliente(); };
      return;
    }
    $("zonaCliente").innerHTML = `<input id="fCliente" placeholder="Cerca nome o telefono" autocomplete="off"><div id="cLista" class="lista" hidden></div>`;
    $("fCliente").oninput = e => {
      const q = normalizza(e.target.value.trim());
      const trovate = q ? S.clienti.filter(c => normalizza(c.nome + " " + c.telefono).includes(q)).slice(0, 8) : [];
      const l = $("cLista");
      l.hidden = !q;
      l.innerHTML = trovate.map(c => `<button data-c="${esc(c.id)}"><span>${esc(c.nome)}</span><span class="tenue">${esc(c.telefono)}</span></button>`).join("")
        + `<button id="cNuova"><b>+ Nuova cliente: ${esc(e.target.value)}</b></button>`;
      l.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        const c = S.clienti.find(x => x.id === b.dataset.c);
        F.clienteId = c.id; F.nome = c.nome; F.telefono = c.telefono; zonaCliente();
      });
      $("cNuova").onclick = () => {
        const v = e.target.value.trim();
        F.nuova = true;
        if (/^[\d\s+]+$/.test(v)) F.telefono = v; else F.nome = v;
        zonaCliente();
      };
    };
  };

  const listaServizi = () => {
    const q = normalizza(F.cercaS.trim());
    const l = $("fLista");
    l.hidden = !q;
    if (!q) return;
    const trovati = S.imp.servizi.filter(s => normalizza(s.categoria + " " + s.nome).includes(q));
    let cat = "", html = "";
    trovati.forEach(s => {
      if (s.categoria !== cat) { cat = s.categoria; html += `<div class="cat">${esc(cat)}</div>`; }
      html += `<button data-s="${esc(s.nome)}"><span>${esc(s.nome)}</span><span class="tenue">${s.minuti} min · ${euro(s.prezzo)}</span></button>`;
    });
    l.innerHTML = html || `<div class="cat">Nessun trattamento trovato</div>`;
    l.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      F.servizi.push(S.imp.servizi.find(s => s.nome === b.dataset.s));
      F.minutiManuali = false;
      F.cercaS = ""; $("fCerca").value = ""; l.hidden = true;
      ricalcola(); $("fCerca").focus();
    });
  };

  $("fCerca").oninput = e => { F.cercaS = e.target.value; listaServizi(); };
  $("fGiorno").onchange = e => F.giorno = e.target.value;
  $("fOra").onchange = e => F.ora = e.target.value;
  $("fMin").onchange = e => { F.minuti = Math.max(5, +e.target.value || 5); F.minutiManuali = true; ricalcola(); };
  $("fNote").oninput = e => F.note = e.target.value;
  $("fAnnulla").onclick = chiudi;
  if ($("fBlocca")) $("fBlocca").onclick = () => apriBlocco({ giorno: F.giorno, ora: F.ora, operatrice: F.operatrice });

  const salva = async forza => {
    if (F.nuova) {
      F.nome = $("nNome").value.trim(); F.telefono = $("nTel").value.trim();
      if (!F.nome) return mostra("Scrivi il nome della cliente");
      const doppia = F.telefono && S.clienti.find(c => c.telefono.replace(/\D/g, "") === F.telefono.replace(/\D/g, ""));
      if (doppia) return mostra(`Questo numero è già di ${doppia.nome}: cercala nell'elenco.`);
    }
    if (!F.clienteId && !F.nuova) return mostra("Scegli la cliente");
    if (!F.servizi.length) return mostra("Scegli almeno un trattamento");
    if (!F.giorno || !F.ora) return mostra("Scegli giorno e ora");
    $("fSalva").disabled = true;
    try {
      if (F.nuova) {
        const c = { id: nuovoId(), nome: F.nome, telefono: F.telefono, email: "", note: "", consenso: $("nCons").checked };
        const r = await api("salvaCliente", { cliente: c });
        if (!r.ok) throw new Error();
        S.clienti.push(c); F.clienteId = c.id; F.nuova = false; zonaCliente();
      }
      const inizio = aData(F.giorno, F.ora);
      if (!F.operatrice) {
        const libere = libereAlle(F.giorno, inizio.getTime(), inizio.getTime() + F.minuti * 60000, F.id);
        if (!libere.length) { $("fSalva").disabled = false; return mostra("A quell'ora sono tutte occupate: scegli un altro orario."); }
        F.operatrice = libere[0];
      }
      const r = await salvaServer({
        id: F.id, clienteId: F.clienteId, cliente: F.nome, telefono: F.telefono,
        servizi: F.servizi.map(s => s.nome), inizio: inizio.toISOString(),
        fine: new Date(inizio.getTime() + F.minuti * 60000).toISOString(),
        usa: usoDi(F.servizi), operatrice: F.operatrice, prezzo: F.prezzo, note: F.note, stato: F.stato, promemoria: F.promemoria,
      }, forza);
      if (r?.conflitti) {
        const nomi = r.conflitti.map(c => `${oraDi(new Date(c.inizio))} ${c.cliente || c.titolo}`).join(", ");
        $("fAvviso").innerHTML = `<div class="avviso"><b>${r.risorsa ? NOMI_RISORSE[r.risorsa] : "Quel posto è già preso"}:</b> ${esc(nomi)}
          <div class="azioni"><button id="fForza">Salva lo stesso</button></div></div>`;
        $("fForza").onclick = () => salva(true);
        $("fAvviso").scrollIntoView({ block: "center" });
      } else if (r) {
        S.giorno = new Date(r.inizio);
        chiudi(); disegna(); avviso("Appuntamento salvato");
      }
    } catch (e) { mostra("Non salvato: controlla la connessione"); }
    $("fSalva").disabled = false;
  };
  const mostra = t => { $("fAvviso").innerHTML = `<div class="avviso errore">${esc(t)}</div>`; $("fAvviso").scrollIntoView({ block: "center" }); };
  $("fSalva").onclick = () => salva(false);
  zonaCliente(); disegnaOp(); ricalcola();
  // Sul telefono la tastiera aperta subito coprirebbe il modulo.
  if (!matchMedia("(pointer:coarse)").matches) ($("fCliente") || $("fCerca")).focus();
}

// --- Blocco orario -------------------------------------------------------

function apriBlocco({ giorno, ora, operatrice, modifica } = {}) {
  const dopoUnOra = o => { const m = Math.min(minDa(o) + 60, 23 * 60 + 45); return `${due(Math.floor(m / 60))}:${due(m % 60)}`; };
  const inizio = modifica ? new Date(modifica.inizio) : null, fine = modifica ? new Date(modifica.fine) : null;
  const B = {
    giorno: modifica ? chiaveGiorno(inizio) : (giorno || chiaveGiorno(S.giorno)),
    dalle: modifica ? oraDi(inizio) : (ora || "09:00"),
    alle: modifica ? oraDi(fine) : dopoUnOra(ora || "09:00"),
    per: modifica ? modifica.operatrice : (operatrice || TUTTE),
    motivo: modifica && modifica.cliente !== "Bloccato" ? modifica.cliente : "",
  };
  apriDialogo(`<h2>${modifica ? "Orario bloccato" : "Blocca un orario"}</h2>
    <p class="tenue" style="margin:0">In questo orario non si possono prendere appuntamenti.</p>
    <label for="bMotivo">Motivo (facoltativo)</label>
    <input id="bMotivo" maxlength="60" placeholder="Pausa, formazione, tempo libero…" value="${esc(B.motivo)}">
    <label>Per chi</label><div class="ope" id="bPer"></div>
    <div class="due tre">
      <div><label for="bGiorno">Giorno</label><input id="bGiorno" type="date" value="${B.giorno}"></div>
      <div><label for="bDalle">Dalle</label><input id="bDalle" type="time" step="300" value="${B.dalle}"></div>
      <div><label for="bAlle">Alle</label><input id="bAlle" type="time" step="300" value="${B.alle}"></div>
    </div>
    <div id="bAvviso"></div>
    ${modifica ? `<div class="azioni"><button id="bVia" class="pericolo">Sblocca</button></div>` : ""}
    <div class="azioni"><button id="bAnnulla">Chiudi</button><button id="bSalva" class="pieno" style="margin-left:auto">${modifica ? "Salva" : "Blocca"}</button></div>`);

  const disegnaPer = () => {
    const scelte = [[TUTTE, "Tutte"], ...S.imp.operatrici.map(n => [n, n])];
    if (!scelte.some(([v]) => v === B.per)) scelte.push([B.per, B.per]);
    $("bPer").innerHTML = scelte.map(([v, t]) => `<button type="button" data-per="${esc(v)}" class="${v === B.per ? "attiva" : ""}" style="${v === TUTTE ? "" : varColore(v)}">${esc(t)}</button>`).join("");
    document.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { B.per = b.dataset.per; disegnaPer(); });
  };
  disegnaPer();
  const mostra = t => $("bAvviso").innerHTML = `<div class="avviso errore">${esc(t)}</div>`;
  $("bAnnulla").onclick = chiudi;

  const salva = async forza => {
    const g = $("bGiorno").value, da = $("bDalle").value, a = $("bAlle").value;
    if (!g || !da || !a) return mostra("Scegli giorno e orario");
    if (a <= da) return mostra("L'orario di fine viene prima dell'inizio");
    $("bSalva").disabled = true;
    const r = await salvaServer({
      id: modifica?.id, blocco: true, cliente: $("bMotivo").value.trim() || "Bloccato", servizi: [], usa: [], prezzo: 0,
      operatrice: B.per, stato: "prenotato", inizio: aData(g, da).toISOString(), fine: aData(g, a).toISOString(),
    }, forza);
    $("bSalva").disabled = false;
    if (r?.conflitti) {
      const nomi = r.conflitti.map(c => `${oraDi(new Date(c.inizio))} ${c.cliente || c.titolo}`).join(", ");
      $("bAvviso").innerHTML = `<div class="avviso"><b>In quell'orario ci sono già:</b> ${esc(nomi)}
        <div class="azioni"><button id="bForza">Blocca lo stesso</button></div></div>`;
      $("bForza").onclick = () => salva(true);
    } else if (r) {
      S.giorno = new Date(r.inizio);
      chiudi(); disegna(); avviso("Orario bloccato");
    }
  };
  $("bSalva").onclick = () => salva(false);

  if (modifica) {
    let sicuro = false;
    $("bVia").onclick = async () => {
      if (!sicuro) { sicuro = true; $("bVia").textContent = "Tocca ancora per sbloccare"; return; }
      try {
        const r = await api("eliminaAppuntamento", { id: modifica.id });
        if (!r.ok) throw new Error();
        S.appuntamenti = S.appuntamenti.filter(x => x.id !== modifica.id);
        S.conteggi = {};
        chiudi(); disegna(); avviso("Orario sbloccato");
      } catch (e) { mostra("Non sbloccato: controlla la connessione"); }
    };
  }
}

// --- Promemoria ----------------------------------------------------------

function numeroWa(t) {
  let n = String(t || "").replace(/\D/g, "");
  if (n.startsWith("00")) n = n.slice(2);
  if (/^3\d{8,9}$/.test(n)) n = "39" + n;
  return n;
}

function apriWhatsApp(a, conTesto) {
  const n = numeroWa(a.telefono);
  if (!n) return avviso("Manca il numero di telefono");
  const d = new Date(a.inizio);
  const testo = conTesto ? S.imp.promemoria
    .replaceAll("{nome}", (a.cliente || "").split(" ")[0])
    .replaceAll("{giorno}", d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }))
    .replaceAll("{ora}", oraDi(d)) : "";
  window.open(`https://wa.me/${n}${testo ? "?text=" + encodeURIComponent(testo) : ""}`, "_blank");
}

function disegnaPromemoria() {
  // Il prossimo giorno di apertura, così il sabato si preparano i messaggi del lunedì.
  let g = piuGiorni(new Date(), 1);
  for (let i = 0; i < 7 && !orarioDel(g); i++) g = piuGiorni(g, 1);
  S.giornoProm = S.giornoProm || chiaveGiorno(g);
  const d = new Date(S.giornoProm + "T12:00:00");
  const lista = delGiorno(S.giornoProm).filter(a => haOre(a) && !a.esterno && !a.blocco).sort((p, q) => p.inizio < q.inizio ? -1 : 1);
  const daFare = lista.filter(a => !a.promemoria).length;
  const cons = a => S.clienti.find(c => c.id === a.clienteId)?.consenso;

  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="barra" style="border:0;background:none;padding:0 0 10px">
      <button id="pPrima" aria-label="Giorno prima">‹</button>
      <strong>${giornoLungo(d)}</strong>
      <button id="pDopo" aria-label="Giorno dopo">›</button>
      <span class="tenue" style="margin-left:auto">${daFare ? daFare + " da mandare" : "Tutti mandati"}</span>
    </div>
    ${lista.length ? lista.map(a => {
      const ha = !!numeroWa(a.telefono);
      return `<div class="scheda"><b>${oraDi(new Date(a.inizio))} · ${esc(a.cliente)}</b>
        <div class="tenue">${esc((a.servizi || []).join(", "))}</div>
        ${cons(a) === false ? `<div class="tenue">Consenso ai promemoria non segnato nella scheda</div>` : ""}
        <div class="azioni">${a.promemoria ? `<span class="tenue">Mandato</span>` : ha
          ? `<button class="wa" data-p="${esc(a.id)}">Manda promemoria</button>`
          : `<span class="tenue">Manca il telefono</span>`}</div></div>`;
    }).join("") : `<div class="scheda tenue">Nessun appuntamento in questo giorno.</div>`}
  </div>`;

  $("pPrima").onclick = () => { S.giornoProm = chiaveGiorno(piuGiorni(d, -1)); disegna(); };
  $("pDopo").onclick = () => { S.giornoProm = chiaveGiorno(piuGiorni(d, 1)); disegna(); };
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
    const a = S.appuntamenti.find(x => x.id === b.dataset.p);
    apriWhatsApp(a, true);
    await salvaServer({ ...a, promemoria: new Date().toISOString() }, true);
  });
}

// --- Clienti -------------------------------------------------------------

function disegnaClienti() {
  const q = normalizza(S.cercaClienti.trim());
  const lista = S.clienti.filter(c => !q || normalizza(c.nome + " " + c.telefono).includes(q))
    .sort((a, b) => a.nome.localeCompare(b.nome, "it"));
  const giaAperto = document.activeElement?.id === "cerca";
  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="azioni" style="margin:0 0 10px;flex-wrap:nowrap"><input id="cerca" placeholder="Cerca nome o telefono (${S.clienti.length} clienti)" value="${esc(S.cercaClienti)}"><button id="cNew" style="white-space:nowrap">+ Nuova</button></div>
    ${lista.slice(0, 100).map(c => `<button class="scheda cliccabile" data-cl="${esc(c.id)}"><b>${esc(c.nome)}</b><div class="tenue">${esc(c.telefono) || "Senza telefono"}</div></button>`).join("") || `<div class="scheda tenue">Nessuna cliente trovata.</div>`}
  </div>`;
  $("cerca").oninput = e => { S.cercaClienti = e.target.value; disegnaClienti(); };
  if (giaAperto) { const c = $("cerca"); c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  $("cNew").onclick = () => modificaCliente({ id: nuovoId(), nome: "", telefono: "", email: "", note: "", consenso: false }, true);
  document.querySelectorAll("[data-cl]").forEach(b => b.onclick = () => schedaCliente(S.clienti.find(c => c.id === b.dataset.cl)));
}

async function schedaCliente(c) {
  apriDialogo(`<h2>${esc(c.nome)}</h2>
    <p class="tenue" style="margin:0">${esc(c.telefono) || "Senza telefono"}${c.email ? " · " + esc(c.email) : ""}<br>Promemoria WhatsApp: ${c.consenso ? "consenso dato" : "consenso non segnato"}</p>
    ${c.note ? `<p>${esc(c.note)}</p>` : ""}
    <div class="azioni">
      <button class="pieno" id="sApp">+ Appuntamento</button>
      ${c.telefono ? `${telefonoLink(c.telefono)}<button id="sWa" class="wa">WhatsApp</button>` : ""}
      <button id="sMod">Modifica</button>
    </div>
    <h3 style="margin:16px 0 6px;font-size:15px">Storico</h3>
    <div id="sStorico" class="tenue">Sto cercando…</div>
    <div class="azioni"><button id="sDel" class="pericolo">Cancella scheda</button><button id="sChiudi" style="margin-left:auto">Chiudi</button></div>`);
  $("sApp").onclick = () => apriForm({ cliente: c });
  $("sMod").onclick = () => modificaCliente(c);
  $("sChiudi").onclick = chiudi;
  if ($("sWa")) $("sWa").onclick = () => apriWhatsApp({ telefono: c.telefono });
  let sicuro = false;
  $("sDel").onclick = async () => {
    if (!sicuro) { sicuro = true; $("sDel").textContent = "Tocca ancora per cancellare"; return; }
    try {
      const r = await api("eliminaCliente", { id: c.id });
      if (!r.ok) throw new Error();
      S.clienti = S.clienti.filter(x => x.id !== c.id);
      chiudi(); disegna(); avviso("Scheda cancellata");
    } catch (e) { avviso("Non cancellata: controlla la connessione"); }
  };
  try {
    const r = await api("storico", { clienteId: c.id });
    const zona = $("sStorico");
    if (!zona) return;
    const spesa = r.appuntamenti.filter(a => a.stato === "fatto").reduce((t, a) => t + (a.prezzo || 0), 0);
    const nonVenuta = r.appuntamenti.filter(a => a.stato === "noshow").length;
    zona.innerHTML = r.appuntamenti.length
      ? `<p style="margin:0 0 6px">${r.appuntamenti.length} appuntamenti · ${euro(spesa)} fatti${nonVenuta ? ` · ${nonVenuta} volte non è venuta` : ""}</p>`
        + r.appuntamenti.slice(0, 15).map(a => `<div>${new Date(a.inizio).toLocaleDateString("it-IT")} ${oraDi(new Date(a.inizio))} — ${esc((a.servizi || []).join(", "))}</div>`).join("")
      : "Ancora nessun appuntamento.";
  } catch (e) { if ($("sStorico")) $("sStorico").textContent = "Storico non disponibile senza connessione."; }
}

function modificaCliente(c, nuova) {
  apriDialogo(`<h2>${nuova ? "Nuova cliente" : "Modifica cliente"}</h2>
    <label for="mNome">Nome e cognome</label><input id="mNome" value="${esc(c.nome)}">
    <label for="mTel">Telefono</label><input id="mTel" type="tel" value="${esc(c.telefono)}">
    <label for="mMail">Email</label><input id="mMail" type="email" value="${esc(c.email)}">
    <label for="mNote">Note fisse</label><textarea id="mNote" rows="3">${esc(c.note)}</textarea>
    <label class="riga"><input id="mCons" type="checkbox" ${c.consenso ? "checked" : ""}> Ha dato il consenso ai promemoria su WhatsApp</label>
    <div id="mErr"></div>
    <div class="azioni"><button id="mAnn">Annulla</button><button id="mSalva" class="pieno" style="margin-left:auto">Salva</button></div>`);
  $("mAnn").onclick = chiudi;
  $("mSalva").onclick = async () => {
    const x = { ...c, nome: $("mNome").value.trim(), telefono: $("mTel").value.trim(), email: $("mMail").value.trim(), note: $("mNote").value.trim(), consenso: $("mCons").checked };
    if (!x.nome) return $("mErr").innerHTML = `<div class="avviso errore">Scrivi il nome</div>`;
    const doppia = x.telefono && S.clienti.find(o => o.id !== x.id && o.telefono.replace(/\D/g, "") === x.telefono.replace(/\D/g, ""));
    if (doppia) return $("mErr").innerHTML = `<div class="avviso errore">Questo numero è già di ${esc(doppia.nome)}</div>`;
    try {
      const r = await api("salvaCliente", { cliente: x });
      if (!r.ok) throw new Error();
      S.clienti = S.clienti.filter(o => o.id !== x.id); S.clienti.push(x);
      chiudi(); disegna(); avviso("Cliente salvata");
    } catch (e) { $("mErr").innerHTML = `<div class="avviso errore">Non salvata: controlla la connessione</div>`; }
  };
}

function disegnaImpostazioni() {
  const nomiGiorni = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  const ordine = [1, 2, 3, 4, 5, 6, 0];
  const I = S.impBozza = S.impBozza || JSON.parse(JSON.stringify(S.imp));
  const stimate = I.servizi.filter(s => s.stimata).length;
  let cat = "";
  const righe = I.servizi.map((s, i) => {
    const titolo = s.categoria !== cat ? (cat = s.categoria, `<h3 style="font-size:15px;margin:14px 0 6px">${esc(cat)}</h3>`) : "";
    return `${titolo}<div class="riga-serv ${s.stimata ? "stimata" : ""}">
      <input data-i="${i}" data-k="nome" value="${esc(s.nome)}" aria-label="Nome trattamento">
      <input data-i="${i}" data-k="minuti" type="number" min="1" value="${s.minuti}" aria-label="Minuti">
      <input data-i="${i}" data-k="prezzo" type="number" min="0" step="0.5" value="${s.prezzo}" aria-label="Prezzo">
      <select data-i="${i}" data-k="usa" aria-label="Dove si fa">${["cabina", "unghie", "laser", "nessuna"].map(u => `<option value="${u}" ${(s.usa || usoDefault(s.categoria, s.nome)) === u ? "selected" : ""}>${{ cabina: "Cabina", unghie: "Unghie", laser: "Laser", nessuna: "Ovunque" }[u]}</option>`).join("")}</select>
      <button data-via="${i}" aria-label="Togli ${esc(s.nome)}">×</button></div>`;
  }).join("");

  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="scheda"><b>Operatrici</b><div class="tenue">Una per riga. Ognuna ha la sua colonna in agenda.</div>
      <textarea id="iOp" rows="5" style="margin-top:6px">${esc(I.operatrici.join("\n"))}</textarea></div>
    <div class="scheda"><b>Spazi e macchinari</b><div class="tenue">Quanti appuntamenti possono stare in contemporanea.</div>
      <div class="due" style="grid-template-columns:1fr 1fr 1fr">
        ${[["cabina", "Cabine"], ["unghie", "Postazioni unghie"], ["laser", "Laser"]].map(([k, t]) => `<div><label for="iR${k}">${t}</label><input id="iR${k}" data-ris="${k}" type="number" min="0" inputmode="numeric" value="${I.risorse[k]}"></div>`).join("")}
      </div></div>
    <div class="scheda"><b>Orari di apertura</b>
      ${ordine.map(g => `<div class="due" style="grid-template-columns:110px 1fr 1fr;align-items:center;margin-top:6px">
        <label class="riga" style="margin:0"><input type="checkbox" data-aperto="${g}" ${I.orari[g] ? "checked" : ""}> ${nomiGiorni[g].slice(0, 3)}</label>
        <input type="time" data-da="${g}" value="${I.orari[g]?.[0] || "09:00"}" aria-label="${nomiGiorni[g]} apertura">
        <input type="time" data-a="${g}" value="${I.orari[g]?.[1] || "18:30"}" aria-label="${nomiGiorni[g]} chiusura"></div>`).join("")}
    </div>
    <div class="scheda"><b>Messaggio di promemoria</b><div class="tenue">{nome}, {giorno} e {ora} si riempiono da soli.</div>
      <textarea id="iProm" rows="3" style="margin-top:6px">${esc(I.promemoria)}</textarea></div>
    <div class="scheda"><b>Listino</b><div class="tenue">Nome, minuti, prezzo e dove si fa.${stimate ? ` In giallo le ${stimate} durate stimate: correggile o conferma salvando.` : ""}</div>
      ${righe}
      <div class="azioni"><button id="iAgg">+ Trattamento</button></div></div>
    <div class="azioni" style="margin-bottom:20px"><button id="iSalva" class="pieno">Salva impostazioni</button></div>
    <p class="tenue">Versione ${VERSIONE_APP}</p>
  </div>`;

  document.querySelectorAll("[data-k]").forEach(e => e.onchange = () => {
    const s = I.servizi[+e.dataset.i], k = e.dataset.k;
    s[k] = k === "nome" ? e.value.trim() : k === "usa" ? e.value : Math.max(0, +e.value || 0);
    if (k === "minuti") delete s.stimata;
  });
  document.querySelectorAll("[data-via]").forEach(b => b.onclick = () => { I.servizi.splice(+b.dataset.via, 1); disegnaImpostazioni(); });
  document.querySelectorAll("[data-ris]").forEach(e => e.onchange = () => I.risorse[e.dataset.ris] = Math.max(0, +e.value || 0));
  $("iAgg").onclick = () => { I.servizi.push({ categoria: "Altro", nome: "Nuovo trattamento", minuti: 30, prezzo: 0 }); disegnaImpostazioni(); };
  $("iOp").onchange = e => I.operatrici = e.target.value.split("\n").map(x => x.trim()).filter(Boolean);
  $("iProm").onchange = e => I.promemoria = e.target.value;
  const orari = g => {
    const su = document.querySelector(`[data-aperto="${g}"]`).checked;
    I.orari[g] = su ? [document.querySelector(`[data-da="${g}"]`).value, document.querySelector(`[data-a="${g}"]`).value] : null;
  };
  ordine.forEach(g => document.querySelectorAll(`[data-aperto="${g}"],[data-da="${g}"],[data-a="${g}"]`).forEach(e => e.onchange = () => orari(g)));
  $("iSalva").onclick = async () => {
    if (!I.operatrici.length) return avviso("Serve almeno un'operatrice");
    I.servizi = I.servizi.filter(s => s.nome);
    I.servizi.forEach(s => delete s.stimata);
    try {
      const r = await api("salvaImpostazioni", { impostazioni: I });
      if (!r.ok) throw new Error();
      S.imp = JSON.parse(JSON.stringify(I)); S.impBozza = null;
      disegna(); avviso("Impostazioni salvate");
    } catch (e) { avviso("Non salvate: controlla la connessione"); }
  };
}

// --- Scheda al passaggio del mouse --------------------------------------

const nascondiFumetto = () => { $("fumetto").style.display = "none"; };

function mostraFumetto(b) {
  const a = S.appuntamenti.find(x => x.id === b.dataset.app && x.inizio === b.dataset.ini);
  if (!a) return;
  const f = $("fumetto"), ini = new Date(a.inizio), fin = new Date(a.fine);
  const quando = `${ini.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" })}, ${oraDi(ini)}–${oraDi(fin)} · ${durataTesto((fin - ini) / 60000)}`;
  const stato = { fatto: "✓ Fatto", noshow: "Non è venuta" }[a.stato] || "";
  f.style.cssText = `--c:${a.esterno ? "#7c8796" : coloreDi(a.operatrice)[0]}`;
  f.innerHTML = a.blocco
    ? `<b>🔒 ${esc(a.cliente)}</b><div class="riga">${quando}</div><div class="riga">${a.operatrice === TUTTE ? "Tutte le operatrici" : esc(a.operatrice)}</div>`
    : a.esterno
    ? `<b>${esc(a.titolo)}</b><div class="riga">${quando}</div><div class="riga">Scritto su Google Calendar</div>`
    : `<b>${esc(a.cliente)}</b><div class="riga">${quando}</div>
       <div class="tratt">${esc((a.servizi || []).join(", "))}</div>
       <div class="fondoF"><span><i class="pallino"></i>${esc(a.operatrice)}</span><span>${euro(a.prezzo || 0)}</span></div>
       ${a.telefono ? `<div class="riga">${esc(a.telefono)}</div>` : ""}
       ${stato ? `<div class="riga">${stato}</div>` : ""}
       ${a.note ? `<div class="nota">${esc(a.note)}</div>` : ""}`;
  // Accanto al blocco, dal lato dove c'è spazio; mai fuori dallo schermo.
  f.style.display = "block";
  const r = b.getBoundingClientRect(), l = f.offsetWidth, h = f.offsetHeight, m = 8;
  const x = r.right + m + l <= innerWidth ? r.right + m : Math.max(m, r.left - m - l);
  f.style.left = x + "px";
  f.style.top = Math.max(m, Math.min(r.top, innerHeight - h - m)) + "px";
}

$("main").addEventListener("pointerover", e => {
  const b = e.pointerType === "mouse" && e.target.closest(".app");
  if (b) mostraFumetto(b);
});
$("main").addEventListener("pointerout", e => { if (e.target.closest(".app")) nascondiFumetto(); });
$("main").addEventListener("focusin", e => { const b = e.target.closest?.(".app"); if (b && b.matches(":focus-visible")) mostraFumetto(b); });
$("main").addEventListener("focusout", nascondiFumetto);
$("main").addEventListener("scroll", nascondiFumetto, true);
$("main").addEventListener("click", nascondiFumetto);

{

  $("main").addEventListener("touchstart", e => {
    x0 = S.vista === "agenda" && e.touches.length === 1 ? e.touches[0].clientX : null;
    y0 = e.touches[0]?.clientY ?? 0;
  }, { passive: true });
  $("main").addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) vaiA(passo(dx < 0 ? 1 : -1));
  }, { passive: true });
}

leggiLinkCollega();
$("provaReset").onclick = () => { if ($("provaReset").dataset.ok) ricominciaProva(); else { $("provaReset").dataset.ok = 1; $("provaReset").textContent = "Sicura? Tocca ancora"; } };
caricaCopia();
disegna();
carica();

// Tiene allineati telefono e PC: rilegge quando si torna sull'app e ogni minuto,
// ma non mentre si sta compilando un modulo o le impostazioni.
const ricarica = () => { if (document.visibilityState === "visible" && !$("dlg").open && S.vista !== "impostazioni") carica(); };
document.addEventListener("visibilitychange", ricarica);
setInterval(ricarica, 60000);
