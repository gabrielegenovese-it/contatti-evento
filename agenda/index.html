<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda · Alessia Estetica & Benessere</title>
<meta name="theme-color" content="#ffe9ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--gut:50px;--viola:#6a4a9c;--viola2:#ece3f7;--bordeaux:#8e1f2f;--rosa:#ffe9ee;--inchiostro:#2a2024;--grigio:#6e5f68;--linea:#f3dfe6;--fondo:#fff8fa;--rosso:#b3261e;--verde:#1e7a4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input,select,label{touch-action:manipulation}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--inchiostro);background:var(--fondo);display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 13px;min-height:42px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--viola);outline-offset:1px}
button.pieno{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;font-weight:600}
button.pericolo{color:var(--rosso);border-color:#e7c3c0}
button.wa{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
input,select,textarea{width:100%;border:1px solid #cfc8d8;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label.riga{display:flex;gap:8px;align-items:center;font-weight:400}
label.riga input{width:auto;min-height:0}
header{background:var(--rosa);border-bottom:1px solid #fcd4df;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0 auto 0 0;line-height:0}
header h1 img{height:52px;width:auto;mix-blend-mode:multiply}
nav button{color:#5d4f57}
a.bottone{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 13px;min-height:42px;color:inherit;text-decoration:none}
.ico{display:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--grigio)}
nav button.attivo{background:#fff;color:var(--viola);font-weight:600}
main{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.scorre{flex:1;min-height:0;overflow:auto}
.contenuto{max-width:760px;width:100%;flex:none;margin:0 auto;padding:14px}
.barra{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.barra strong{font-size:17px;text-transform:capitalize}
.settimana{display:flex;gap:4px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--linea);overflow-x:auto}
.settimana button{flex:1;min-width:58px;padding:5px 3px;font-size:13px;line-height:1.25}
.settimana button.oggi{border-color:var(--viola)}
.settimana button.scelto{background:var(--viola);color:#fff;border-color:var(--viola)}
.settimana small{display:block;opacity:.8}
.grigliaZona{display:flex;min-width:100%;position:relative}
.ore{width:var(--gut);flex:none;position:sticky;left:0;background:var(--fondo);z-index:3;border-right:1px solid var(--linea)}
.ora{position:absolute;font-size:12px;color:var(--grigio);right:6px;transform:translateY(-50%)}
.colonna{flex:1;min-width:0;border-right:1px solid var(--linea);background:#fff}
.testate{position:sticky;top:0;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--linea)}
.angolo{width:var(--gut);flex:none;border-right:1px solid var(--linea)}
.tab{flex:1;min-width:0;border:0;border-radius:0;border-bottom:3px solid var(--c);background:#fff;font-weight:600;font-size:14px;padding:6px 2px;min-height:40px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[data-zoom]{background:var(--c2)}
.tab.attiva[data-zoom]{background:var(--c);color:#fff}
.scale{display:flex;gap:2px;margin-left:8px;background:var(--viola2);border-radius:10px;padding:2px}
.scale button{border:0;background:none;min-height:36px;padding:4px 11px;font-size:14px;color:var(--viola)}
.scale button.attiva{background:var(--viola);color:#fff;font-weight:600}
.filtri{display:flex;background:#fff;border-bottom:1px solid var(--linea)}
/* settimana come Google Calendar: blocchi pieni del colore dell'operatrice, alti quanto durano */
.sett .colonna,.settT .tab{min-width:var(--colMin,0)}
/* allargata con lo zoom: le ore e le testate devono restare attaccate anche scorrendo di lato */
.sett,.settT{width:var(--largo,100%);min-width:100%}
/* spazio bianco tra un giorno e l'altro (Gabriele, 5 nov 2026): i giorni si distinguono a colpo d'occhio */
.sett,.settT{gap:var(--stacco)}
:root{--stacco:14px}
@media (max-width:620px){:root{--stacco:7px}}
/* netti (Gabriele, 5 nov 2026) + fondo BIANCO dove stanno gli appuntamenti (Gabriele, 6 nov 2026):
   giorni bianchi con bordo marcato, gli stacchi tra un giorno e l'altro rosati */
.grigliaZona.sett{background:#f6dfe7}
.sett .colonna{background:#fff;border-left:1.5px solid #d9a9bb;border-right:1.5px solid #d9a9bb}
.settT .tab{border-left:1.5px solid #d9a9bb;border-right:1.5px solid #d9a9bb;background:#fff}
.settT{background:#f6dfe7}
.settT .angolo{position:sticky;left:0;background:#fff;z-index:5}
.sett .app.gc{display:flex;flex-direction:column;justify-content:flex-start;border:0;border-radius:5px;background:var(--t);color:#fff;padding:2px 5px;font-size:12px;line-height:1.25;min-height:0;box-shadow:0 0 0 1px #fff;z-index:1}
/* i blocchi in primo piano (z-index alto) restano dentro il giorno: non coprono testate e ore quando si scorre */
.sett .pista{isolation:isolate}
.sett .corsia{position:absolute;top:0;bottom:0;border-left:1px dashed #eadbe1;pointer-events:none;background:linear-gradient(var(--t),var(--t)) top/100% 3px no-repeat}
.sett .corsia:first-of-type{border-left:0}
.sett .app.gc b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sett .app.gc span{color:#fff;opacity:.92;font-size:11px}
.sett .app.gc.basso{padding:0 4px;font-size:11px;line-height:1.1}
.sett .app.gc.blocco{background:repeating-linear-gradient(135deg,var(--t) 0 6px,color-mix(in srgb,var(--t) 55%,#fff) 6px 12px)}
.sett .app.gc.pertutte{z-index:0;background:repeating-linear-gradient(135deg,#e6e2e8 0 6px,#f4f1f5 6px 12px);box-shadow:none;color:var(--grigio)}
.sett .app.gc.pertutte span{color:var(--grigio)}
.sett .app.gc.privato,.sett .app.gc.privato span{color:#3d2c00}
.sett .app.gc.fatto{opacity:.55}
.sett .app.gc.noshow{opacity:.5}
.zoom{display:flex;gap:2px;background:var(--viola2);border-radius:10px;padding:2px}
.zoom button{border:0;background:none;min-height:40px;min-width:40px;padding:0 10px;font-size:20px;line-height:1;color:var(--viola)}
.tab.oggi{color:var(--viola);text-decoration:underline}
.mese{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(92px,1fr);min-height:100%}
.testaMese{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border-bottom:1px solid var(--linea);font-size:13px;text-align:center;color:var(--grigio);padding:4px 0;text-transform:capitalize}
.cella{border:0;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);border-radius:0;background:#fff;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:0;font-size:14px}
.cella.fuori{background:var(--fondo);color:#a59eae}
.cella.chiusa{background:repeating-linear-gradient(45deg,#fdeef2,#fdeef2 6px,#fff6f8 6px,#fff6f8 12px)}
.cella.oggi b{background:var(--viola);color:#fff;border-radius:99px;padding:0 7px}
.cella small{color:var(--grigio)}
.barre{display:flex;gap:2px;height:7px;margin-top:auto}
.barre i{display:block;background:var(--c);border-radius:2px;min-width:3px}
.anno{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:14px}
.miniMese{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px}
.miniMese>button{width:100%;border:0;min-height:34px;padding:2px 4px;display:flex;justify-content:space-between;font-weight:600;text-transform:capitalize}
.miniGiorni{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.miniGiorni button{min-height:27px;padding:0;border:0;border-radius:5px;font-size:12px;background:hsl(263 36% var(--l,98%));color:var(--t,inherit)}
.miniGiorni button.oggi{outline:2px solid var(--viola)}
.stretta{flex:.6}
.solo .stretta{flex:.45}
div.tab{display:flex;align-items:center;justify-content:center;color:var(--grigio)}
.pista{position:relative;cursor:copy;background-image:linear-gradient(to bottom,var(--linea) 1px,transparent 1px);background-size:100% var(--oraPx)}
.chiuso{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#fbe6ec,#fbe6ec 6px,#fff1f4 6px,#fff1f4 12px);pointer-events:none}
.adesso{position:absolute;left:0;right:0;height:2px;background:var(--rosso);z-index:1;pointer-events:none}
.app{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--c);background:var(--c2);border-radius:6px;padding:2px 6px;text-align:left;font-size:13px;line-height:1.2;overflow:hidden;min-height:22px;z-index:1}
.app b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4f4759}
.app u{text-decoration:none}
.etichetta{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;background:var(--c);color:#fff;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.app .corto{display:none}
.app.esterno{background:#eef0f3;border-left-color:#7c8796;border-left-style:dashed}
.app.fatto{opacity:.6}
.app.noshow{opacity:.55}
.app.noshow b{text-decoration:line-through}
.ope{display:flex;gap:6px;flex-wrap:wrap}
.ope button{min-height:40px;padding:6px 12px;font-size:14px;border-bottom:3px solid var(--c,var(--linea))}
.ope button.attiva{background:var(--c,var(--inchiostro));border-color:var(--c,var(--inchiostro));color:#fff;font-weight:600}
.pallino{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.giornata{padding:6px 14px;background:#fff6dd;font-size:14px;border-bottom:1px solid var(--linea)}
.scheda{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px}
.scheda.cliccabile{cursor:pointer;display:block;width:100%;text-align:left}
.tenue{color:var(--grigio);font-size:14px}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 16px 50px rgba(30,15,50,.3)}
dialog::backdrop{background:rgba(30,20,45,.45)}
.dentro{padding:16px}
.dentro h2{margin:0 0 6px;font-size:19px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--viola2);border-radius:99px;padding:4px 6px 4px 11px;margin:3px 4px 3px 0;font-size:14px}
.chip button{min-height:28px;min-width:28px;padding:0;border:0;background:none}
.lista{max-height:190px;overflow:auto;border:1px solid var(--linea);border-radius:10px;margin-top:6px}
.lista button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);border-radius:0;background:#fff;display:flex;justify-content:space-between;gap:10px}
.lista .cat{font-size:12px;font-weight:700;padding:6px 12px;background:var(--fondo);color:var(--grigio)}
.liberi{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.liberi button{font-size:14px;min-height:38px;padding:5px 10px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.totale{display:flex;justify-content:space-between;font-weight:600;margin-top:12px;padding:10px 12px;background:var(--viola2);border-radius:10px}
.avviso{background:#fff6dd;border:1px solid #ecd892;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.avviso.errore{background:#fbeae9;border-color:#e7c3c0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--inchiostro);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;display:none}
.riga-serv{display:grid;grid-template-columns:1fr 66px 66px 96px 36px;gap:6px;align-items:center;margin-bottom:6px}
.riga-serv input,.riga-serv select{padding:6px 8px;min-height:38px}
.riga-serv button{min-height:36px;padding:0}
.stimata [data-k="minuti"]{border-color:#d4a72c;background:#fff6dd}
@media (max-width:620px){nav{order:3;width:100%}nav button{flex:1;padding:8px 2px}
:root{--gut:36px}.scale{margin-left:0;width:100%}.scale button{flex:1;padding:4px 2px}.mese{grid-auto-rows:minmax(64px,1fr)}.cella{padding:3px}.cella small{font-size:11px}
.contaGiorno{display:none}.ora{font-size:11px;right:3px}.tab{font-size:13px}
.compatta .app{left:1px!important;padding:1px 3px;font-size:12px;border-left-width:3px}.compatta .app b{white-space:normal}.compatta .app span{display:none}.compatta .app .lungo{display:none}.compatta .app .corto{display:inline}}
@media (max-width:620px){
header{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;justify-content:center}
header h1{margin:0}
header h1 img{height:46px}
main{margin-bottom:calc(60px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;order:0;width:auto;gap:0;background:#fff;border-top:1px solid var(--linea);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(60,30,60,.06)}
nav button.attivo{background:var(--viola2);color:var(--viola)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:4px 0;font-size:11px;border-radius:12px}
.ico{display:block}
#btnNuovo{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:60px;height:60px;min-height:0;padding:0;border-radius:50%;font-size:0;box-shadow:0 8px 22px rgba(142,31,47,.4)}
#btnNuovo::before{content:"+";font-size:32px;line-height:1;font-weight:400}
body.modulo #btnNuovo{display:none}
.barra{padding:6px 10px;gap:6px}
.barra #ieri{order:1}.barra strong{order:2;flex:1;min-width:0;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barra #domani{order:3}.barra #oggi{order:4;padding:6px 10px}
.barra>button{min-height:44px;min-width:44px;padding:6px}
.scale{order:5}.scale button{min-height:40px}
.barra .zoom{order:4}.zoom button{min-height:44px;min-width:44px}
.settimana{padding:5px 8px}.settimana button{min-height:44px;min-width:52px;font-size:12px}
.tab{min-height:44px}
.scorre{padding-bottom:84px}
.contenuto{padding:12px 12px 90px}
.anno{grid-template-columns:1fr;padding:10px 10px 90px}
.miniGiorni button{min-height:42px;font-size:14px}
.miniMese>button{min-height:44px}
.chip button{min-height:36px;min-width:36px}
.liberi button{min-height:44px}
.lista button{min-height:48px}
.ope{display:grid;grid-template-columns:repeat(3,1fr)}
.ope button{min-height:46px;padding:6px 4px}
div.tab{font-size:11px}
#toast{bottom:calc(150px + env(safe-area-inset-bottom))}
dialog{width:100vw;max-width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:18px 18px 0 0}
.dentro{padding:18px 14px 0}
.dentro>.azioni:last-child{position:sticky;bottom:0;background:#fff;margin:12px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);z-index:2}
.dentro>.azioni:last-child>button{min-height:48px;flex:1}
.azioni>button,.azioni>a{min-height:46px}
.scheda.cliccabile{min-height:60px}
}
@media (max-height:480px) and (orientation:landscape){
header{display:none}
main{margin-bottom:0}
nav{position:static}
}
#fumetto{position:fixed;z-index:30;display:none;width:250px;background:#fff;border:1px solid var(--linea);border-top:4px solid var(--c);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(60,30,60,.22);pointer-events:none}
#fumetto b{display:block;font-size:15px}
#fumetto .riga{color:var(--grigio);font-size:13px;margin-top:2px}
#fumetto .tratt{margin-top:5px}
#fumetto .fondoF{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px}
#fumetto .nota{margin-top:5px;font-size:13px;font-style:italic}
#bannerCopia{padding:6px 14px;background:#fbeae9;font-size:14px;border-bottom:1px solid var(--linea)}
#bannerCopia button{min-height:32px;padding:2px 10px;font-size:13px;margin-left:6px}
#guidaCopia{margin-top:8px;font-size:14px}
#guidaCopia summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--grigio)}
#guidaCopia summary::before{content:"▸";margin-right:6px}
#guidaCopia[open] summary::before{content:"▾"}
#guidaCopia ul{margin:4px 0 0;padding-left:18px}
#guidaCopia li{margin-bottom:6px}
#btnAggiorna{display:inline-flex;align-items:center;gap:6px}
#btnAggiorna .ico{display:block;width:20px;height:20px}
#btnAggiorna.gira .ico{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (max-width:620px){header{position:relative}#btnAggiorna{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));padding:8px;min-height:44px;min-width:44px;justify-content:center}#btnAggiorna span{display:none}}
.rigaApp{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin-bottom:4px;padding:6px 10px;text-align:left;font-size:14px;color:inherit}
.rigaApp .cosa{display:block;color:var(--grigio);font-size:13px}
.rigaApp .stato{flex:none;align-self:center;font-size:13px;color:var(--grigio)}
.rigaApp.annullata b{text-decoration:line-through}
.tre{grid-template-columns:1.4fr 1fr 1fr}
.tre>*{min-width:0}
.tab .cal2{display:none}
.app.blocco{background:repeating-linear-gradient(135deg,#f3eff2,#f3eff2 6px,#e7e1e6 6px,#e7e1e6 12px);border-left-color:var(--c)}
.app.blocco.pertutte{z-index:0;border-left-color:#7c8796}
@media (max-width:620px){.tre{grid-template-columns:1fr 1fr}.tre>:first-child{grid-column:1/-1}.tab .cal1{display:none}.tab .cal2{display:inline}}
/* Disponibilità nel modulo */
.calDisp{border:1px solid var(--linea);border-radius:12px;padding:6px;background:#fff}
.calTesta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.calTesta strong{flex:1;text-align:center;text-transform:capitalize;font-size:15px}
.calTesta button{min-height:36px;min-width:40px;padding:2px 8px}
.calGriglia{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calGriglia .gs{font-size:11px;color:var(--grigio);text-align:center;text-transform:capitalize}
.calGriglia button{min-height:38px;padding:2px 0;border-radius:8px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.calGriglia button i{display:block;width:16px;height:4px;border-radius:2px;background:transparent}
.calGriglia .gLibero i{background:#2e9e64}.calGriglia .gPochi i{background:#d39b17}.calGriglia .gPieno i{background:#c9c0c6}
.calGriglia .gPieno{color:#a59eae}
.calGriglia .chiusoG{background:repeating-linear-gradient(45deg,#fdeef2,#fdeef2 5px,#fff6f8 5px,#fff6f8 10px);color:#a59eae}
.calGriglia .fuoriM{visibility:hidden}
.calGriglia .sceltoG{background:var(--viola);border-color:var(--viola);color:#fff}
.calGriglia .oggiG{border-color:var(--viola)}
.legenda{display:flex;gap:12px;font-size:12px;color:var(--grigio);margin-top:5px;flex-wrap:wrap}
.legenda i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.liberi .pallino{margin-right:2px;width:7px;height:7px}
.liberi button.sceltoO{background:var(--viola);color:#fff;border-color:var(--viola)}
.presi{background:var(--viola2);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.presi div{margin-top:2px}

/* Listino */
.area{border:1px solid var(--linea);border-radius:12px;padding:8px 10px 10px;margin-top:12px;background:var(--fondo)}
.areaTesta{display:flex;gap:6px;align-items:center}

.areaTesta button{min-height:38px;min-width:38px;padding:0 8px}
.colTesta{display:grid;grid-template-columns:minmax(0,1fr) 80px 86px 136px 132px 36px;gap:6px;font-size:12px;color:var(--grigio);margin:8px 0 3px;font-weight:600}
.riga-serv{grid-template-columns:minmax(0,1fr) 80px 86px 136px 132px 36px}

.riga-serv .c-nome{grid-area:1/1/2/3}.riga-serv .c-via{grid-area:1/3/2/4}.riga-serv .c-min{grid-area:2/1/3/2}.riga-serv .c-eur{grid-area:2/2/3/4}.riga-serv .c-dove{grid-area:3/1/4/2}.riga-serv .c-area{grid-area:3/2/4/4}

<script>
"use strict";
const VERSIONE_APP = 26;
// Un colore per operatrice, nell'ordine delle Impostazioni: [scuro, chiaro].
const COLORI = [["#6a4a9c", "#ece3f7"], ["#b0245f", "#fde3ec"], ["#2f7358", "#dff0e8"], ["#96601a", "#f7ead6"], ["#8a6d00", "#f8f0cf"], ["#a02a5e", "#f9e3ee"]];
// Gli stessi colori che le operatrici hanno su Google Calendar (detti da Gabriele il 4 nov 2026,
// tinte misurate sul suo Calendar): così agenda e Calendar non si confondono.
// Denisa = Salvia dal 5 nov 2026: il suo eucalipto Calendar non lo comunica ai programmi esterni.
const COLORI_CALENDAR = { alessia: "#039be5", marta: "#7986cb", veronica: "#3f51b5", denisa: "#33b679" };
// Colore di un evento scritto a mano su Calendar (getColor = numero del colore). Tinte come le mostra Calendar oggi.
const TINTE_EVENTO = { "1": "#7986cb", "2": "#33b679", "3": "#8e24aa", "4": "#e67c73", "5": "#f6bf26", "6": "#f4511e", "7": "#039be5", "8": "#616161", "9": "#3f51b5", "10": "#0b8043", "11": "#d50000" };
const chiaro = hex => { const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * .84); return `rgb(${m(n >> 16)},${m(n >> 8 & 255)},${m(n & 255)})`; };
const ORA_INIZIO = 6, ORA_FINE = 23, PX_BASE = 1.5, GIORNI_CARICATI = 42;
// Zoom di giorno e settimana: allunga le ore (e in settimana allarga i giorni). Si ricorda per dispositivo.
const ZOOM_MIN = 0.6, ZOOM_MAX = 4;
let ZOOM = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, +localStorage.getItem("agenda-zoom") || 1));
let PX_MIN = PX_BASE * ZOOM;
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euro = n => "€ " + (Math.round(n * 100) / 100).toLocaleString("it-IT");
const due = n => String(n).padStart(2, "0");
const chiaveGiorno = d => `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
const oraDi = d => `${due(d.getHours())}:${due(d.getMinutes())}`;
const aData = (giorno, ora) => new Date(`${giorno}T${ora}:00`);
const piuGiorni = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lunedi = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const minDa = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const durataTesto = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) : ""}`;
const nuovoId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const giornoLungo = d => d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
const haOre = a => !a.giornata;
const USI = { cabina: ["cabina"], unghie: ["unghie"], laser: ["cabina", "laser"], pressoterapia: ["cabina", "pressoterapia"], nessuna: [] };
const NOMI_USI = { cabina: "Cabina", unghie: "Unghie", laser: "Laser", pressoterapia: "Pressoterapia", nessuna: "Ovunque" };
const NOMI_RISORSE = { cabina: "Tutte le cabine sono occupate", unghie: "Tutte le postazioni unghie sono occupate", laser: "Il laser è già occupato", pressoterapia: "La macchina della pressoterapia è già occupata" };
// Più trattamenti nello stesso appuntamento tengono tutto ciò che servono per l'intera durata.
const usoDi = servizi => [...new Set(servizi.flatMap(s => USI[s.usa || usoDefault(s.categoria || "", s.nome)] || []))];
const TUTTE = "Tutte";
const soloApp = a => !a.blocco;
// Ha un'operatrice: scritto dall'app, o scritto a mano e riconosciuto dallo script (colore, "No Marta", privato).
const diChi = a => !a.esterno || !!a.operatrice;
const operatriciViste = () => [...new Set([...S.imp.operatrici, ...S.appuntamenti.filter(a => !a.esterno && a.operatrice && a.operatrice !== TUTTE).map(a => a.operatrice)])];
const nomeChiave = n => normalizza(String(n || "").trim().split(/\s+/)[0] || "");
const coloreDi = n => {
  const cal = COLORI_CALENDAR[nomeChiave(n)];
  if (cal) return [cal, chiaro(cal)];
  // chi non è nella tabella prende una tinta libera dalle altre
  const altre = (S.opViste || S.imp.operatrici).filter(x => !COLORI_CALENDAR[nomeChiave(x)]);
  return COLORI[altre.indexOf(n) % COLORI.length] || ["#7c8796", "#eef0f3"];
};
// Colore di un blocco: quello dell'operatrice; se è scritto a mano senza operatrice, il suo colore di Calendar.
// Privati di Alessia (Banana su Calendar): restano del loro colore, così si vede che non sono clienti.
const tintaDi = a => a.privato && TINTE_EVENTO[a.colore] ? TINTE_EVENTO[a.colore]
  : a.operatrice && a.operatrice !== TUTTE ? coloreDi(a.operatrice)[0]
  : a.esterno && TINTE_EVENTO[a.colore] ? TINTE_EVENTO[a.colore]
  // senza colore = colore predefinito del calendario di Alessia (azzurro): come su Calendar. Solo il colore:
  // non viene assegnato ad Alessia, perché "senza colore" può essere anche un eucalipto di Denisa.
  : a.esterno && !a.colore ? COLORI_CALENDAR.alessia : "#7c8796";
const varColore = n => { const [c, c2] = coloreDi(n); return `--c:${c};--c2:${c2}`; };
const NOMI_SCALA = { giorno: "Giorno", settimana: "Settimana", mese: "Mese", anno: "Anno" };
const nomeCorto = n => { const p = String(n || "").trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[1][0]}.` : p[0]; };
const normalizza = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const S = {
  cfg: JSON.parse(localStorage.getItem("agenda-cfg") || "null"),
  vista: "agenda",
  giorno: new Date(),
  appuntamenti: [], clienti: [],
  imp: IMPOSTAZIONI_PARTENZA,
  dal: null, al: null,
  filtro: localStorage.getItem("agenda-filtro") || "",
  scala: localStorage.getItem("agenda-scala") || "giorno",
  finestre: [], conteggi: {},
  caricato: false, erroreRete: false, cercaClienti: "", scritture: 0,
};
// Fino al 5 nov 2026 una versione di prova (dati inventati) stava sullo stesso sito e scriveva nella
// stessa memoria del dispositivo. Se ne è rimasto qualcosa, si butta prima che l'agenda lo legga:
// - collegata alla prova → si scollega e si butta la copia offline (erano appuntamenti finti);
// - la prova è stata aperta qui → le righe in attesa per il file sul PC potrebbero essere finte:
//   non si scrivono, si mettono da parte in "agenda-note-coda-scartata".
const RESTI_PROVA = S.cfg?.url === "demo" || localStorage.getItem("agenda-demo-dati") !== null;
if (S.cfg?.url === "demo") {
  S.cfg = null;
  ["agenda-cfg", "agenda-copia"].forEach(k => localStorage.removeItem(k));
}
if (RESTI_PROVA) {
  const coda = localStorage.getItem("agenda-note-coda");
  if (coda && coda !== "[]") localStorage.setItem("agenda-note-coda-scartata", coda);
  ["agenda-note-coda", "agenda-demo-dati"].forEach(k => localStorage.removeItem(k));
}

// --- Collegamento e server ---------------------------------------------

function leggiLinkCollega() {
  const m = location.hash.match(/collega=([^&]+)/);
  if (!m) return;
  try {
    S.cfg = JSON.parse(atob(decodeURIComponent(m[1])));
    localStorage.setItem("agenda-cfg", JSON.stringify(S.cfg));
  } catch (e) { avviso("Link di collegamento non valido"); }
  history.replaceState(null, "", location.pathname);
}

async function api(azione, resto = {}) {
  const r = await fetch(S.cfg.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // niente preflight: Apps Script non lo gestisce
    body: JSON.stringify({ codice: S.cfg.codice, azione, ...resto }),
  });
  const dati = await r.json();
  if (!dati.ok && dati.errore === "codice") throw new Error("Codice non valido: riapri il link di collegamento");
  return dati;
}

// Cosa serve alla vista in corso.
function rangeVista(d = S.giorno) {
  if (S.scala === "mese") { const i = lunedi(new Date(d.getFullYear(), d.getMonth(), 1)); return [i, piuGiorni(i, 42)]; }
  return [lunedi(d), piuGiorni(lunedi(d), 7)];
}

// Le settimane attorno a oggi si tengono sempre, se no i posti liberi sarebbero sbagliati
// quando si guarda un mese lontano. Se la vista cade fuori, si aggiunge la sua finestra.
async function carica() {
  if (!S.cfg) return;
  const dal = piuGiorni(lunedi(new Date()), -7), al = piuGiorni(dal, GIORNI_CARICATI);
  const [ini, fin] = rangeVista();
  const scritture = S.scritture;
  try {
    const d = await api("carica", { dal: dal.toISOString(), al: al.toISOString() });
    if (!d.ok) throw new Error(d.dettaglio || d.errore);
    let lista = d.appuntamenti;
    const finestre = [[dal, al]];
    if (S.scala !== "anno" && (ini < dal || fin > al)) {
      const e = await api("carica", { dal: ini.toISOString(), al: fin.toISOString() });
      if (!e.ok) throw new Error(e.dettaglio || e.errore);
      const viste = new Set(lista.map(a => a.id + a.inizio));
      lista = lista.concat(e.appuntamenti.filter(a => !viste.has(a.id + a.inizio)));
      finestre.push([ini, fin]);
    }
    S.appuntamenti = lista; S.clienti = d.clienti;
    S.imp = normalizzaImp(d.impostazioni);
    S.dal = dal; S.al = al; S.finestre = finestre; S.caricato = true; S.erroreRete = false;
    localStorage.setItem("agenda-copia", JSON.stringify({ appuntamenti: S.appuntamenti, clienti: S.clienti, imp: S.imp }));
    // Se nel frattempo si è salvato qualcosa, questa lista può essere già vecchia: si allinea al giro dopo.
    if (scritture === S.scritture) allineaCopia(lista, dal, al);
  } catch (e) {
    S.erroreRete = true;
  }
  disegna();
}

async function caricaConteggi(anno) {
  if (S.conteggiInCorso === anno) return;
  S.conteggiInCorso = anno;
  try {
    const r = await api("conteggi", { dal: new Date(anno, 0, 1).toISOString(), al: new Date(anno + 1, 0, 1).toISOString() });
    if (!r.ok) throw new Error();
    S.conteggi[anno] = r.giorni; S.erroreRete = false;
  } catch (e) { S.erroreRete = true; S.conteggi[anno] = S.conteggi[anno] || null; }
  S.conteggiInCorso = null;
  disegna();
}

function assicura() {
  if (S.scala === "anno") return;
  const [ini, fin] = rangeVista();
  if (!S.finestre.some(([a, b]) => ini >= a && fin <= b)) carica();
}

function caricaCopia() {
  const c = JSON.parse(localStorage.getItem("agenda-copia") || "null");
  if (c) { S.appuntamenti = c.appuntamenti; S.clienti = c.clienti; S.imp = normalizzaImp(c.imp); }
}

// Impostazioni salvate prima di una versione nuova: si completano con quello che manca.
function normalizzaImp(x) {
  const imp = { ...IMPOSTAZIONI_PARTENZA, ...(x || {}) };
  const vecchie = x && (!x.risorse || x.risorse.pressoterapia == null);
  imp.risorse = { ...IMPOSTAZIONI_PARTENZA.risorse, ...(x?.risorse || {}) };
  imp.pause = imp.pause || {};
  // Prima della macchina della pressoterapia quei trattamenti tenevano solo una cabina.
  if (vecchie) imp.servizi = imp.servizi.map(s => /pressoterapia/i.test(s.nome) && (!s.usa || s.usa === "cabina") ? { ...s, usa: "pressoterapia" } : s);
  const cat = [...(imp.categorie || []), ...imp.servizi.map(s => s.categoria || "Altro")];
  imp.categorie = [...new Set(cat)];
  return imp;
}

// Un periodo in più (per esempio il mese guardato nel modulo): si aggiunge a quello già caricato.
const coperto = (ini, fin) => S.finestre.some(([a, b]) => ini >= a && fin <= b);
async function caricaFinestra(ini, fin) {
  if (coperto(ini, fin)) return true;
  const chiave = ini.toISOString() + fin.toISOString();
  if (caricaFinestra.inCorso?.[chiave]) return caricaFinestra.inCorso[chiave];
  caricaFinestra.inCorso = caricaFinestra.inCorso || {};
  return caricaFinestra.inCorso[chiave] = (async () => {
    try {
      const e = await api("carica", { dal: ini.toISOString(), al: fin.toISOString() });
      if (!e.ok) throw new Error();
      const viste = new Set(S.appuntamenti.map(a => a.id + a.inizio));
      S.appuntamenti = S.appuntamenti.concat(e.appuntamenti.filter(a => !viste.has(a.id + a.inizio)));
      S.finestre.push([ini, fin]);
      return true;
    } catch (err) { return false; }
    finally { delete caricaFinestra.inCorso[chiave]; }
  })();
}

function avviso(testo) {
  const t = $("toast");
  t.textContent = testo; t.style.display = "block";
  clearTimeout(avviso.t); avviso.t = setTimeout(() => t.style.display = "none", 3500);
}

// --- Copia sul PC --------------------------------------------------------
// Ogni appuntamento nuovo, cambiato o cancellato si aggiunge in fondo a un file di testo sul PC,
// compresi quelli presi dal telefono, che si vedono alla rilettura. Si scrive sempre prima in coda
// (localStorage): se il file non è raggiungibile le righe aspettano lì, non si perdono.
const CHIAVI_COPIA = { attiva: "agenda-note-attiva", coda: "agenda-note-coda", visti: "agenda-note-visti" };
const Copia = {
  possibile: "showSaveFilePicker" in window,
  attiva: !!localStorage.getItem(CHIAVI_COPIA.attiva),
  file: null, stato: "spenta",   // spenta, ok, permesso, persa, errore
  coda: JSON.parse(localStorage.getItem(CHIAVI_COPIA.coda) || "[]"),
  visti: JSON.parse(localStorage.getItem(CHIAVI_COPIA.visti) || "{}"),
  giro: Promise.resolve(), ultima: null,
};

function dbCopia(modo, usa) {
  return new Promise((ok, no) => {
    const q = indexedDB.open("agenda-note", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("cose");
    q.onerror = () => no(q.error);
    q.onsuccess = () => {
      const r = usa(q.result.transaction("cose", modo).objectStore("cose"));
      r.onsuccess = () => { q.result.close(); ok(r.result); };
      r.onerror = () => { q.result.close(); no(r.error); };
    };
  });
}

const chiaveCopia = a => a.esterno ? a.id + "|" + a.inizio : a.id;

function rigaCopia(a) {
  const ini = new Date(a.inizio), fin = new Date(a.fine);
  const data = ini.toLocaleDateString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  const quando = a.giornata ? data + " tutto il giorno" : `${data} ${oraDi(ini)}-${oraDi(fin)}`;
  const voci = a.blocco ? [quando, "Orario bloccato: " + a.cliente, a.operatrice]
    : a.esterno ? [quando, a.titolo, "scritto su Google Calendar"]
    : [quando, a.cliente, a.telefono, a.operatrice, (a.servizi || []).join(", "), euro(a.prezzo || 0),
       { fatto: "Fatto", noshow: "Non è venuta" }[a.stato], a.note && "Nota: " + a.note];
  return voci.filter(Boolean).join(" | ").replace(/\s*\n\s*/g, " ");
}

function metteInCoda(etichetta, riga) {
  const d = new Date();
  const scritta = d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
  Copia.coda.push(`${scritta} ${oraDi(d)}  ${etichetta.padEnd(10)}  ${riga}`);
}

function ricordaCopia() {
  try {
    localStorage.setItem(CHIAVI_COPIA.coda, JSON.stringify(Copia.coda));
    localStorage.setItem(CHIAVI_COPIA.visti, JSON.stringify(Copia.visti));
  } catch (e) { Copia.stato = "errore"; bannerCopia(); }
}

function notaCopia(a, etichetta) {
  if (!Copia.attiva) return;
  const k = chiaveCopia(a), riga = rigaCopia(a), prima = Copia.visti[k];
  if (prima?.d === riga) return;
  metteInCoda(etichetta || (prima ? "MODIFICATO" : "NUOVO"), riga);
  Copia.visti[k] = { d: riga, t: new Date(a.inizio).getTime() };
}

function viaCopia(k) {
  const v = Copia.visti[k];
  if (!Copia.attiva || !v) return;
  metteInCoda("CANCELLATO", v.d);
  delete Copia.visti[k];
}

// Confronta quello che c'è sul calendario con quello che il file sa già.
function allineaCopia(lista, dal, al) {
  if (!Copia.attiva) return;
  const da = dal.getTime(), a = al.getTime(), dentro = t => t >= da && t < a, presenti = new Set();
  lista.forEach(x => {
    if (!dentro(new Date(x.inizio).getTime())) return;
    presenti.add(chiaveCopia(x)); notaCopia(x);
  });
  Object.entries(Copia.visti).forEach(([k, v]) => {
    if (v.t < da) delete Copia.visti[k];
    else if (dentro(v.t) && !presenti.has(k)) viaCopia(k);
  });
  scriviCopia();
}

function scriviCopia() {
  ricordaCopia();
  return Copia.giro = Copia.giro.then(svuotaCoda);
}

async function svuotaCoda() {
  if (!Copia.attiva) return;
  try {
    Copia.file = Copia.file || await dbCopia("readonly", s => s.get("file"));
    if (!Copia.file) Copia.stato = "persa";
    else if (await Copia.file.queryPermission({ mode: "readwrite" }) !== "granted") Copia.stato = "permesso";
    else {
      const righe = Copia.coda.slice();
      if (righe.length) {
        const f = await Copia.file.getFile();
        const w = await Copia.file.createWritable({ keepExistingData: true });
        await w.seek(f.size);
        const testa = "﻿Agenda Alessia Estetica & Benessere - copia degli appuntamenti\r\nOgni riga: quando è stata scritta, cosa è successo, poi i dati dell'appuntamento.\r\n\r\n";
        await w.write((f.size ? "" : testa) + righe.join("\r\n") + "\r\n");
        await w.close();
        Copia.coda.splice(0, righe.length);
        Copia.ultima = new Date();
        ricordaCopia();
      }
      Copia.stato = "ok";
    }
  } catch (e) { Copia.stato = e.name === "NotFoundError" ? "persa" : "errore"; }
  bannerCopia();
}

// La prima volta il file parte con tutti gli appuntamenti del prossimo anno, non solo quelli in memoria.
async function attivaCopia() {
  const oggi = new Date();
  let file;
  try {
    file = await showSaveFilePicker({
      suggestedName: `Agenda Alessia - copia dal ${chiaveGiorno(oggi)}.txt`, startIn: "documents",
      types: [{ description: "File di testo", accept: { "text/plain": [".txt"] } }],
    });
  } catch (e) { return; }           // finestra chiusa senza scegliere
  await dbCopia("readwrite", s => s.put(file, "file"));
  Copia.file = file; Copia.attiva = true; Copia.visti = {};
  S.scritture++;
  localStorage.setItem(CHIAVI_COPIA.attiva, "1");
  let lista = S.appuntamenti;
  try {
    const r = await api("carica", { dal: piuGiorni(oggi, -7).toISOString(), al: piuGiorni(oggi, 366).toISOString() });
    if (r.ok) lista = r.appuntamenti.concat(lista.filter(a => !r.appuntamenti.some(x => chiaveCopia(x) === chiaveCopia(a))));
  } catch (e) { /* si parte da quello già caricato */ }
  lista.slice().sort((a, b) => a.inizio < b.inizio ? -1 : 1).forEach(a => notaCopia(a, "IN AGENDA"));
  await scriviCopia();
  if (Copia.stato === "ok") avviso("Copia sul PC attivata");
}

async function riattivaCopia() {
  if (Copia.stato === "persa") return attivaCopia();
  if (Copia.stato === "permesso") await Copia.file.requestPermission({ mode: "readwrite" }).catch(() => {});
  await scriviCopia();
}

// --- Calcoli agenda -----------------------------------------------------

// Gli appuntamenti divisi per giorno, rifatti solo quando la lista cambia.
const cacheGiorni = { lista: null, n: -1, mappa: new Map() };
function delGiorno(chiave) {
  if (cacheGiorni.lista !== S.appuntamenti || cacheGiorni.n !== S.appuntamenti.length) {
    const m = new Map();
    S.appuntamenti.forEach(a => { const k = chiaveGiorno(new Date(a.inizio)); if (!m.has(k)) m.set(k, []); m.get(k).push(a); });
    Object.assign(cacheGiorni, { lista: S.appuntamenti, n: S.appuntamenti.length, mappa: m });
  }
  return (cacheGiorni.mappa.get(chiave) || []).slice();
}

function orarioDel(d) { return S.imp.orari[d.getDay()] || null; }
// La pausa vale solo se il giorno è aperto e se sta dentro l'orario.
function pausaDel(d) {
  const o = orarioDel(d), p = S.imp.pause?.[d.getDay()];
  return o && p && p[1] > p[0] ? p : null;
}
// Le fasce da tratteggiare in griglia: prima dell'apertura, la pausa, dopo la chiusura.
function fasceChiuse(d, altezza) {
  const o = orarioDel(d), y = hhmm => (minDa(hhmm) - ORA_INIZIO * 60) * PX_MIN;
  if (!o) return [[0, altezza]];
  const p = pausaDel(d);
  return [[0, y(o[0])], ...(p ? [[y(p[0]), y(p[1])]] : []), [y(o[1]), altezza]];
}
// "chiuso" se fuori orario, "pausa" se tocca la pausa, altrimenti null.
function fuoriOrario(chiave, ini, fin) {
  const d = new Date(chiave + "T12:00:00"), o = orarioDel(d);
  const m = t => { const x = new Date(t); return x.getHours() * 60 + x.getMinutes(); };
  if (!o || m(ini) < minDa(o[0]) || m(fin - 1) >= minDa(o[1])) return "chiuso";
  const p = pausaDel(d);
  if (p && m(ini) < minDa(p[1]) && m(fin) > minDa(p[0])) return "pausa";
  return null;
}

// Chi è libera in quella fascia. Un evento scritto a mano su Calendar non dice di chi è:
// conta come una persona occupata, così quattro operatrici non si bloccano per un evento solo.
function libereAlle(chiave, ini, fin, ignoraId) {
  const voci = delGiorno(chiave).filter(a => haOre(a) && a.id !== ignoraId && a.stato !== "noshow"
    && new Date(a.inizio).getTime() < fin && new Date(a.fine).getTime() > ini);
  // scritti a mano senza operatrice riconosciuta: ognuno occupa "una qualsiasi"
  const esterni = voci.filter(a => a.esterno && !a.operatrice).length;
  const libere = S.imp.operatrici.filter(n => !voci.some(a => diChi(a) && (a.operatrice === n || a.operatrice === TUTTE)));
  return libere.length > esterni ? libere : [];
}

// La prima risorsa esaurita in quella fascia, o null. Conta il massimo in uso nello stesso momento.
function risorsaPiena(chiave, ini, fin, usa, ignoraId) {
  const voci = delGiorno(chiave).filter(a => haOre(a) && a.id !== ignoraId && a.stato !== "noshow"
    && new Date(a.inizio).getTime() < fin && new Date(a.fine).getTime() > ini);
  return usa.find(r => {
    const chi = voci.filter(a => (a.usa || []).includes(r));
    const istanti = [ini, ...chi.map(a => new Date(a.inizio).getTime()).filter(t => t > ini && t < fin)];
    const picco = Math.max(...istanti.map(t => chi.filter(a => new Date(a.inizio).getTime() <= t && new Date(a.fine).getTime() > t).length));
    return S.imp.risorse[r] != null && picco >= S.imp.risorse[r];
  }) || null;
}

// Gli orari d'inizio liberi in un giorno, ogni 15 minuti, con chi è libera a quell'ora.
// null = giorno non ancora caricato (non si sa).
function slotLiberi(chiave, durata, operatrice, ignoraId, usa = []) {
  const d = new Date(chiave + "T12:00:00"), o = orarioDel(d);
  if (!o) return [];
  const ini0 = aData(chiave, "00:00");
  if (!coperto(ini0, piuGiorni(ini0, 1))) return null;
  const ora = Date.now(), p = pausaDel(d), trovati = [];
  for (let m = minDa(o[0]); m + durata <= minDa(o[1]); m += 15) {
    if (p && m < minDa(p[1]) && m + durata > minDa(p[0])) continue;
    const ini = aData(chiave, `${due(Math.floor(m / 60))}:${due(m % 60)}`).getTime(), fin = ini + durata * 60000;
    if (ini < ora) continue;
    if (risorsaPiena(chiave, ini, fin, usa, ignoraId)) continue;
    const libere = libereAlle(chiave, ini, fin, ignoraId).filter(n => !operatrice || n === operatrice);
    if (libere.length) trovati.push({ giorno: chiave, ora: oraDi(new Date(ini)), libere });
  }
  return trovati;
}

const tabOperatrici = () => {
