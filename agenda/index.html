const nascondiFumetto = () => { $("fumetto").style.display = "none"; };

function mostraFumetto(b) {
  const a = S.appuntamenti.find(x => x.id === b.dataset.app && x.inizio === b.dataset.ini);
  if (!a) return;
  const f = $("fumetto"), ini = new Date(a.inizio), fin = new Date(a.fine);
  const quando = `${ini.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" })}, ${oraDi(ini)}–${oraDi(fin)} · ${durataTesto((fin - ini) / 60000)}`;
  const stato = { fatto: "✓ Fatto", noshow: "Non è venuta" }[a.stato] || "";
  f.style.cssText = `--c:${tintaDi(a)}`;
  f.innerHTML = a.esterno && a.blocco
    ? `<b>${esc(a.titolo)}</b><div class="riga">${quando}</div><div class="riga">${a.privato ? "Extra" : "Assenza"} · ${esc(a.operatrice)}</div>`
    : a.blocco
    ? `<b>🔒 ${esc(a.cliente)}</b><div class="riga">${quando}</div><div class="riga">${a.operatrice === TUTTE ? "Tutte le operatrici" : esc(a.operatrice)}</div>`
    : a.esterno
    ? `<b>${esc(a.titolo)}</b><div class="riga">${quando}</div><div class="riga">Scritto su Google Calendar</div>`
    : `<b>${esc(a.cliente)}</b><div class="riga">${quando}</div>
       <div class="tratt">${esc((a.servizi || []).join(", "))}</div>
       <div class="fondoF"><span><i class="pallino"></i>${esc(a.operatrice)}</span><span>${euro(a.prezzo || 0)}</span></div>
       ${a.telefono ? `<div class="riga">${esc(a.telefono)}</div>` : ""}
       ${stato ? `<div class="riga">${stato}</div>` : ""}
       ${a.note ? `<div class="nota">${esc(a.note)}</div>` : ""}`;
  // Accanto al blocco, dal lato dove c'è spazio; mai fuori dallo schermo.
  f.style.display = "block";
  const r = b.getBoundingClientRect(), l = f.offsetWidth, h = f.offsetHeight, m = 8;
  const x = r.right + m + l <= innerWidth ? r.right + m : Math.max(m, r.left - m - l);
  f.style.left = x + "px";
  f.style.top = Math.max(m, Math.min(r.top, innerHeight - h - m)) + "px";
}

$("main").addEventListener("pointerover", e => {
  const b = e.pointerType === "mouse" && e.target.closest(".app");
  if (b) mostraFumetto(b);
});
$("main").addEventListener("pointerout", e => { if (e.target.closest(".app")) nascondiFumetto(); });
$("main").addEventListener("focusin", e => { const b = e.target.closest?.(".app"); if (b && b.matches(":focus-visible")) mostraFumetto(b); });
$("main").addEventListener("focusout", nascondiFumetto);
$("main").addEventListener("scroll", nascondiFumetto, true);
$("main").addEventListener("click", nascondiFumetto);

// --- Avvio ---------------------------------------------------------------

document.querySelectorAll("#menu button").forEach(b => b.onclick = () => {
  if (b.dataset.vista !== "incassi") chiudiIncassi();      // uscendo dagli incassi la password si dimentica
  S.vista = b.dataset.vista; S.impBozza = null; disegna();
});
$("btnNuovo").onclick = () => S.cfg ? apriForm() : disegna();
// Ricarica tutta la pagina: così arrivano sia gli appuntamenti nuovi sia l'ultima versione dell'app.
$("btnAggiorna").onclick = async () => {
  if (!navigator.onLine) return avviso("Connessione assente: non si può aggiornare");
  if (S.impBozza && JSON.stringify(S.impBozza) !== JSON.stringify(S.imp)) return avviso("Prima salva le impostazioni");
  $("btnAggiorna").classList.add("gira");
  await Copia.giro;
  const reg = await navigator.serviceWorker?.getRegistration().catch(() => null);
  await reg?.update().catch(() => {});
  location.reload();
};
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) chiudi(); });
$("dlg").addEventListener("close", () => {
  document.body.classList.remove("modulo");
  if (S.ritorno) schedaCliente(S.ritorno);
});

// Swipe a destra o sinistra nell'agenda: periodo precedente o successivo.
{
  let x0 = null, y0 = 0;
  $("main").addEventListener("touchstart", e => {
    x0 = S.vista === "agenda" && e.touches.length === 1 ? e.touches[0].clientX : null;
    y0 = e.touches[0]?.clientY ?? 0;
  }, { passive: true });
  $("main").addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) vaiA(passo(dx < 0 ? 1 : -1));
  }, { passive: true });
}

leggiLinkCollega();
caricaCopia();
disegna();
scriviCopia();
carica();

// Tiene allineati telefono e PC: rilegge quando si torna sull'app e ogni minuto,
// ma non mentre si sta compilando un modulo o le impostazioni.
const ricarica = () => { if (document.visibilityState === "visible" && !$("dlg").open && S.vista !== "impostazioni") carica(); };
document.addEventListener("visibilitychange", ricarica);
setInterval(ricarica, 60000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
