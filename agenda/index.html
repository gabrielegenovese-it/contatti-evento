  return S.opViste.map(n => `<button class="tab ${S.filtro === n ? "attiva" : ""}" data-zoom="${esc(n)}" style="${varColore(n)}" aria-pressed="${S.filtro === n}">${esc(n)}</button>`).join("");
};
const yDi = d => (d.getHours() * 60 + d.getMinutes() - ORA_INIZIO * 60) * PX_MIN;
const visibileFiltro = a => !S.filtro || a.esterno || a.operatrice === S.filtro || a.operatrice === TUTTE;

// Zoom: tiene fermo il punto sotto il dito (o il centro) mentre la griglia si allunga.
function zooma(fattore, cx, cy) {
  const nuovo = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, ZOOM * fattore));
  const g = $("griglia"), zona = g?.querySelector(".grigliaZona");
  if (!zona || Math.abs(nuovo - ZOOM) < 0.005) return;
  const r = g.getBoundingClientRect();
  const dy = (cy ?? r.top + g.clientHeight / 2) - r.top, dx = (cx ?? r.left + g.clientWidth / 2) - r.left;
  const minuto = (g.scrollTop + dy - zona.offsetTop) / PX_MIN;
  const quota = (g.scrollLeft + dx) / Math.max(1, g.scrollWidth);
  ZOOM = nuovo; PX_MIN = PX_BASE * ZOOM;
  localStorage.setItem("agenda-zoom", String(Math.round(ZOOM * 100) / 100));
  disegnaAgenda();
  const g2 = $("griglia"), z2 = g2.querySelector(".grigliaZona");
  g2.scrollTop = z2.offsetTop + minuto * PX_MIN - dy;
  g2.scrollLeft = quota * g2.scrollWidth - dx;
}
const zoomAttivo = e => (S.scala === "giorno" || S.scala === "settimana") && S.vista === "agenda" && e.target.closest?.("#griglia");
// Ctrl + rotellina, e il pizzico del touchpad (che il browser manda come Ctrl + rotellina)
let zoomRuota = 1, zoomRuotaPunto = null;
$("main").addEventListener("wheel", e => {
  if (!e.ctrlKey || !zoomAttivo(e)) return;
  e.preventDefault();
  zoomRuota *= Math.exp(-Math.max(-60, Math.min(60, e.deltaY)) * 0.006);
  zoomRuotaPunto = [e.clientX, e.clientY];
  if (zoomRuota !== 1 && !zooma.attesa) zooma.attesa = requestAnimationFrame(() => {
    zooma.attesa = 0; const f = zoomRuota; zoomRuota = 1; zooma(f, ...zoomRuotaPunto);
  });
}, { passive: false });
// due dita sul telefono. Ogni scatto di zoom ridisegna la griglia: il dito resta legato all'elemento
// toccato per primo, che esce dalla pagina e non fa più risalire gli eventi. Si ascolta lui direttamente.
let pizzico = null;
const distanza = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const muoviPizzico = e => {
  if (!pizzico || e.touches.length !== 2) return;
  e.preventDefault();
  const voluto = pizzico.z * distanza(e.touches) / pizzico.d;
  if (Math.abs(voluto / ZOOM - 1) < 0.06 || zooma.attesa) return;
  const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  zooma.attesa = requestAnimationFrame(() => { zooma.attesa = 0; zooma(voluto / ZOOM, cx, cy); });
};
const finePizzico = e => {
  if (e.touches.length >= 2 || !pizzico) return;
  pizzico.bersagli.forEach(t => { t.removeEventListener("touchmove", muoviPizzico); t.removeEventListener("touchend", finePizzico); t.removeEventListener("touchcancel", finePizzico); });
  pizzico = null;
};
$("main").addEventListener("touchstart", e => {
  if (e.touches.length !== 2 || !zoomAttivo(e)) return;
  const bersagli = [...new Set([...e.touches].map(t => t.target))];
  bersagli.forEach(t => { t.addEventListener("touchmove", muoviPizzico, { passive: false }); t.addEventListener("touchend", finePizzico); t.addEventListener("touchcancel", finePizzico); });
  pizzico = { d: distanza(e.touches), z: ZOOM, bersagli };
}, { passive: true });

// Come Google Calendar: gli eventi che si sovrappongono si dividono la larghezza del giorno.
// Restituisce [evento, colonna, colonne del suo gruppo].
// Si ragiona sulla fine VISIBILE: un evento da 0-10 minuti è disegnato più alto di quanto dura
// (altezza minima), e se contasse la fine vera il blocco dopo gli finirebbe sopra (ven 6 nov 2026).
const ALTO_MIN = 18;
const fineVista = a => Math.max(Date.parse(a.fine), Date.parse(a.inizio) + ALTO_MIN / PX_MIN * 60000);
function disponi(voci) {
  const v = voci.map(a => [a, Date.parse(a.inizio), fineVista(a)]);
  const ord = v.sort((p, q) => p[1] - q[1] || q[2] - p[2]);
  const out = [];
  let gruppo = [], fineGruppo = 0;
  const chiudi = () => {
    const colonne = [];
    const posti = gruppo.map(([a, ini, fin]) => {
      let c = colonne.findIndex(f => f <= ini);
      if (c < 0) { c = colonne.length; colonne.push(0); }
      colonne[c] = fin;
      return [a, c];
    });
    posti.forEach(([a, c]) => out.push([a, c, colonne.length]));
    gruppo = []; fineGruppo = 0;
  };
  for (const x of ord) {
    if (gruppo.length && x[1] >= fineGruppo) chiudi();
    gruppo.push(x);
    if (x[2] > fineGruppo) fineGruppo = x[2];
  }
  if (gruppo.length) chiudi();
  return out;
}
// Corsia (colonna colore) di un evento nella settimana: la sua operatrice; gli scritti a mano
// senza colore sono azzurri come Alessia e stanno nella sua corsia; il resto in una corsia "altro".
const ALTRO = "__altro__";
function corsiaDi(a) {
  if (a.operatrice && a.operatrice !== TUTTE) return a.operatrice;
  const ale = S.imp.operatrici.find(n => nomeChiave(n) === "alessia");
  return ale && tintaDi(a) === COLORI_CALENDAR.alessia ? ale : ALTRO;
}

function disegnaSettimana() {
  const chiave = "s" + chiaveGiorno(lunedi(S.giorno));
  const scrollPrima = S.scrollFatto === chiave ? $("griglia")?.scrollTop : null;
  const tab = tabOperatrici();
  const oggi = chiaveGiorno(new Date());
  const lun = lunedi(S.giorno);
  const tutti = [...Array(7).keys()].map(i => piuGiorni(lun, i));
  const voci = tutti.flatMap(d => delGiorno(chiaveGiorno(d)).filter(a => haOre(a) && visibileFiltro(a)));
  const giorni = tutti.filter(d => orarioDel(d) || delGiorno(chiaveGiorno(d)).some(haOre));
  const solo = !!S.filtro;
  const altezza = (ORA_FINE - ORA_INIZIO) * 60 * PX_MIN;
  const ore = [...Array(ORA_FINE - ORA_INIZIO).keys()].map(i => i ? `<div class="ora" style="top:${i * 60 * PX_MIN}px">${ORA_INIZIO + i}:00</div>` : "").join("");
  // larghezza di un giorno: con lo zoom oltre 1 i giorni si allargano e la settimana scorre di lato
  const spazio = Math.max(280, ($("main").clientWidth || innerWidth) - 48);
  const colPx = Math.max(spazio / Math.max(1, giorni.length), ZOOM > 1 ? spazio / Math.max(1, giorni.length) * ZOOM : 0);
  const colMin = ZOOM > 1 ? Math.round(colPx) : 0;

  const blocco = (a, c, n, k = 0, K = 1) => {
    const ini = new Date(a.inizio), fin = new Date(a.fine);
    const alto = Math.max((fin - ini) / 60000 * PX_MIN - 1, ALTO_MIN - 1);
    const largo = colPx / K / n - 2;
    // i più brevi sempre davanti: se si toccano, il piccolo resta leggibile sopra il lungo
    const davanti = 2 + Math.max(0, 600 - Math.round((fin - ini) / 60000));
    const pertutte = a.operatrice === TUTTE;
    const nome = a.esterno ? a.titolo : a.blocco ? `🔒 ${a.cliente}` : a.cliente;
    const segno = a.stato === "fatto" ? "✓ " : "";
    const orario = `${oraDi(ini)}–${oraDi(fin)}`;
    const servizi = a.esterno || a.blocco ? "" : (a.servizi || []).join(", ");
    // il testo segue lo spazio: niente scritte in un blocco troppo stretto, una riga in uno basso
    let dentro = "";
    if (largo >= 40) {
      if (alto < 30) dentro = `<b>${segno}${oraDi(ini)} ${esc(nome)}</b>`;
      else dentro = `<b>${segno}${esc(nome)}</b><span>${orario}</span>${alto >= 46 && servizi ? `<span>${esc(servizi)}</span>` : ""}`;
    }
    const stile = pertutte
      ? `top:${yDi(ini)}px;height:${alto}px;left:0;width:100%`
      : `top:${yDi(ini)}px;height:${alto}px;left:calc(${(k + c / n) / K * 100}% + 1px);width:calc(${100 / n / K}% - 2px);z-index:${davanti};--t:${tintaDi(a)}`;
    return `<button class="app gc ${alto < 30 ? "basso" : ""} ${a.esterno ? "esterno" : ""} ${a.blocco ? "blocco" : ""} ${a.privato ? "privato" : ""} ${pertutte ? "pertutte" : ""} ${a.stato === "fatto" ? "fatto" : ""} ${a.stato === "noshow" ? "noshow" : ""}" style="${stile}" data-app="${esc(a.id)}" data-ini="${esc(a.inizio)}" aria-label="${orario} ${esc(nome)}${a.operatrice ? ", " + esc(a.operatrice) : ""}">${dentro}</button>`;
  };

  // stesse colonne colore in tutti i giorni della settimana, nello stesso ordine: l'occhio impara dove guardare
  const corsiePresenti = new Set(voci.filter(a => a.operatrice !== TUTTE).map(corsiaDi));
  const corsie = [...S.imp.operatrici, ...[...corsiePresenti].filter(c => c !== ALTRO && !S.imp.operatrici.includes(c))];
  if (corsiePresenti.has(ALTRO)) corsie.push(ALTRO);
  const colonne = giorni.map(d => {
    const k = chiaveGiorno(d);
    const chiuso = fasceChiuse(d, altezza).map(([a, b]) => `<div class="chiuso" style="top:${a}px;height:${b - a}px"></div>`).join("");
    const delDi = voci.filter(a => chiaveGiorno(new Date(a.inizio)) === k);
    const riga = k === oggi ? `<div class="adesso" style="top:${yDi(new Date())}px"></div>` : "";
    const propri = delDi.filter(a => a.operatrice !== TUTTE);
    const lista = solo ? [null] : corsie;
    const blocchi = delDi.filter(a => a.operatrice === TUTTE).map(a => blocco(a, 0, 1)).join("")
      + lista.map((cors, i) => disponi(solo ? propri : propri.filter(a => corsiaDi(a) === cors))
        .map(([a, c, n]) => blocco(a, c, n, i, lista.length)).join("")).join("");
    // righe sottili tra una corsia e l'altra, col colore dell'operatrice in cima
    const divisori = solo ? "" : corsie.map((cors, i) => `<div class="corsia" style="left:${i / corsie.length * 100}%;width:${100 / corsie.length}%;--t:${cors === ALTRO ? "#9aa0a6" : coloreDi(cors)[0]}"></div>`).join("");
    return `<div class="colonna"><div class="pista" data-pg="${k}" style="height:${altezza}px;--oraPx:${60 * PX_MIN}px">${chiuso}${divisori}${riga}${blocchi}</div></div>`;
  }).join("");

  const teste = giorni.map(d => `<button class="tab ${chiaveGiorno(d) === oggi ? "oggi" : ""}" data-vai="${chiaveGiorno(d)}" style="--c:var(--linea)">${d.toLocaleDateString("it-IT", { weekday: "short" })} ${d.getDate()}</button>`).join("");
  $("main").innerHTML = `${bannerRete()}${barra(`${voci.filter(soloApp).length} appuntamenti`)}
    <div class="filtri">${tab}</div>
    <div class="scorre" id="griglia" style="--colMin:${colMin}px;--largo:${colMin ? `calc(var(--gut) + ${colMin * giorni.length}px + var(--stacco) * ${giorni.length})` : "100%"}"><div class="testate settT"><div class="angolo"></div>${teste}</div>
      <div class="grigliaZona sett ${solo ? "solo1" : ""}"><div class="ore">${ore}</div>${colonne}</div></div>`;
  $("griglia").scrollTop = scrollPrima ?? Math.max(0, (9 * 60 - ORA_INIZIO * 60 - 30) * PX_MIN);
  S.scrollFatto = chiave;
  legaBarra(); legaApp();
  document.querySelectorAll(".pista").forEach(p => p.onclick = e => {
    if (e.target.closest(".app")) return;
    const r = p.getBoundingClientRect();
    const min = Math.round(((e.clientY - r.top) / PX_MIN + ORA_INIZIO * 60) / 15) * 15;
    apriForm({ giorno: p.dataset.pg, ora: `${due(Math.floor(min / 60))}:${due(min % 60)}`, operatrice: S.filtro });
  });
}

function disegnaMese() {
  const tab = tabOperatrici();
  const [ini] = rangeVista();
  const meseQui = S.giorno.getMonth(), oggi = chiaveGiorno(new Date());
  let totale = 0;
  const celle = [...Array(42).keys()].map(i => {
    const d = piuGiorni(ini, i), k = chiaveGiorno(d);
    const voci = delGiorno(k).filter(a => haOre(a) && soloApp(a) && visibileFiltro(a));
    const bloccato = delGiorno(k).some(a => a.blocco && visibileFiltro(a));
    const dentro = d.getMonth() === meseQui;
    if (dentro) totale += voci.length;
    const barre = S.opViste.map(n => [n, voci.filter(a => a.operatrice === n).length]).filter(x => x[1])
      .map(([n, q]) => `<i title="${esc(n)}: ${q}" style="flex:${q};${varColore(n)}"></i>`).join("");
    return `<button class="cella ${dentro ? "" : "fuori"} ${orarioDel(d) ? "" : "chiusa"} ${k === oggi ? "oggi" : ""}" data-vai="${k}">
      <span><b>${d.getDate()}</b></span>${voci.length ? `<small>${voci.length} app.</small>` : ""}${bloccato ? `<small>🔒 blocco</small>` : ""}<span class="barre">${barre}</span></button>`;
  }).join("");
  const teste = [...Array(7).keys()].map(i => `<div>${piuGiorni(ini, i).toLocaleDateString("it-IT", { weekday: "short" })}</div>`).join("");
  $("main").innerHTML = `${bannerRete()}${barra(`${totale} appuntamenti`)}
    <div class="filtri">${tab}</div><div class="testaMese">${teste}</div>
    <div class="scorre" id="griglia"><div class="mese">${celle}</div></div>`;
  legaBarra();
}

function disegnaAnno() {
  const anno = S.giorno.getFullYear();
  if (S.conteggi[anno] === undefined) caricaConteggi(anno);
  const c = S.conteggi[anno];
  const oggi = chiaveGiorno(new Date());
  const massimo = Math.max(1, ...Object.values(c || {}));
  const totale = Object.values(c || {}).reduce((t, n) => t + n, 0);
  const mesi = [...Array(12).keys()].map(m => {
    const primo = new Date(anno, m, 1), giorni = new Date(anno, m + 1, 0).getDate();
    const vuoti = (primo.getDay() + 6) % 7;
    let somma = 0;
    const celle = [...Array(giorni).keys()].map(i => {
      const k = `${anno}-${due(m + 1)}-${due(i + 1)}`, n = (c || {})[k] || 0;
      somma += n;
      const f = n / massimo;
      const stile = n ? `--l:${Math.round(90 - f * 55)}%;--t:${f > .5 ? "#fff" : "inherit"}` : "";
      return `<button data-vai="${k}" class="${k === oggi ? "oggi" : ""}" style="${stile}" title="${n} appuntamenti">${i + 1}</button>`;
    }).join("");
    return `<div class="miniMese"><button data-mese="${m}"><span>${primo.toLocaleDateString("it-IT", { month: "long" })}</span><span class="tenue">${somma || ""}</span></button>
      <div class="miniGiorni">${"<span></span>".repeat(vuoti)}${celle}</div></div>`;
  }).join("");
  const conta = c ? `${totale} appuntamenti nell'anno` : S.erroreRete ? "Conteggio non disponibile" : "Sto contando…";
  $("main").innerHTML = `${bannerRete()}${barra(conta)}
    <div class="scorre" id="griglia"><div class="anno">${mesi}</div></div>`;
  legaBarra();
  document.querySelectorAll("[data-mese]").forEach(b => b.onclick = () => {
    S.scala = "mese"; localStorage.setItem("agenda-scala", "mese");
    vaiA(new Date(anno, +b.dataset.mese, 1, 12));
  });
}

function disegnaGiorno() {
  const scrollPrima = S.scrollFatto === chiaveGiorno(S.giorno) ? $("griglia")?.scrollTop : null;
  const chiave = chiaveGiorno(S.giorno);
  const oggi = chiaveGiorno(new Date());
  const lun = lunedi(S.giorno);
  const settimana = [...Array(7).keys()].map(i => {
    const d = piuGiorni(lun, i), k = chiaveGiorno(d);
    const n = delGiorno(k).filter(a => haOre(a) && soloApp(a)).length;
    return `<button data-giorno="${k}" class="${k === chiave ? "scelto" : ""} ${k === oggi ? "oggi" : ""}">
      ${d.toLocaleDateString("it-IT", { weekday: "short" })} ${d.getDate()}<small>${orarioDel(d) ? (n ? n + " app." : "libero") : "chiuso"}</small></button>`;
  }).join("");

  const delDi = delGiorno(chiave);
  const conOre = delDi.filter(haOre);
  const esterni = conOre.filter(a => !diChi(a));
  const colonne = S.imp.operatrici.map(n => ({ nome: n, voci: conOre.filter(a => diChi(a) && (a.operatrice === n || a.operatrice === TUTTE)) }));
  [...new Set(conOre.filter(a => diChi(a) && a.operatrice !== TUTTE && !S.imp.operatrici.includes(a.operatrice)).map(a => a.operatrice))]
    .forEach(n => colonne.push({ nome: n, voci: conOre.filter(a => diChi(a) && a.operatrice === n) }));
  if (esterni.length) colonne.push({ nome: "Da Google Calendar", voci: esterni, esterna: true });

  if (!S.opViste.includes(S.filtro)) S.filtro = "";
  const visibili = S.filtro ? colonne.filter(c => c.nome === S.filtro || c.esterna) : colonne;
  const testate = colonne.map(c => !c.esterna
    ? `<button class="tab ${S.filtro === c.nome ? "attiva" : ""}" data-zoom="${esc(c.nome)}" style="${varColore(c.nome)}" aria-pressed="${S.filtro === c.nome}">${esc(c.nome)}</button>`
    : (visibili.includes(c) ? `<div class="tab stretta" style="--c:#7c8796"><span class="cal1">Calendar</span><span class="cal2">Cal.</span></div>` : "")).join("");

  const altezza = (ORA_FINE - ORA_INIZIO) * 60 * PX_MIN;
  const y = d => (d.getHours() * 60 + d.getMinutes() - ORA_INIZIO * 60) * PX_MIN;
  const orario = orarioDel(S.giorno);
  const chiuso = fasceChiuse(S.giorno, altezza).map(([a, b]) => `<div class="chiuso" style="top:${a}px;height:${b - a}px"></div>`).join("");
  const riga = chiave === oggi ? `<div class="adesso" style="top:${y(new Date())}px"></div>` : "";
  const ore = [...Array(ORA_FINE - ORA_INIZIO).keys()].map(i => i ? `<div class="ora" style="top:${i * 60 * PX_MIN}px">${ORA_INIZIO + i}:00</div>` : "").join("");

  const blocco = (a, sx, tot) => {
    const ini = new Date(a.inizio), fin = new Date(a.fine);
    const tinta = a.esterno && diChi(a) ? tintaDi(a) : "";   // scritto a mano ma riconosciuto: nel colore giusto
    const stile = `top:${y(ini)}px;height:${Math.max((fin - ini) / 60000 * PX_MIN - 2, 22)}px;left:calc(3px + ${sx / tot * 100}%);right:auto;width:calc(${100 / tot}% - 6px)${tinta ? `;--c:${tinta};--c2:${chiaro(tinta)}` : ""}`;
    const nome = a.esterno ? a.titolo : a.blocco ? `🔒 ${a.cliente}` : a.cliente;
    const segno = a.stato === "fatto" ? "✓ " : "";
    const sotto = a.esterno ? "" : (a.servizi || []).join(", ");
    return `<button class="app ${a.esterno && !diChi(a) ? "esterno" : ""} ${a.blocco ? "blocco" : ""} ${a.operatrice === TUTTE ? "pertutte" : ""} ${a.stato === "fatto" ? "fatto" : ""} ${a.stato === "noshow" ? "noshow" : ""}" style="${stile}" data-app="${esc(a.id)}" data-ini="${esc(a.inizio)}">
      <b>${segno}${oraDi(ini)} <u class="lungo">${esc(nome)}</u><u class="corto">${esc(a.esterno || a.blocco ? nome : nomeCorto(nome))}</u>${(a.usa || []).includes("laser") ? `<i class="etichetta" style="font-style:normal">LASER</i>` : ""}</b><span>${esc(sotto)}</span></button>`;
  };

  // Gli eventi sovrapposti (capita solo su Calendar o con "salva lo stesso") si affiancano.
  const blocchi = voci => {
    const ordinate = [...voci].sort((p, q) => p.inizio < q.inizio ? -1 : 1);
    const corsie = [];
    const posti = ordinate.map(a => {
      let c = corsie.findIndex(f => f <= a.inizio);
      if (c < 0) { c = corsie.length; corsie.push(""); }
      corsie[c] = a.fine;
      return [a, c];
    });
    return posti.map(([a, c]) => blocco(a, c, corsie.length || 1)).join("");
  };

  const htmlColonne = visibili.map(c => `<div class="colonna ${c.esterna ? "stretta" : ""}">
    <div class="pista" data-col="${c.esterna ? "" : esc(c.nome)}" style="height:${altezza}px;--oraPx:${60 * PX_MIN}px;${varColore(c.nome)}">${chiuso}${riga}${blocchi(c.voci)}</div></div>`).join("");

  const giornate = delDi.filter(a => a.giornata).map(a => `<div class="giornata">Tutto il giorno: ${esc(a.titolo)}</div>`).join("");

  $("main").innerHTML = `${bannerRete()}
    ${barra(`${conOre.filter(soloApp).length} appuntamenti`)}
    <div class="settimana">${settimana}</div>${giornate}
    <div class="scorre" id="griglia"><div class="testate"><div class="angolo"></div>${testate}</div>
      <div class="grigliaZona ${S.filtro ? "solo" : "compatta"}"><div class="ore">${ore}</div>${htmlColonne}</div></div>`;

  const orariVisibili = orario ? minDa(orario[0]) : 9 * 60;
  $("griglia").scrollTop = scrollPrima ?? Math.max(0, (orariVisibili - ORA_INIZIO * 60 - 30) * PX_MIN);
  S.scrollFatto = chiave;

  legaBarra(); legaApp();
  document.querySelectorAll(".pista").forEach(p => p.onclick = e => {
    if (e.target.closest(".app")) return;
    const r = p.getBoundingClientRect();
    const min = Math.round(((e.clientY - r.top) / PX_MIN + ORA_INIZIO * 60) / 15) * 15;
    const operatrice = p.dataset.col && S.imp.operatrici.includes(p.dataset.col) ? p.dataset.col : S.imp.operatrici[0];
    apriForm({ giorno: chiave, ora: `${due(Math.floor(min / 60))}:${due(min % 60)}`, operatrice });
  });
}

function vaiA(d) {
  S.giorno = d;
  disegna();
  assicura();
}

// --- Dettaglio appuntamento ----------------------------------------------

function apriDialogo(html) { $("dlgDentro").innerHTML = html; if (!$("dlg").open) $("dlg").showModal(); $("dlg").scrollTop = 0; document.body.classList.add("modulo"); }
const telefonoLink = t => `<a class="bottone" href="tel:${esc(String(t).replace(/[^\d+]/g, ""))}">Chiama</a>`;
const chiudi = () => $("dlg").close();
const giornoBreve = d => d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });

// Gli appuntamenti presi insieme (stesso "giro"), dal primo all'ultimo. Senza giro: solo quello.
const delGruppo = a => (a.gruppo ? S.appuntamenti.filter(x => !x.esterno && x.gruppo === a.gruppo) : [a])
  .sort((p, q) => p.inizio < q.inizio ? -1 : 1);

function testoConferma(lista) {
  const voci = lista.map(a => { const d = new Date(a.inizio); return `• ${giornoLungo(d)} alle ${oraDi(d)}: ${(a.servizi || []).join(", ")}`; }).join("\n");
  return (S.imp.conferma || IMPOSTAZIONI_PARTENZA.conferma)
    .replaceAll("{nome}", (lista[0].cliente || "").split(" ")[0])
    .replaceAll("{appuntamenti}", voci);
}

// Apre WhatsApp col riepilogo e segna su ognuno che la conferma è stata chiesta.
async function chiediConferma(lista) {
  const futuri = lista.filter(a => new Date(a.fine) > new Date() && a.stato !== "noshow");
  const daMandare = futuri.length ? futuri : lista;
  if (!numeroWa(daMandare[0].telefono)) return avviso("Manca il numero di telefono");
  apriWa(daMandare[0].telefono, testoConferma(daMandare));
  const ora = new Date().toISOString();
  for (const a of daMandare) await salvaServer({ ...a, conferma: ora }, true);
}

function statoConferma(a) {
  if (a.confermato) return `<div class="conferma si">✓ La cliente ha confermato</div>`;
  if (a.conferma) return `<div class="conferma">Conferma chiesta ${giornoBreve(new Date(a.conferma))} alle ${oraDi(new Date(a.conferma))}, ancora senza risposta</div>`;
  return `<div class="conferma tenue">Conferma non ancora chiesta</div>`;
}

function apriDettaglio(a) {
  const ini = new Date(a.inizio), fin = new Date(a.fine);
  const quando = `${giornoLungo(ini)}, ${oraDi(ini)}–${oraDi(fin)}`;
  // Scritti a mano su Calendar (anche se riconosciuti come extra o assenza): si guardano, non si modificano da qui,
  // altrimenti il salvataggio riscriverebbe l'evento di Calendar.
  if (a.blocco && !a.esterno) return apriBlocco({ modifica: a });
  if (a.esterno) {
    const tipo = a.privato ? `Extra di ${esc(a.operatrice)} (Banana su Calendar): in questa fascia risulta occupata.`
      : a.assenza ? `Assenza di ${esc(a.operatrice)}: in questa fascia non le vengono proposti appuntamenti.`
      : a.operatrice ? `Appuntamento di ${esc(a.operatrice)} (dal colore su Calendar).` : "";
    return apriDialogo(`<h2>${esc(a.titolo)}</h2><p class="tenue">${quando}</p>
      ${tipo ? `<p>${tipo}</p>` : ""}
      <p>È stato scritto direttamente su Google Calendar: si modifica da lì.</p>
      <div class="azioni"><button id="x">Chiudi</button></div>`), $("x").onclick = chiudi;
  }
  const gruppo = delGruppo(a);
  const altri = gruppo.filter(x => x.id !== a.id);
  apriDialogo(`<h2>${esc(a.cliente)}</h2><p class="tenue" style="margin:0">${quando}<br>${esc(a.operatrice)} · ${euro(a.prezzo || 0)}</p>
    <p>${esc((a.servizi || []).join(", "))}</p>
    ${a.note ? `<p class="tenue">Nota: ${esc(a.note)}</p>` : ""}
    ${altri.length ? `<div class="presi"><b>Preso insieme a:</b>${altri.map(x => `<div>${giornoBreve(new Date(x.inizio))} ${oraDi(new Date(x.inizio))} · ${esc((x.servizi || []).join(", "))} · ${esc(x.operatrice)}</div>`).join("")}</div>` : ""}
    ${statoConferma(a)}
    <div class="azioni">
      <button id="dFatto">${a.stato === "fatto" ? "Rimetti da fare" : "Fatto"}</button>
      <button id="dNo">${a.stato === "noshow" ? "Era presente" : "Non è venuta"}</button>
      <button id="dMod">Modifica</button>
      ${a.telefono ? `${telefonoLink(a.telefono)}<button id="dWa" class="wa">WhatsApp</button>` : ""}
    </div>
    <div class="azioni">
      ${a.telefono ? `<button id="dConf" class="wa">${a.conferma ? "Richiedi conferma" : "Chiedi conferma"}${altri.length ? ` (${gruppo.length} app.)` : ""}</button>` : ""}
      <button id="dOk">${a.confermato ? "Togli conferma" : "Ha confermato"}</button>
      <button id="dAltro">+ Altro appuntamento per lei</button>
    </div>
    <div class="azioni">
      <button id="dDel" class="pericolo">Cancella</button>
      <button id="dChiudi" style="margin-left:auto">Chiudi</button>
    </div>`);
  const cambiaStato = async st => {
    const r = await salvaServer({ ...a, stato: a.stato === st ? "prenotato" : st }, true);
    if (r) chiudi();
  };
  $("dFatto").onclick = () => cambiaStato("fatto");
  $("dNo").onclick = () => cambiaStato("noshow");
  $("dMod").onclick = () => apriForm({ modifica: a });
  $("dChiudi").onclick = chiudi;
  if ($("dWa")) $("dWa").onclick = () => apriWa(a.telefono);
  if ($("dConf")) $("dConf").onclick = async () => { await chiediConferma(gruppo); chiudi(); };
  $("dOk").onclick = async () => {
    // Una risposta "OK" vale per tutto il giro preso insieme.
    for (const x of gruppo) await salvaServer({ ...x, confermato: !a.confermato }, true);
    chiudi(); avviso(a.confermato ? "Conferma tolta" : "Segnato: ha confermato");
  };
  $("dAltro").onclick = () => apriForm({
    cliente: { id: a.clienteId, nome: a.cliente, telefono: a.telefono },
    giorno: chiaveGiorno(fin), ora: oraDi(fin), gruppo: a.gruppo || "",
  });
  let sicuro = false;
  $("dDel").onclick = async () => {
    if (!sicuro) { sicuro = true; $("dDel").textContent = "Tocca ancora per cancellare"; return; }
    try {
      const r = await api("eliminaAppuntamento", { id: a.id });
      if (!r.ok) throw new Error();
      S.appuntamenti = S.appuntamenti.filter(x => x.id !== a.id);
      S.scritture++; viaCopia(chiaveCopia(a)); scriviCopia();
      chiudi(); disegna(); avviso("Appuntamento cancellato");
    } catch (e) { avviso("Non cancellato: controlla la connessione"); }
  };
}

async function salvaServer(app, forza) {
  try {
    const r = await api("salvaAppuntamento", { appuntamento: app, forza: !!forza, operatrici: S.imp.operatrici.length, risorse: S.imp.risorse });
    if (r.ok) S.conteggi = {};
    if (r.ok) {
      S.appuntamenti = S.appuntamenti.filter(x => x.id !== r.appuntamento.id);
      S.appuntamenti.push(r.appuntamento);
      S.scritture++; notaCopia(r.appuntamento); scriviCopia();
      disegna();
      return r.appuntamento;
    }
    if (r.errore === "conflitto") return { conflitti: r.conflitti, risorsa: r.risorsa };
    avviso({ orario: "Controlla l'orario: la fine viene prima dell'inizio", "troppi-servizi": "Troppi trattamenti su un solo appuntamento: dividilo in due", sparito: "Questo appuntamento non esiste più su Google Calendar" }[r.errore] || "Non salvato, riprova");
    if (r.errore === "sparito") carica();
  } catch (e) { avviso("Non salvato: controlla la connessione"); }
  return null;
}

// --- Modulo appuntamento -------------------------------------------------
// gruppo: id del giro di appuntamenti presi insieme per la stessa cliente.
// servizi: trattamenti già scelti (per "stesso trattamento un altro giorno").

function apriForm({ giorno, ora, operatrice, cliente, modifica, gruppo, servizi } = {}) {
  const orario = orarioDel(S.giorno);
  const F = {
    id: modifica?.id,
    clienteId: modifica?.clienteId || cliente?.id || "",
    nome: modifica?.cliente || cliente?.nome || "",
    telefono: modifica?.telefono || cliente?.telefono || "",
    nuova: false,
    servizi: (modifica?.servizi || servizi || []).map(n => S.imp.servizi.find(s => s.nome === n) || { nome: n, minuti: 0, prezzo: 0 }),
    giorno: modifica ? chiaveGiorno(new Date(modifica.inizio)) : (giorno || chiaveGiorno(S.giorno)),
    ora: modifica ? oraDi(new Date(modifica.inizio)) : (ora || (orario ? orario[0] : "09:00")),
    minuti: modifica ? (new Date(modifica.fine) - new Date(modifica.inizio)) / 60000 : 30,
    minutiManuali: !!modifica,
    prezzo: modifica?.prezzo ?? 0,
    operatrice: modifica?.operatrice || operatrice || (S.imp.operatrici.length > 1 ? "" : S.imp.operatrici[0]),
    note: modifica?.note || "",
    stato: modifica?.stato || "prenotato",
    promemoria: modifica?.promemoria || "",
    conferma: modifica?.conferma || "", confermato: !!modifica?.confermato,
    gruppo: modifica?.gruppo || gruppo || "",
    cercaS: "",
  };
  // Il mese della disponibilità parte da quello del giorno scelto.
  const g0 = new Date(F.giorno + "T12:00:00");
  F.mese = new Date(g0.getFullYear(), g0.getMonth(), 1, 12);
  const presi = F.gruppo && !modifica ? delGruppo({ gruppo: F.gruppo }) : [];

  apriDialogo(`<h2>${modifica ? "Modifica appuntamento" : presi.length ? "Un altro appuntamento" : "Nuovo appuntamento"}</h2>
    ${modifica ? "" : `<button id="fBlocca" type="button">🔒 Blocca questo orario</button>`}
    ${presi.length ? `<div class="presi"><b>Già presi insieme:</b>${presi.map(x => `<div>${giornoBreve(new Date(x.inizio))} ${oraDi(new Date(x.inizio))} · ${esc((x.servizi || []).join(", "))} · ${esc(x.operatrice)}</div>`).join("")}</div>` : ""}
    <label for="fCliente">Cliente</label>
    <div id="zonaCliente"></div>
    <label for="fCerca">Trattamenti</label>
    <div id="fScelti"></div>
    <input id="fCerca" placeholder="Cerca: semi, ceretta, massaggio…" autocomplete="off">
    <div id="fLista" class="lista" hidden></div>
    <div ${S.imp.operatrici.length < 2 ? "hidden" : ""}><label>Operatrice</label><div class="ope" id="fOp"></div></div>
    <label>Disponibilità</label>
    <div class="calDisp" id="fCal"></div>
    <div class="liberi" id="fLiberi"></div>
    <div class="due">
      <div><label for="fGiorno">Giorno</label><input id="fGiorno" type="date" value="${F.giorno}"></div>
      <div><label for="fOra">Ora</label><input id="fOra" type="time" step="300" value="${F.ora}"></div>
      <div><label for="fMin">Durata (minuti)</label><input id="fMin" type="number" min="5" step="5" inputmode="numeric" value="${F.minuti}"></div>
    </div>
    <label for="fNote">Note</label>
    <input id="fNote" maxlength="300" value="${esc(F.note)}">
    <div class="totale"><span id="fDurata"></span><span id="fPrezzo"></span></div>
    <div id="fAvviso"></div>
    <div class="azioni">
      <button id="fAnnulla">Annulla</button>
      <button id="fSalva" class="pieno" style="margin-left:auto">Salva appuntamento</button>
    </div>`);

  const disegnaOp = () => {
    const scelte = [["", "Chiunque"], ...S.imp.operatrici.map(n => [n, n])];
    $("fOp").innerHTML = scelte.map(([v, t]) => `<button type="button" data-op="${esc(v)}" class="${v === F.operatrice ? "attiva" : ""}" style="${v ? varColore(v) : ""}">${esc(t)}</button>`).join("");
    document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => { F.operatrice = b.dataset.op; disegnaOp(); ricalcola(); });
  };

  // Calendario del mese: ogni giorno aperto ha una barretta (verde = tanto posto, gialla = poco, grigia = pieno).
  // Sotto, gli orari liberi del giorno scelto, per la durata e l'operatrice scelte.
  const disegnaDisp = () => {
    const usa = usoDi(F.servizi), op = F.operatrice || null, durata = F.minuti;
    const m = F.mese, primo = lunedi(m), ultimo = new Date(m.getFullYear(), m.getMonth() + 1, 0, 12);
    const settimane = Math.round((lunedi(ultimo) - primo) / 86400000 / 7) + 1;
    const fine = piuGiorni(primo, settimane * 7);
    const pronto = coperto(primo, fine);
    if (!pronto) caricaFinestra(primo, fine).then(ok => {
      if (!$("fCal")) return;
      if (ok) disegnaDisp(); else $("fLiberi").innerHTML = `<span class="tenue">Disponibilità di questo mese non caricata: controlla la connessione.</span>`;
    });
    const oggi = chiaveGiorno(new Date());
    const celle = [...Array(settimane * 7).keys()].map(i => {
      const d = piuGiorni(primo, i), k = chiaveGiorno(d);
      if (d.getMonth() !== m.getMonth()) return `<span class="fuoriM"></span>`;
      const cls = [k === F.giorno ? "sceltoG" : "", k === oggi ? "oggiG" : ""];
      let titolo = "";
      if (!orarioDel(d)) { cls.push("chiusoG"); titolo = "chiuso"; }
      else if (k < oggi) { cls.push("gPieno"); titolo = "passato"; }
      else if (pronto) {
        const liberi = slotLiberi(k, durata, op, F.id, usa) || [];
        const o = orarioDel(d), tot = Math.max(1, (minDa(o[1]) - minDa(o[0]) - durata) / 15 + 1);
        cls.push(!liberi.length ? "gPieno" : liberi.length / tot < .35 ? "gPochi" : "gLibero");
        titolo = liberi.length ? `${liberi.length} orari liberi` : "pieno";
      }
      return `<button type="button" class="${cls.join(" ")}" data-dg="${k}" title="${titolo}" aria-label="${d.getDate()} ${titolo}">${d.getDate()}<i></i></button>`;
    }).join("");
    const teste = [...Array(7).keys()].map(i => `<span class="gs">${piuGiorni(primo, i).toLocaleDateString("it-IT", { weekday: "short" }).slice(0, 3)}</span>`).join("");
    $("fCal").innerHTML = `<div class="calTesta"><button type="button" id="cmPrima" aria-label="Mese prima">‹</button>
        <strong>${m.toLocaleDateString("it-IT", { month: "long", year: "numeric" })}</strong>
        <button type="button" id="cmDopo" aria-label="Mese dopo">›</button></div>
      <div class="calGriglia">${teste}${celle}</div>
      <div class="legenda"><span><i style="background:#2e9e64"></i>libero</span><span><i style="background:#d39b17"></i>quasi pieno</span><span><i style="background:#c9c0c6"></i>pieno</span>${pronto ? "" : "<span>Sto caricando…</span>"}</div>`;
    $("cmPrima").onclick = () => { F.mese = new Date(m.getFullYear(), m.getMonth() - 1, 1, 12); disegnaDisp(); };
    $("cmDopo").onclick = () => { F.mese = new Date(m.getFullYear(), m.getMonth() + 1, 1, 12); disegnaDisp(); };
    $("fCal").querySelectorAll("[data-dg]").forEach(b => b.onclick = () => { F.giorno = b.dataset.dg; $("fGiorno").value = F.giorno; disegnaDisp(); });

    const liberi = slotLiberi(F.giorno, durata, op, F.id, usa);
    const dG = new Date(F.giorno + "T12:00:00");
    $("fLiberi").innerHTML = liberi === null ? `<span class="tenue">Sto caricando gli orari…</span>`
      : !orarioDel(dG) ? `<span class="tenue">${giornoBreve(dG)}: chiuso</span>`
      : liberi.length ? `<span class="tenue" style="width:100%">Orari liberi ${giornoBreve(dG)}${op ? " con " + esc(op) : ""}, per ${durataTesto(durata)}:</span>` + liberi.map((p, i) =>
        `<button type="button" data-lib="${i}" class="${p.ora === F.ora ? "sceltoO" : ""}" title="Libere: ${esc(p.libere.join(", "))}">${S.imp.operatrici.length > 1 && !op ? p.libere.map(n => `<i class="pallino" style="${varColore(n)}"></i>`).join("") : ""}${p.ora}</button>`).join("")
      : `<span class="tenue">${giornoBreve(dG)}: nessun orario libero per ${durataTesto(durata)}${op ? " con " + esc(op) : ""}</span>`;
    $("fLiberi").querySelectorAll("[data-lib]").forEach(b => b.onclick = () => {
      const p = liberi[+b.dataset.lib];
      F.ora = p.ora; $("fOra").value = p.ora;
      if (!F.operatrice || !p.libere.includes(F.operatrice)) { F.operatrice = p.libere[0]; disegnaOp(); }
      disegnaDisp(); avviso(`${p.ora} con ${F.operatrice}`);
    });
  };

  const ricalcola = () => {
    if (!F.minutiManuali && F.servizi.length) {
      F.minuti = Math.ceil(F.servizi.reduce((t, s) => t + s.minuti, 0) / 5) * 5;
      $("fMin").value = F.minuti;
    }
    F.prezzo = modifica && F.servizi.every(s => !s.prezzo) ? modifica.prezzo : F.servizi.reduce((t, s) => t + s.prezzo, 0);
    $("fDurata").textContent = durataTesto(F.minuti);
    $("fPrezzo").textContent = euro(F.prezzo);
    $("fScelti").innerHTML = F.servizi.map((s, i) => `<span class="chip">${esc(s.nome)}<button aria-label="Togli ${esc(s.nome)}" data-togli="${i}">×</button></span>`).join("");
    document.querySelectorAll("[data-togli]").forEach(b => b.onclick = () => { F.servizi.splice(+b.dataset.togli, 1); F.minutiManuali = false; ricalcola(); });
    disegnaDisp();
  };

  const zonaCliente = () => {
    if (F.clienteId || F.nuova) {
      $("zonaCliente").innerHTML = F.nuova
        ? `<div class="due"><input id="nNome" placeholder="Nome e cognome" value="${esc(F.nome)}"><input id="nTel" type="tel" placeholder="Telefono" value="${esc(F.telefono)}"></div>
           <label class="riga"><input id="nCons" type="checkbox"> Ha dato il consenso ai promemoria su WhatsApp</label>`
        : `<span class="chip">${esc(F.nome)}${F.telefono ? " · " + esc(F.telefono) : ""}<button id="cCambia" aria-label="Cambia cliente">×</button></span>`;
      if ($("cCambia")) $("cCambia").onclick = () => { F.clienteId = ""; F.nome = ""; F.telefono = ""; zonaCliente(); };
      return;
    }
    $("zonaCliente").innerHTML = `<input id="fCliente" placeholder="Cerca nome o telefono" autocomplete="off"><div id="cLista" class="lista" hidden></div>`;
    $("fCliente").oninput = e => {
      const q = normalizza(e.target.value.trim());
      const trovate = q ? S.clienti.filter(c => normalizza(c.nome + " " + c.telefono).includes(q)).slice(0, 8) : [];
      const l = $("cLista");
      l.hidden = !q;
      l.innerHTML = trovate.map(c => `<button data-c="${esc(c.id)}"><span>${esc(c.nome)}</span><span class="tenue">${esc(c.telefono)}</span></button>`).join("")
        + `<button id="cNuova"><b>+ Nuova cliente: ${esc(e.target.value)}</b></button>`;
      l.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        const c = S.clienti.find(x => x.id === b.dataset.c);
        F.clienteId = c.id; F.nome = c.nome; F.telefono = c.telefono; zonaCliente();
      });
      $("cNuova").onclick = () => {
        const v = e.target.value.trim();
        F.nuova = true;
        if (/^[\d\s+]+$/.test(v)) F.telefono = v; else F.nome = v;
        zonaCliente();
      };
    };
  };

  const listaServizi = () => {
    const q = normalizza(F.cercaS.trim());
    const l = $("fLista");
    l.hidden = !q;
    if (!q) return;
    const trovati = S.imp.servizi.filter(s => normalizza(s.categoria + " " + s.nome).includes(q));
    let cat = "", html = "";
    trovati.forEach(s => {
      if (s.categoria !== cat) { cat = s.categoria; html += `<div class="cat">${esc(cat)}</div>`; }
      html += `<button data-s="${esc(s.nome)}"><span>${esc(s.nome)}</span><span class="tenue">${s.minuti} min · ${euro(s.prezzo)}</span></button>`;
    });
    l.innerHTML = html || `<div class="cat">Nessun trattamento trovato</div>`;
    l.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      F.servizi.push(S.imp.servizi.find(s => s.nome === b.dataset.s));
      F.minutiManuali = false;
      F.cercaS = ""; $("fCerca").value = ""; l.hidden = true;
      ricalcola(); $("fCerca").focus();
    });
  };

  $("fCerca").oninput = e => { F.cercaS = e.target.value; listaServizi(); };
  $("fGiorno").onchange = e => {
    F.giorno = e.target.value;
    if (F.giorno) { const d = new Date(F.giorno + "T12:00:00"); F.mese = new Date(d.getFullYear(), d.getMonth(), 1, 12); disegnaDisp(); }
  };
  $("fOra").onchange = e => { F.ora = e.target.value; disegnaDisp(); };
  $("fMin").onchange = e => { F.minuti = Math.max(5, +e.target.value || 5); F.minutiManuali = true; ricalcola(); };
  $("fNote").oninput = e => F.note = e.target.value;
  $("fAnnulla").onclick = chiudi;
  if ($("fBlocca")) $("fBlocca").onclick = () => apriBlocco({ giorno: F.giorno, ora: F.ora, operatrice: F.operatrice });

  const salva = async forza => {
    if (F.nuova) {
      F.nome = $("nNome").value.trim(); F.telefono = $("nTel").value.trim();
      if (!F.nome) return mostra("Scrivi il nome della cliente");
      const doppia = F.telefono && S.clienti.find(c => c.telefono.replace(/\D/g, "") === F.telefono.replace(/\D/g, ""));
      if (doppia) return mostra(`Questo numero è già di ${doppia.nome}: cercala nell'elenco.`);
    }
    if (!F.clienteId && !F.nuova) return mostra("Scegli la cliente");
    if (!F.servizi.length) return mostra("Scegli almeno un trattamento");
    if (!F.giorno || !F.ora) return mostra("Scegli giorno e ora");
    const inizio = aData(F.giorno, F.ora), fineMs = inizio.getTime() + F.minuti * 60000;
    const fuori = !forza && fuoriOrario(F.giorno, inizio.getTime(), fineMs);
    if (fuori) {
      $("fAvviso").innerHTML = `<div class="avviso"><b>${fuori === "pausa" ? "Quell'orario cade nella pausa." : "Quell'orario è fuori dall'apertura."}</b>
        <div class="azioni"><button id="fForza">Salva lo stesso</button></div></div>`;
      $("fForza").onclick = () => salva(true);
      return $("fAvviso").scrollIntoView({ block: "center" });
    }
    $("fSalva").disabled = true;
    try {
      if (F.nuova) {
        const c = { id: nuovoId(), nome: F.nome, telefono: F.telefono, email: "", note: "", consenso: $("nCons").checked };
        const r = await api("salvaCliente", { cliente: c });
        if (!r.ok) throw new Error();
        S.clienti.push(c); F.clienteId = c.id; F.nuova = false; zonaCliente();
      }
      if (!F.operatrice) {
        const libere = libereAlle(F.giorno, inizio.getTime(), fineMs, F.id);
        if (!libere.length) { $("fSalva").disabled = false; return mostra("A quell'ora sono tutte occupate: scegli un altro orario."); }
        F.operatrice = libere[0];
      }
      // Ogni appuntamento nuovo apre un giro: quelli presi dopo per la stessa cliente ci si aggiungono.
      if (!F.gruppo && !modifica) F.gruppo = nuovoId();
      const r = await salvaServer({
        id: F.id, clienteId: F.clienteId, cliente: F.nome, telefono: F.telefono,
        servizi: F.servizi.map(s => s.nome), inizio: inizio.toISOString(),
        fine: new Date(fineMs).toISOString(),
        usa: usoDi(F.servizi), operatrice: F.operatrice, prezzo: F.prezzo, note: F.note, stato: F.stato, promemoria: F.promemoria,
        gruppo: F.gruppo, conferma: F.conferma, confermato: F.confermato,
      }, forza);
      if (r?.conflitti) {
        const nomi = r.conflitti.map(c => `${oraDi(new Date(c.inizio))} ${c.cliente || c.titolo}`).join(", ");
        $("fAvviso").innerHTML = `<div class="avviso"><b>${r.risorsa ? NOMI_RISORSE[r.risorsa] : "Quel posto è già preso"}:</b> ${esc(nomi)}
          <div class="azioni"><button id="fForza">Salva lo stesso</button></div></div>`;
        $("fForza").onclick = () => salva(true);
        $("fAvviso").scrollIntoView({ block: "center" });
      } else if (r) {
        S.giorno = new Date(r.inizio);
        disegna();
        if (modifica) { chiudi(); avviso("Appuntamento salvato"); }
        else dopoSalvato(r);
        return;
      }
    } catch (e) { mostra("Non salvato: controlla la connessione"); }
    $("fSalva").disabled = false;
  };
  const mostra = t => { $("fAvviso").innerHTML = `<div class="avviso errore">${esc(t)}</div>`; $("fAvviso").scrollIntoView({ block: "center" }); };
  $("fSalva").onclick = () => salva(false);
  zonaCliente(); disegnaOp(); ricalcola();
  // Sul telefono la tastiera aperta subito coprirebbe il modulo.
  if (!matchMedia("(pointer:coarse)").matches) ($("fCliente") || $("fCerca")).focus();
}

// Dopo un appuntamento nuovo: se ne aggiunge un altro per la stessa cliente, o si chiede la conferma.
function dopoSalvato(a) {
  const gruppo = delGruppo(a), fin = new Date(a.fine), ini = new Date(a.inizio);
  const cliente = { id: a.clienteId, nome: a.cliente, telefono: a.telefono };
  apriDialogo(`<h2>Appuntamento salvato ✓</h2>
    <div class="presi"><b>${esc(a.cliente)}${gruppo.length > 1 ? ` · ${gruppo.length} appuntamenti presi insieme` : ""}</b>
      ${gruppo.map(x => `<div>${giornoBreve(new Date(x.inizio))} ${oraDi(new Date(x.inizio))}–${oraDi(new Date(x.fine))} · ${esc((x.servizi || []).join(", "))} · ${esc(x.operatrice)}</div>`).join("")}</div>
    <p class="tenue" style="margin:10px 0 4px">Deve prendere altro?</p>
    <div class="azioni" style="margin-top:4px">
      <button id="dsDopo">+ Altro trattamento dopo, alle ${oraDi(fin)}</button>
      <button id="dsGiorno">+ Stesso trattamento un altro giorno</button>
    </div>
    ${a.telefono ? `<p class="tenue" style="margin:14px 0 4px">Quando ha preso tutto:</p>
    <div class="azioni" style="margin-top:4px"><button id="dsConf" class="wa">Manda il riepilogo e chiedi conferma</button></div>` : ""}
    <div class="azioni"><button id="dsFine" class="pieno" style="margin-left:auto">Fine</button></div>`);
  $("dsDopo").onclick = () => apriForm({ cliente, giorno: chiaveGiorno(fin), ora: oraDi(fin), gruppo: a.gruppo });
  $("dsGiorno").onclick = () => apriForm({ cliente, giorno: chiaveGiorno(piuGiorni(ini, 7)), ora: oraDi(ini), operatrice: a.operatrice, gruppo: a.gruppo, servizi: a.servizi });
  if ($("dsConf")) $("dsConf").onclick = async () => { await chiediConferma(delGruppo(a)); chiudi(); avviso("Conferma chiesta"); };
  $("dsFine").onclick = chiudi;
}

// --- Blocco orario -------------------------------------------------------

function apriBlocco({ giorno, ora, operatrice, modifica } = {}) {
  const dopoUnOra = o => { const m = Math.min(minDa(o) + 60, 23 * 60 + 45); return `${due(Math.floor(m / 60))}:${due(m % 60)}`; };
  const inizio = modifica ? new Date(modifica.inizio) : null, fine = modifica ? new Date(modifica.fine) : null;
  const B = {
    giorno: modifica ? chiaveGiorno(inizio) : (giorno || chiaveGiorno(S.giorno)),
    dalle: modifica ? oraDi(inizio) : (ora || "09:00"),
    alle: modifica ? oraDi(fine) : dopoUnOra(ora || "09:00"),
    per: modifica ? modifica.operatrice : (operatrice || TUTTE),
    motivo: modifica && modifica.cliente !== "Bloccato" ? modifica.cliente : "",
  };
  apriDialogo(`<h2>${modifica ? "Orario bloccato" : "Blocca un orario"}</h2>
    <p class="tenue" style="margin:0">In questo orario non si possono prendere appuntamenti.</p>
    <label for="bMotivo">Motivo (facoltativo)</label>
    <input id="bMotivo" maxlength="60" placeholder="Pausa, formazione, tempo libero…" value="${esc(B.motivo)}">
    <label>Per chi</label><div class="ope" id="bPer"></div>
    <div class="due tre">
      <div><label for="bGiorno">Giorno</label><input id="bGiorno" type="date" value="${B.giorno}"></div>
      <div><label for="bDalle">Dalle</label><input id="bDalle" type="time" step="300" value="${B.dalle}"></div>
      <div><label for="bAlle">Alle</label><input id="bAlle" type="time" step="300" value="${B.alle}"></div>
    </div>
    <div id="bAvviso"></div>
    ${modifica ? `<div class="azioni"><button id="bVia" class="pericolo">Sblocca</button></div>` : ""}
    <div class="azioni"><button id="bAnnulla">Chiudi</button><button id="bSalva" class="pieno" style="margin-left:auto">${modifica ? "Salva" : "Blocca"}</button></div>`);

  const disegnaPer = () => {
    const scelte = [[TUTTE, "Tutte"], ...S.imp.operatrici.map(n => [n, n])];
    if (!scelte.some(([v]) => v === B.per)) scelte.push([B.per, B.per]);
    $("bPer").innerHTML = scelte.map(([v, t]) => `<button type="button" data-per="${esc(v)}" class="${v === B.per ? "attiva" : ""}" style="${v === TUTTE ? "" : varColore(v)}">${esc(t)}</button>`).join("");
    document.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { B.per = b.dataset.per; disegnaPer(); });
  };
  disegnaPer();
  const mostra = t => $("bAvviso").innerHTML = `<div class="avviso errore">${esc(t)}</div>`;
  $("bAnnulla").onclick = chiudi;

  const salva = async forza => {
    const g = $("bGiorno").value, da = $("bDalle").value, a = $("bAlle").value;
    if (!g || !da || !a) return mostra("Scegli giorno e orario");
    if (a <= da) return mostra("L'orario di fine viene prima dell'inizio");
    $("bSalva").disabled = true;
    const r = await salvaServer({
      id: modifica?.id, blocco: true, cliente: $("bMotivo").value.trim() || "Bloccato", servizi: [], usa: [], prezzo: 0,
      operatrice: B.per, stato: "prenotato", inizio: aData(g, da).toISOString(), fine: aData(g, a).toISOString(),
    }, forza);
    $("bSalva").disabled = false;
    if (r?.conflitti) {
      const nomi = r.conflitti.map(c => `${oraDi(new Date(c.inizio))} ${c.cliente || c.titolo}`).join(", ");
      $("bAvviso").innerHTML = `<div class="avviso"><b>In quell'orario ci sono già:</b> ${esc(nomi)}
        <div class="azioni"><button id="bForza">Blocca lo stesso</button></div></div>`;
      $("bForza").onclick = () => salva(true);
    } else if (r) {
      S.giorno = new Date(r.inizio);
      chiudi(); disegna(); avviso("Orario bloccato");
    }
  };
  $("bSalva").onclick = () => salva(false);

  if (modifica) {
    let sicuro = false;
    $("bVia").onclick = async () => {
      if (!sicuro) { sicuro = true; $("bVia").textContent = "Tocca ancora per sbloccare"; return; }
      try {
        const r = await api("eliminaAppuntamento", { id: modifica.id });
        if (!r.ok) throw new Error();
        S.appuntamenti = S.appuntamenti.filter(x => x.id !== modifica.id);
        S.scritture++; viaCopia(chiaveCopia(modifica)); scriviCopia();
        S.conteggi = {};
        chiudi(); disegna(); avviso("Orario sbloccato");
      } catch (e) { mostra("Non sbloccato: controlla la connessione"); }
    };
  }
}

// --- Promemoria ----------------------------------------------------------

function numeroWa(t) {
  let n = String(t || "").replace(/\D/g, "");
  if (n.startsWith("00")) n = n.slice(2);
  if (/^3\d{8,9}$/.test(n)) n = "39" + n;
  return n;
}

function apriWa(telefono, testo) {
  const n = numeroWa(telefono);
  if (!n) return avviso("Manca il numero di telefono");
  window.open(`https://wa.me/${n}${testo ? "?text=" + encodeURIComponent(testo) : ""}`, "_blank");
}

function testoPromemoria(a) {
  const d = new Date(a.inizio);
  return S.imp.promemoria
    .replaceAll("{nome}", (a.cliente || "").split(" ")[0])
    .replaceAll("{giorno}", d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }))
    .replaceAll("{ora}", oraDi(d));
}

function disegnaPromemoria() {
  // Il prossimo giorno di apertura, così il sabato si preparano i messaggi del lunedì.
  let g = piuGiorni(new Date(), 1);
  for (let i = 0; i < 7 && !orarioDel(g); i++) g = piuGiorni(g, 1);
  S.giornoProm = S.giornoProm || chiaveGiorno(g);
  const d = new Date(S.giornoProm + "T12:00:00");
  const lista = delGiorno(S.giornoProm).filter(a => haOre(a) && !a.esterno && !a.blocco).sort((p, q) => p.inizio < q.inizio ? -1 : 1);
  const daFare = lista.filter(a => !a.promemoria).length;
  const cons = a => S.clienti.find(c => c.id === a.clienteId)?.consenso;

  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="barra" style="border:0;background:none;padding:0 0 10px">
      <button id="pPrima" aria-label="Giorno prima">‹</button>
      <strong>${giornoLungo(d)}</strong>
      <button id="pDopo" aria-label="Giorno dopo">›</button>
      <span class="tenue" style="margin-left:auto">${daFare ? daFare + " da mandare" : "Tutti mandati"}</span>
    </div>
    ${lista.length ? lista.map(a => {
      const ha = !!numeroWa(a.telefono);
      return `<div class="scheda"><b>${oraDi(new Date(a.inizio))} · ${esc(a.cliente)}</b>
        <div class="tenue">${esc((a.servizi || []).join(", "))}</div>
        ${a.confermato ? `<div class="conferma si">✓ Ha confermato</div>` : ""}
        ${cons(a) === false ? `<div class="tenue">Consenso ai promemoria non segnato nella scheda</div>` : ""}
        <div class="azioni">${a.promemoria ? `<span class="tenue">Mandato</span>` : ha
          ? `<button class="wa" data-p="${esc(a.id)}">Manda promemoria</button>`
          : `<span class="tenue">Manca il telefono</span>`}</div></div>`;
    }).join("") : `<div class="scheda tenue">Nessun appuntamento in questo giorno.</div>`}
  </div>`;

  $("pPrima").onclick = () => { S.giornoProm = chiaveGiorno(piuGiorni(d, -1)); disegna(); };
  $("pDopo").onclick = () => { S.giornoProm = chiaveGiorno(piuGiorni(d, 1)); disegna(); };
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
    const a = S.appuntamenti.find(x => x.id === b.dataset.p);
    apriWa(a.telefono, testoPromemoria(a));
    await salvaServer({ ...a, promemoria: new Date().toISOString() }, true);
  });
}

// --- Clienti -------------------------------------------------------------

function disegnaClienti() {
  const q = normalizza(S.cercaClienti.trim());
  const lista = S.clienti.filter(c => !q || normalizza(c.nome + " " + c.telefono).includes(q))
    .sort((a, b) => a.nome.localeCompare(b.nome, "it"));
  const giaAperto = document.activeElement?.id === "cerca";
  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="azioni" style="margin:0 0 10px;flex-wrap:nowrap"><input id="cerca" placeholder="Cerca nome o telefono (${S.clienti.length} clienti)" value="${esc(S.cercaClienti)}"><button id="cNew" style="white-space:nowrap">+ Nuova</button></div>
    ${lista.slice(0, 100).map(c => `<button class="scheda cliccabile" data-cl="${esc(c.id)}"><b>${esc(c.nome)}</b><div class="tenue">${esc(c.telefono) || "Senza telefono"}</div></button>`).join("") || `<div class="scheda tenue">Nessuna cliente trovata.</div>`}
  </div>`;
  $("cerca").oninput = e => { S.cercaClienti = e.target.value; disegnaClienti(); };
  if (giaAperto) { const c = $("cerca"); c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  $("cNew").onclick = () => modificaCliente({ id: nuovoId(), nome: "", telefono: "", email: "", note: "", consenso: false }, true);
  document.querySelectorAll("[data-cl]").forEach(b => b.onclick = () => schedaCliente(S.clienti.find(c => c.id === b.dataset.cl)));
}

async function schedaCliente(c) {
  S.ritorno = null;
  apriDialogo(`<h2>${esc(c.nome)}</h2>
    <p class="tenue" style="margin:0">${esc(c.telefono) || "Senza telefono"}${c.email ? " · " + esc(c.email) : ""}<br>Promemoria WhatsApp: ${c.consenso ? "consenso dato" : "consenso non segnato"}</p>
    ${c.note ? `<p>${esc(c.note)}</p>` : ""}
    <div class="azioni">
      <button class="pieno" id="sApp">+ Appuntamento</button>
      ${c.telefono ? `${telefonoLink(c.telefono)}<button id="sWa" class="wa">WhatsApp</button>` : ""}
      <button id="sMod">Modifica</button>
    </div>
    <div id="sStorico" class="tenue" style="margin-top:16px">Sto cercando…</div>
    <div class="azioni"><button id="sDel" class="pericolo">Cancella scheda</button><button id="sChiudi" style="margin-left:auto">Chiudi</button></div>`);
  $("sApp").onclick = () => apriForm({ cliente: c });
  $("sMod").onclick = () => modificaCliente(c);
  $("sChiudi").onclick = chiudi;
  if ($("sWa")) $("sWa").onclick = () => apriWa(c.telefono);
  let sicuro = false;
  $("sDel").onclick = async () => {
    if (!sicuro) { sicuro = true; $("sDel").textContent = "Tocca ancora per cancellare"; return; }
    try {
      const r = await api("eliminaCliente", { id: c.id });
      if (!r.ok) throw new Error();
      S.clienti = S.clienti.filter(x => x.id !== c.id);
      chiudi(); disegna(); avviso("Scheda cancellata");
    } catch (e) { avviso("Non cancellata: controlla la connessione"); }
  };
  try {
    const r = await api("storico", { clienteId: c.id });
    const zona = $("sStorico");
    if (!zona) return;
    const spesa = r.appuntamenti.filter(a => a.stato === "fatto").reduce((t, a) => t + (a.prezzo || 0), 0);
    const nonVenuta = r.appuntamenti.filter(a => a.stato === "noshow").length;
    // Lo storico arriva dal più recente: i prossimi si leggono dal più vicino, e ci sono tutti.
    const oggi = chiaveGiorno(new Date());
    const prossimi = r.appuntamenti.filter(a => chiaveGiorno(new Date(a.inizio)) >= oggi).reverse();
    const passati = r.appuntamenti.filter(a => chiaveGiorno(new Date(a.inizio)) < oggi).slice(0, 15);
    const riga = a => {
      const ini = new Date(a.inizio);
      const stato = { fatto: "✓ Fatto", noshow: "Non è venuta" }[a.stato] || "";
      return `<button class="rigaApp ${a.stato === "noshow" ? "annullata" : ""}" data-storico="${esc(a.id)}"><span><b>${ini.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short", year: "numeric" })}, ${oraDi(ini)}</b>
        <span class="cosa">${esc((a.servizi || []).join(", "))} · ${esc(a.operatrice)}</span></span>${stato ? `<span class="stato">${stato}</span>` : ""}</button>`;
    };
    const gruppo = (titolo, lista) => lista.length ? `<h3 style="margin:12px 0 6px;font-size:15px;color:var(--inchiostro)">${titolo}</h3>${lista.map(riga).join("")}` : "";
    zona.innerHTML = r.appuntamenti.length
      ? `<p style="margin:0 0 6px">${r.appuntamenti.length} appuntamenti · ${euro(spesa)} fatti${nonVenuta ? ` · ${nonVenuta} volte non è venuta` : ""}</p>`
        + gruppo("Prossimi appuntamenti", prossimi) + gruppo("Appuntamenti passati", passati)
      : "Ancora nessun appuntamento.";
    // Da qui si apre il dettaglio solito; chiuso quello si torna alla scheda, con i dati riletti.
    zona.querySelectorAll("[data-storico]").forEach(b => b.onclick = () => {
      S.ritorno = c;
      apriDettaglio(r.appuntamenti.find(a => a.id === b.dataset.storico));
    });
  } catch (e) { if ($("sStorico")) $("sStorico").textContent = "Storico non disponibile senza connessione."; }
}

function modificaCliente(c, nuova) {
  apriDialogo(`<h2>${nuova ? "Nuova cliente" : "Modifica cliente"}</h2>
    <label for="mNome">Nome e cognome</label><input id="mNome" value="${esc(c.nome)}">
    <label for="mTel">Telefono</label><input id="mTel" type="tel" value="${esc(c.telefono)}">
    <label for="mMail">Email</label><input id="mMail" type="email" value="${esc(c.email)}">
    <label for="mNote">Note fisse</label><textarea id="mNote" rows="3">${esc(c.note)}</textarea>
    <label class="riga"><input id="mCons" type="checkbox" ${c.consenso ? "checked" : ""}> Ha dato il consenso ai promemoria su WhatsApp</label>
    <div id="mErr"></div>
    <div class="azioni"><button id="mAnn">Annulla</button><button id="mSalva" class="pieno" style="margin-left:auto">Salva</button></div>`);
  $("mAnn").onclick = chiudi;
  $("mSalva").onclick = async () => {
    const x = { ...c, nome: $("mNome").value.trim(), telefono: $("mTel").value.trim(), email: $("mMail").value.trim(), note: $("mNote").value.trim(), consenso: $("mCons").checked };
    if (!x.nome) return $("mErr").innerHTML = `<div class="avviso errore">Scrivi il nome</div>`;
    const doppia = x.telefono && S.clienti.find(o => o.id !== x.id && o.telefono.replace(/\D/g, "") === x.telefono.replace(/\D/g, ""));
    if (doppia) return $("mErr").innerHTML = `<div class="avviso errore">Questo numero è già di ${esc(doppia.nome)}</div>`;
    try {
      const r = await api("salvaCliente", { cliente: x });
      if (!r.ok) throw new Error();
      S.clienti = S.clienti.filter(o => o.id !== x.id); S.clienti.push(x);
      chiudi(); disegna(); avviso("Cliente salvata");
    } catch (e) { $("mErr").innerHTML = `<div class="avviso errore">Non salvata: controlla la connessione</div>`; }
  };
}

          <li><b>Non modificare il file:</b> leggilo e chiudilo senza salvare, altrimenti puoi cancellare le righe aggiunte nel frattempo.</li>
          <li><b>Se ti chiede di creare un file nuovo:</b> dagli un nome nuovo. Non scegliere il file vecchio, verrebbe svuotato.</li>
          <li><b>Privacy:</b> nel file ci sono nomi e telefoni delle clienti, quindi il computer deve avere una password.</li>
        </ul>
      </details></div>
    <div class="azioni" style="margin-bottom:20px"><button id="iSalva" class="pieno">Salva impostazioni</button></div>
    <p class="tenue">Versione ${VERSIONE_APP}</p>
  </div>`;

  disegnaStatoCopia();
  document.querySelectorAll("[data-k]").forEach(e => e.onchange = () => {
    const s = I.servizi[+e.dataset.i], k = e.dataset.k;
    s[k] = k === "nome" ? e.value.trim() : k === "usa" ? e.value : Math.max(0, +e.value || 0);
    if (k === "minuti") delete s.stimata;
  });
  document.querySelectorAll("[data-sposta]").forEach(e => e.onchange = () => {
    const s = I.servizi.splice(+e.dataset.sposta, 1)[0];
    s.categoria = e.value;
    I.servizi.push(s);                       // va in fondo alla sua nuova area
    ridisegna(); avviso(`${s.nome} spostato in ${s.categoria}`);
  });
  document.querySelectorAll("[data-via]").forEach(b => b.onclick = () => { I.servizi.splice(+b.dataset.via, 1); ridisegna(); });
  document.querySelectorAll("[data-area]").forEach(e => e.onchange = () => {
    const vecchio = I.categorie[+e.dataset.area], nuovo = e.value.trim();
    if (!nuovo || (nuovo !== vecchio && I.categorie.includes(nuovo))) { avviso(nuovo ? "C'è già un'area con questo nome" : "Il nome dell'area non può essere vuoto"); return ridisegna(); }
    I.categorie[+e.dataset.area] = nuovo;
    I.servizi.forEach(s => { if (s.categoria === vecchio) s.categoria = nuovo; });
    ridisegna();
  });
  const scambia = (a, b) => { [I.categorie[a], I.categorie[b]] = [I.categorie[b], I.categorie[a]]; ridisegna(); };
  document.querySelectorAll("[data-su]").forEach(b => b.onclick = () => scambia(+b.dataset.su, +b.dataset.su - 1));
  document.querySelectorAll("[data-giu]").forEach(b => b.onclick = () => scambia(+b.dataset.giu, +b.dataset.giu + 1));
  document.querySelectorAll("[data-viaarea]").forEach(b => b.onclick = () => { I.categorie.splice(+b.dataset.viaarea, 1); ridisegna(); });
  document.querySelectorAll("[data-aggin]").forEach(b => b.onclick = () => {
    const categoria = I.categorie[+b.dataset.aggin];
    I.servizi.push({ categoria, nome: "Nuovo trattamento", minuti: 30, prezzo: 0, usa: "cabina" });
    ridisegna();
    const nuovo = document.querySelector(`[data-i="${I.servizi.length - 1}"][data-k="nome"]`);
    nuovo?.focus(); nuovo?.select();
  });
  $("iNuovaArea").onclick = () => {
    let nome = "Nuova area", n = 2;
    while (I.categorie.includes(nome)) nome = `Nuova area ${n++}`;
    I.categorie.push(nome);
    ridisegna();
    const e = document.querySelector(`[data-area="${I.categorie.length - 1}"]`);
    e?.focus(); e?.select();
  };
  document.querySelectorAll("[data-ris]").forEach(e => e.onchange = () => I.risorse[e.dataset.ris] = Math.max(0, +e.value || 0));
  $("iOp").onchange = e => I.operatrici = e.target.value.split("\n").map(x => x.trim()).filter(Boolean);
  $("iProm").onchange = e => I.promemoria = e.target.value;
  $("iConf").onchange = e => I.conferma = e.target.value;
  const orari = g => {
    const su = document.querySelector(`[data-aperto="${g}"]`).checked;
    I.orari[g] = su ? [document.querySelector(`[data-da="${g}"]`).value, document.querySelector(`[data-a="${g}"]`).value] : null;
    ridisegna();                              // la pausa compare solo nei giorni aperti
  };
  ordine.forEach(g => document.querySelectorAll(`[data-aperto="${g}"],[data-da="${g}"],[data-a="${g}"]`).forEach(e => e.onchange = () => orari(g)));
  const pausa = g => {
    const su = document.querySelector(`[data-pausa="${g}"]`).checked;
    I.pause[g] = su ? [document.querySelector(`[data-pda="${g}"]`).value, document.querySelector(`[data-pa="${g}"]`).value] : null;
  };
  ordine.forEach(g => document.querySelectorAll(`[data-pausa="${g}"],[data-pda="${g}"],[data-pa="${g}"]`).forEach(e => e.onchange = () => pausa(g)));
  $("iPausaTutti").onclick = () => {
    const aperti = ordine.filter(g => I.orari[g]);
    const p = I.pause[aperti[0]];
    if (!p) return avviso(`Prima segna la pausa del ${nomiGiorni[aperti[0]] || "primo giorno"}`);
    aperti.forEach(g => I.pause[g] = [...p]);
    ridisegna(); avviso("Pausa copiata su tutti i giorni aperti");
  };
  $("iSalva").onclick = async () => {
    if (!I.operatrici.length) return avviso("Serve almeno un'operatrice");
    const brutta = ordine.find(g => I.pause[g] && I.orari[g] && !(I.pause[g][1] > I.pause[g][0] && I.pause[g][0] >= I.orari[g][0] && I.pause[g][1] <= I.orari[g][1]));
    if (brutta !== undefined) return avviso(`Pausa del ${nomiGiorni[brutta]}: deve stare dentro l'orario di apertura`);
    I.servizi = I.servizi.filter(s => s.nome);
    const nomi = I.servizi.map(s => s.nome.toLowerCase());
    const doppio = I.servizi.find((s, i) => nomi.indexOf(s.nome.toLowerCase()) !== i);
    if (doppio) return avviso(`Due trattamenti si chiamano "${doppio.nome}": cambia un nome`);
    // Si salvano in ordine di area, così anche la ricerca nel modulo li mostra raggruppati.
    I.servizi = I.categorie.flatMap(c => I.servizi.filter(s => s.categoria === c));
    I.servizi.forEach(s => delete s.stimata);
    try {
      const r = await api("salvaImpostazioni", { impostazioni: I });
      if (!r.ok) throw new Error();
      S.imp = normalizzaImp(JSON.parse(JSON.stringify(I))); S.impBozza = null;
      disegna(); avviso("Impostazioni salvate");
    } catch (e) { avviso("Non salvate: controlla la connessione"); }
  };
}

// --- Incassi -------------------------------------------------------------
// Sezione per Alessia: la password la controlla lo script su Google, non il telefono.
// Appena si esce dalla sezione la password si dimentica e va riscritta.

const INC = { pwd: null, impostata: null, scala: "mese", giorno: new Date(), chiave: "", dati: null, errore: "" };
const NOMI_SCALA_INC = { giorno: "Giorno", settimana: "Settimana", mese: "Mese", anno: "Anno" };

function rangeIncassi() {
  const d = INC.giorno;
  if (INC.scala === "giorno") { const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return [a, piuGiorni(a, 1)]; }
  if (INC.scala === "settimana") { const a = lunedi(d); return [a, piuGiorni(a, 7)]; }
  if (INC.scala === "mese") return [new Date(d.getFullYear(), d.getMonth(), 1), new Date(d.getFullYear(), d.getMonth() + 1, 1)];
  return [new Date(d.getFullYear(), 0, 1), new Date(d.getFullYear() + 1, 0, 1)];
}

function chiudiIncassi() { Object.assign(INC, { pwd: null, chiave: "", dati: null, errore: "" }); }

async function caricaIncassi(ini, fin, chiave) {
  try {
    const r = await api("incassi", { password: INC.pwd, dal: ini.toISOString(), al: fin.toISOString() });
    if (INC.chiave !== chiave) return;
    if (r.ok) { INC.dati = r.voci; INC.errore = ""; }
    else if (r.errore === "password" || r.errore === "nessuna-password") { chiudiIncassi(); INC.impostata = null; avviso("La password è cambiata: riscrivila"); }
    else INC.errore = "Incassi non disponibili, riprova.";
  } catch (e) { if (INC.chiave === chiave) INC.errore = "Senza connessione gli incassi non si vedono."; }
  if (S.vista === "incassi") disegna();
}

function disegnaIncassi() {
  if (!INC.pwd) return disegnaSblocco();
  const [ini, fin] = rangeIncassi(), chiave = ini.toISOString() + fin.toISOString();
  if (INC.chiave !== chiave) { INC.chiave = chiave; INC.dati = null; INC.errore = ""; caricaIncassi(ini, fin, chiave); }

  const d = INC.giorno;
  const titolo = INC.scala === "giorno" ? giornoLungo(d)
    : INC.scala === "settimana" ? `${piuGiorni(fin, -7).getDate()} ${ini.toLocaleDateString("it-IT", { month: "short" })} – ${piuGiorni(fin, -1).getDate()} ${piuGiorni(fin, -1).toLocaleDateString("it-IT", { month: "short", year: "numeric" })}`
    : INC.scala === "mese" ? d.toLocaleDateString("it-IT", { month: "long", year: "numeric" }) : String(d.getFullYear());
  const barraInc = `<div class="barra" style="border:0;background:none;padding:0 0 6px">
      <button id="incPrima" aria-label="Periodo prima">‹</button>
      <button id="incOggi">Oggi</button>
      <button id="incDopo" aria-label="Periodo dopo">›</button>
      <strong>${titolo}</strong>
      <div class="scale" role="group" aria-label="Periodo">${Object.entries(NOMI_SCALA_INC).map(([k, t]) => `<button data-incscala="${k}" class="${k === INC.scala ? "attiva" : ""}">${t}</button>`).join("")}</div>
    </div>`;

  let corpo;
  if (INC.errore) corpo = `<div class="scheda">${esc(INC.errore)}<div class="azioni"><button id="incRiprova">Riprova</button></div></div>`;
  else if (!INC.dati) corpo = `<div class="scheda tenue">Sto contando…</div>`;
  else corpo = tabelleIncassi(INC.dati, ini, fin);

  $("main").innerHTML = `${bannerRete()}<div class="contenuto">
    <div class="azioni" style="margin:0 0 10px;align-items:center"><b style="font-size:18px">🔒 Incassi</b>
      <button id="incPwd" style="margin-left:auto">Cambia password</button><button id="incChiudi">Chiudi a chiave</button></div>
    ${barraInc}${corpo}
    <p class="tenue">Contano tutti gli appuntamenti del periodo, tranne le clienti che non sono venute e gli orari bloccati. Le ore sono quelle passate con le clienti (due trattamenti insieme contano una volta sola), non le ore di presenza in istituto.</p>
  </div>`;

  const passoInc = dir => {
    const x = INC.giorno;
    INC.giorno = INC.scala === "giorno" ? piuGiorni(x, dir) : INC.scala === "settimana" ? piuGiorni(x, 7 * dir)
      : INC.scala === "mese" ? new Date(x.getFullYear(), x.getMonth() + dir, 1, 12) : new Date(x.getFullYear() + dir, x.getMonth(), 1, 12);
    disegna();
  };
  $("incPrima").onclick = () => passoInc(-1);
  $("incDopo").onclick = () => passoInc(1);
  $("incOggi").onclick = () => { INC.giorno = new Date(); disegna(); };
  document.querySelectorAll("[data-incscala]").forEach(b => b.onclick = () => { INC.scala = b.dataset.incscala; disegna(); });
  document.querySelectorAll("[data-incvai]").forEach(b => b.onclick = () => {
    const [scala, k] = b.dataset.incvai.split("|");
    INC.scala = scala; INC.giorno = new Date(k + "T12:00:00"); disegna();
  });
  if ($("incRiprova")) $("incRiprova").onclick = () => { INC.chiave = ""; disegna(); };
  $("incChiudi").onclick = () => { chiudiIncassi(); disegna(); };
  $("incPwd").onclick = cambiaPasswordIncassi;
}

// voci: [operatrice, prezzo, inizio, fine, fatto]
function tabelleIncassi(voci, ini, fin) {
  const adesso = Date.now();
  const nomi = [...new Set([...S.imp.operatrici, ...voci.map(v => v[0])])].filter(n => n && n !== TUTTE);
  // Minuti con clienti: gli intervalli sovrapposti della stessa operatrice si contano una volta.
  const minutiDi = lista => {
    const iv = lista.map(v => [v[2], v[3]]).sort((a, b) => a[0] - b[0]);
    let tot = 0, fine = -Infinity;
    iv.forEach(([a, b]) => { if (b <= fine) return; tot += b - Math.max(a, fine); fine = b; });
    return tot / 60000;
  };
  const per = nomi.map(n => {
    const sue = voci.filter(v => v[0] === n);
    return { nome: n, n: sue.length, euro: sue.reduce((t, v) => t + v[1], 0), minuti: minutiDi(sue) };
  }).filter(o => o.n || S.imp.operatrici.includes(o.nome));
  const tot = { n: voci.length, euro: voci.reduce((t, v) => t + v[1], 0), minuti: per.reduce((t, o) => t + o.minuti, 0) };
  const fatti = voci.filter(v => v[3] <= adesso).reduce((t, v) => t + v[1], 0);
  const futuri = tot.euro - fatti;
  const allOra = o => o.minuti ? euro(o.euro / (o.minuti / 60)) : "—";
  const ore = m => m ? durataTesto(Math.round(m)) : "—";
  const quota = o => tot.euro ? Math.round(o.euro / tot.euro * 100) : 0;

  const tessere = `<div class="tessere">
    <div class="tessera"><small>Fatturato</small><b>${euro(tot.euro)}</b><span>${futuri > 0 ? `${euro(fatti)} già passati · ${euro(futuri)} ancora da fare` : "tutto già passato"}</span></div>
    <div class="tessera"><small>Appuntamenti</small><b>${tot.n}</b><span>${tot.n ? `${euro(tot.euro / tot.n)} in media` : "&nbsp;"}</span></div>
    <div class="tessera"><small>Ore con clienti</small><b>${ore(tot.minuti)}</b><span>somma delle operatrici</span></div>
    <div class="tessera"><small>Fatturato all'ora</small><b>${allOra(tot)}</b><span>&nbsp;</span></div>
  </div>`;

  const tabOp = `<h3 style="font-size:15px;margin:14px 0 4px">Per operatrice</h3><div class="tabellaScorre"><table class="inc">
    <thead><tr><th>Operatrice</th><th>App.</th><th>Ore</th><th>Fatturato</th><th>€ all'ora</th><th class="nascondiTel">Quota</th></tr></thead>
    <tbody>${per.map(o => `<tr title="${esc(o.nome)}: ${euro(o.euro)}, ${quota(o)}% del totale">
      <td><i class="pallino" style="${varColore(o.nome)}"></i>${esc(o.nome)}<span class="quota" style="width:${quota(o)}%;${varColore(o.nome)}"></span></td>
      <td>${o.n}</td><td>${ore(o.minuti)}</td><td>${euro(o.euro)}</td><td>${allOra(o)}</td><td class="nascondiTel">${quota(o)}%</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Totale</td><td>${tot.n}</td><td>${ore(tot.minuti)}</td><td>${euro(tot.euro)}</td><td>${allOra(tot)}</td><td class="nascondiTel">100%</td></tr></tfoot>
  </table></div>`;

  // Dettaglio nel tempo: anno → mesi, mese e settimana → giorni. Un tocco porta a quel periodo.
  if (INC.scala === "giorno") return tessere + tabOp;
  const pezzi = [];
  if (INC.scala === "anno") {
    for (let m = 0; m < 12; m++) {
      const a = new Date(ini.getFullYear(), m, 1).getTime(), b = new Date(ini.getFullYear(), m + 1, 1).getTime();
      const q = voci.filter(v => v[2] >= a && v[2] < b);
      pezzi.push({ nome: new Date(a).toLocaleDateString("it-IT", { month: "long" }), vai: `mese|${chiaveGiorno(new Date(a))}`, n: q.length, euro: q.reduce((t, v) => t + v[1], 0) });
    }
  } else {
    for (let g = new Date(ini); g < fin; g = piuGiorni(g, 1)) {
      const a = g.getTime(), b = piuGiorni(g, 1).getTime();
      const q = voci.filter(v => v[2] >= a && v[2] < b);
      if (!q.length && INC.scala === "mese") continue;
      pezzi.push({ nome: g.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" }), vai: `giorno|${chiaveGiorno(g)}`, n: q.length, euro: q.reduce((t, v) => t + v[1], 0) });
    }
  }
  const max = Math.max(1, ...pezzi.map(p => p.euro));
  const tabTempo = `<h3 style="font-size:15px;margin:14px 0 4px">${INC.scala === "anno" ? "Mese per mese" : "Giorno per giorno"}</h3><div class="tabellaScorre"><table class="inc">
    <thead><tr><th>${INC.scala === "anno" ? "Mese" : "Giorno"}</th><th>App.</th><th>Fatturato</th></tr></thead>
    <tbody>${pezzi.map(p => `<tr title="${esc(p.nome)}: ${euro(p.euro)}"><td><button class="rigaApp" style="margin:0;min-height:36px;padding:2px 0;border:0;background:none;display:block;text-transform:capitalize" data-incvai="${p.vai}">${esc(p.nome)}<span class="quota" style="width:${p.euro / max * 100}%"></span></button></td>
      <td>${p.n}</td><td>${euro(p.euro)}</td></tr>`).join("") || `<tr><td colspan="3" class="tenue">Nessun appuntamento nel periodo.</td></tr>`}</tbody>
  </table></div>`;
  return tessere + tabOp + tabTempo;
}

async function disegnaSblocco() {
  if (INC.impostata === null) {
    $("main").innerHTML = `<div class="contenuto"><div class="scheda tenue">Un momento…</div></div>`;
    try {
      const r = await api("statoPassword");
      if (!r.ok) throw new Error();
      INC.impostata = r.impostata;
    } catch (e) {
      $("main").innerHTML = `<div class="contenuto"><div class="scheda">Senza connessione gli incassi non si vedono.<div class="azioni"><button id="incRiprova">Riprova</button></div></div></div>`;
      $("incRiprova").onclick = () => disegna();
      return;
    }
    if (S.vista === "incassi") disegna();
    return;
  }
  const nuova = !INC.impostata;
  $("main").innerHTML = `<div class="contenuto"><form class="scheda" id="incForm" style="max-width:420px;margin:20px auto">
    <h2 style="margin:0 0 6px;font-size:19px">🔒 Incassi</h2>
    <p class="tenue" style="margin:0">${nuova ? "Prima volta: crea la password che userà solo Alessia. Almeno 4 caratteri. Segnala in un posto sicuro: se si perde, può azzerarla solo Gabriele." : "Sezione riservata ad Alessia."}</p>
    <input type="text" name="utente" value="Alessia" autocomplete="username" hidden>
    <label for="incP1">${nuova ? "Nuova password" : "Password"}</label>
    <input id="incP1" type="password" autocomplete="${nuova ? "new-password" : "current-password"}" required>
    ${nuova ? `<label for="incP2">Riscrivila</label><input id="incP2" type="password" autocomplete="new-password" required>` : ""}
    <div id="incErr"></div>
    <div class="azioni"><button class="pieno" type="submit" style="margin-left:auto">${nuova ? "Crea la password" : "Entra"}</button></div>
  </form></div>`;
  const errore = t => $("incErr").innerHTML = `<div class="avviso errore">${esc(t)}</div>`;
  if (!matchMedia("(pointer:coarse)").matches) $("incP1").focus();
  $("incForm").onsubmit = async e => {
    e.preventDefault();
    const p = $("incP1").value;
    try {
      if (nuova) {
        if (p.length < 4) return errore("Almeno 4 caratteri");
        if (p !== $("incP2").value) return errore("Le due password sono diverse");
        const r = await api("impostaPassword", { nuova: p });
        if (!r.ok) { INC.impostata = null; return errore("Qualcuno l'ha già creata: ricarica la pagina"); }
        INC.impostata = true;
      } else {
        const ora = new Date().toISOString();
        const r = await api("incassi", { password: p, dal: ora, al: ora });
        if (!r.ok) return errore(r.errore === "password" ? "Password sbagliata" : "Non riesco a controllarla, riprova");
      }
      INC.pwd = p; INC.chiave = "";
      disegna();
    } catch (err) { errore("Senza connessione non si può entrare"); }
  };
}

function cambiaPasswordIncassi() {
  apriDialogo(`<h2>Cambia password degli incassi</h2>
    <form id="cpForm"><input type="text" value="Alessia" autocomplete="username" hidden>
    <label for="cpN1">Nuova password</label><input id="cpN1" type="password" autocomplete="new-password" required>
    <label for="cpN2">Riscrivila</label><input id="cpN2" type="password" autocomplete="new-password" required>
    <div id="cpErr"></div>
    <div class="azioni"><button type="button" id="cpAnn">Annulla</button><button type="submit" class="pieno" style="margin-left:auto">Cambia</button></div></form>`);
  $("cpAnn").onclick = chiudi;
  const errore = t => $("cpErr").innerHTML = `<div class="avviso errore">${esc(t)}</div>`;
  $("cpForm").onsubmit = async e => {
    e.preventDefault();
    const n = $("cpN1").value;
    if (n.length < 4) return errore("Almeno 4 caratteri");
    if (n !== $("cpN2").value) return errore("Le due password sono diverse");
    try {
      const r = await api("impostaPassword", { password: INC.pwd, nuova: n });
      if (!r.ok) return errore("Non cambiata: riprova");
      INC.pwd = n; chiudi(); avviso("Password cambiata");
    } catch (err) { errore("Senza connessione non si può cambiare"); }
  };
}
